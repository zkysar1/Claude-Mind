name: Publish mind seed

# The seed-publication lane (g-365-06). This repo is the STAGING tree of the
# Mind promotion chain (Ayoai-Mind dev -> Claude-Mind staging -> customer
# envs), and its tracked tree IS the mind-seed content: every Vinheim
# customer environment pulls mind-seed.tar.gz at boot (provision-env.sh step
# 0b ETag re-pull -> bootstrap.sh step 3 sha-gated tar-over). Before this
# workflow, publication was a hand-run tarball push (README SEED-BUILD-OWNER
# in Ayoai-Environment-Server/ops/mind-sidecar) — measured a month stale, and
# the July 2026 artifact shipped with ZERO .claude/ entries, so fresh envs
# had no framework skill catalog at all. A merge to main IS a framework
# release; this lane makes the artifact follow it.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.claude/**'
      - 'mind_api/**'
      - 'CLAUDE.md'
      - 'requirements.txt'
      - 'SETUP.md'
      - 'README.md'
      - '.env.example'
      - '.gitattributes'
      - '.github/workflows/publish-mind-seed.yml'
  workflow_dispatch:

# OIDC keyless (g-010-77 pattern). id-token: write mints the token;
# contents: read is required explicitly for actions/checkout because a
# permissions block replaces the whole default set.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # git archive ships TRACKED FILES ONLY — untracked state (.env.local,
      # local-paths.conf, per-box cruft) is excluded by construction, and the
      # prefix normalizes the top-level dir to mind-seed/ (the name
      # bootstrap.sh step 3 expects). gzip -n omits the timestamp so an
      # unchanged tree republishes byte-identical.
      - name: Build seed tarball
        run: |
          git archive --format=tar --prefix=mind-seed/ HEAD | gzip -n > mind-seed.tar.gz
          ls -la mind-seed.tar.gz

      # The gate BEFORE any upload. Checks (a)-(c) are the SEED-BUILD-OWNER
      # verify list from the consuming repo's README, mechanized; (d) pins the
      # exact July-2026 regression (an artifact with no .claude/ shipped and
      # fresh envs lost the whole framework skill catalog); (e) refuses real
      # secret material — this repo is public, but the artifact also lands on
      # every customer box, so scan anyway. AKIAIOSFODNN7EXAMPLE is AWS's
      # documentation placeholder and appears in test fixtures; it is the one
      # allowed match.
      - name: Verify seed (structure + completeness + secret scan)
        run: |
          tar -tzf mind-seed.tar.gz > entries.txt
          echo "entries: $(wc -l < entries.txt)"
          # (a) single mind-seed/ top-level dir
          TOP="$(awk -F/ '{print $1}' entries.txt | sort -u)"
          [ "$TOP" = "mind-seed" ] || { echo "::error title=Seed shape::top-level is '$TOP', want exactly 'mind-seed'"; exit 1; }
          # (b) no per-deployment state — these never travel in the seed
          if grep -E '^mind-seed/(world/|meta/|agents/|\.env\.local$|\.claude/settings\.local\.json$)' entries.txt; then
            echo "::error title=State leak::seed contains world/meta/agents state or local settings"; exit 1
          fi
          # (c) framework completeness
          grep -q '^mind-seed/CLAUDE.md$' entries.txt || { echo "::error::CLAUDE.md missing"; exit 1; }
          grep -q '^mind-seed/core/scripts/' entries.txt || { echo "::error::core/scripts missing"; exit 1; }
          # (d) the July-2026 regression pin: the skill catalog MUST ship
          SKILLS=$(grep -c '^mind-seed/\.claude/skills/.*SKILL\.md$' entries.txt || true)
          RULES=$(grep -c '^mind-seed/\.claude/rules/.*\.md$' entries.txt || true)
          echo "skills: $SKILLS  rules: $RULES"
          [ "$SKILLS" -ge 40 ] || { echo "::error title=Catalog regression::only $SKILLS SKILL.md files (want >=40) — the July-2026 no-.claude artifact class"; exit 1; }
          [ "$RULES" -ge 20 ] || { echo "::error title=Catalog regression::only $RULES rule files (want >=20)"; exit 1; }
          # (e) secret material
          mkdir -p seed-extract && tar -xzf mind-seed.tar.gz -C seed-extract
          if grep -rE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----' seed-extract/ 2>/dev/null | grep -v 'AKIAIOSFODNN7EXAMPLE' | grep -q .; then
            grep -rE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----' seed-extract/ 2>/dev/null | grep -v 'AKIAIOSFODNN7EXAMPLE' | head -5
            echo "::error title=Secret leak::real credential patterns in the seed"; exit 1
          fi
          echo "verify: all gates green"

      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377285145:role/ayoai-mind-seed-publish-oidc
          aws-region: us-east-2

      # Versioned copy first, latest pointer second: if the run dies between
      # the two, latest still points at a fully-uploaded prior artifact and
      # the versioned copy is orphaned-but-harmless. The latest key
      # (artifacts/mind-seed.tar.gz) is what provision-env.sh step 0b reads —
      # its ETag change is the fleet-wide update signal.
      - name: Upload artifact (versioned + latest)
        run: |
          TAR_SHA=$(sha256sum mind-seed.tar.gz | cut -d' ' -f1)
          echo "TAR_SHA=$TAR_SHA" >> "$GITHUB_ENV"
          aws s3 cp mind-seed.tar.gz "s3://ayoai-jar-deployments/mind-sidecar-deployments/artifacts/versions/${{ github.sha }}/mind-seed.tar.gz"
          aws s3 cp mind-seed.tar.gz "s3://ayoai-jar-deployments/mind-sidecar-deployments/artifacts/mind-seed.tar.gz"

      # Append-only publication record beside the artifact. Read-modify-write
      # is race-safe in practice: this workflow is the only writer and runs
      # serially per main push. A missing changelog (first run) starts empty.
      - name: Record changelog entry
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CL=s3://ayoai-jar-deployments/mind-sidecar-deployments/artifacts/mind-seed-changelog.jsonl
          aws s3 cp "$CL" changelog.jsonl 2>/dev/null || : > changelog.jsonl
          jq -nc \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_repo "${{ github.repository }}" \
            --arg source_sha "${{ github.sha }}" \
            --arg source_ref "${{ github.ref_name }}" \
            --arg trigger "${{ github.event_name }}" \
            --arg tar_sha256 "$TAR_SHA" \
            --arg run_url "$RUN_URL" \
            --argjson entries "$(wc -l < entries.txt)" \
            --argjson bytes "$(stat -c%s mind-seed.tar.gz)" \
            '{built_at:$built_at,source_repo:$source_repo,source_sha:$source_sha,source_ref:$source_ref,trigger:$trigger,tar_sha256:$tar_sha256,entries:$entries,bytes:$bytes,run_url:$run_url}' >> changelog.jsonl
          aws s3 cp changelog.jsonl "$CL"
          echo "published: sha256=$TAR_SHA source=${{ github.sha }}"

      # ANY failure -> agent inbox, deliberately ungated on event_name
      # (g-115-3334). This repo has no CI secrets (public repo), so the alert
      # re-assumes the SAME publish role, whose only SES grant is
      # FromAddress-locked to agents@zacharykysar.com. The zacharykysar.com
      # forwarder routes that mailbox to the S3 agent inbox; this repo's lane
      # never touches that domain, so the alert is terminal (guard-84
      # loop-safe). If the OIDC assume itself is what broke, the alert cannot
      # send — continue-on-error keeps that failure from masking the real one.
      - name: Configure AWS credentials for failure alert (OIDC, keyless)
        if: failure()
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377285145:role/ayoai-mind-seed-publish-oidc
          aws-region: us-east-2
      - name: Alert agent inbox on publish failure
        if: failure()
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-2
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg repo "$REPO" --arg sha "$SHA" --arg event "$EVENT" --arg run "$RUN_URL" \
            '{FromEmailAddress:"agents@zacharykysar.com",Destination:{ToAddresses:["agents@zacharykysar.com"]},Content:{Simple:{Subject:{Data:("[SEED-PUBLISH-FAIL] "+$repo+" ("+$event+")")},Body:{Text:{Data:("mind-seed publication failed.\nrepo: "+$repo+"\nsha: "+$sha+"\ntrigger: "+$event+"\nrun: "+$run+"\n\nCustomer envs keep pulling the LAST published seed until this lane is fixed — stale, not broken.\nAutomated alert -- do NOT reply by email; investigate the run and file an Investigate goal.")}}}}}' > seed-alert.json
          aws sesv2 send-email --cli-input-json file://seed-alert.json
