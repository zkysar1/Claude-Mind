[pytest]
# 2026-05-19 (Phase 2.5.B): test trees co-located with subsystems.
# - mind_api/tests/       daemon endpoint + runtime integration tests (was tests/runtime/)
# - core/tests/gates/     framework gate-extraction equivalence tests (was tests/gates/)
# - core/scripts/tests/   framework unit tests (unchanged)
cache_dir = core/.pytest_cache
testpaths =
    mind_api/tests
    core/tests/gates
    core/scripts/tests
# Quieter default output; tests that need verbose can override with -v.
addopts = -q
# Hang-bounding (g-115-1496, 2026-06-17): the daemon-safe full suite
# (`pytest core/scripts/tests -m "not daemon_integration"`) takes ~32min
# (measured: 1916s; 2231 passed / 2 failed / 1 skipped over 2234 selected). The
# runtime concentrates in a handful of subprocess/integration tests that shell
# out to real git/bash/filesystem ops under OneDrive write contention -- the
# slowest 20 sum ~880s (~46%): test_promote seed-preflight/PR (139s, 135s),
# test_utilization_stats real-repo audit (77s), test_orphan_root_sweep_mode_d
# filesystem scans (~180s across 5), test_post_state_update_gate daemon
# round-trips (~60s across 3). A genuine hang in any such test was previously
# indistinguishable from "just slow" and ran unbounded. These two BUILT-IN
# (zero-dependency) faulthandler options bound it: after 600s on ANY single
# test, pytest dumps all-thread tracebacks (showing where it stalled) AND exits
# the process, so a hang fails loud instead of buffering silently. 600s is
# calibrated ~4.3x above the slowest observed legit test (139.61s) per guard-594
# -- comfortably clear of these subprocess tests' I/O variance, while "any
# single test > 10min" is unambiguously hung (the whole suite is ~32min).
# Optional upgrade for per-test reporting + signal-based termination:
# `pip install pytest-timeout` then add `timeout = 600` here. NOT enabled by
# default -- the plugin is absent; adding `timeout =` without it is a
# silently-ignored unknown option, not an error, so it would give false
# assurance. faulthandler covers the fail-loud guarantee with no install.
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true
# B16: marker for tests that spawn a REAL subprocess daemon and/or count/kill
# system-wide mind_api.src processes. These conflict with a live daemon (they
# would see/hijack it), so they must NOT run while one is serving agents
# (guard-672). Run the daemon-safe subset with:  pytest -m "not daemon_integration"
# Run the integration subset only in a quiescent window (agents stopped).
markers =
    daemon_integration: spawns/counts real OS daemons; run only in a quiescent window (not with a live daemon)
