[pytest]
# 2026-05-19 (Phase 2.5.B): test trees co-located with subsystems.
# - mind_api/tests/       daemon endpoint + runtime integration tests (was tests/runtime/)
# - core/tests/gates/     framework gate-extraction equivalence tests (was tests/gates/)
# - core/scripts/tests/   framework unit tests (unchanged)
cache_dir = core/.pytest_cache
testpaths =
    mind_api/tests
    core/tests/gates
    core/scripts/tests
# Quieter default output; tests that need verbose can override with -v.
addopts = -q
# Hang-bounding (g-115-1496, 2026-06-17): the daemon-safe full suite
# (`pytest core/scripts/tests -m "not daemon_integration"`) takes ~32min
# (measured: 1916s; 2231 passed / 2 failed / 1 skipped over 2234 selected). The
# runtime concentrates in a handful of subprocess/integration tests that shell
# out to real git/bash/filesystem ops under OneDrive write contention -- the
# slowest 20 sum ~880s (~46%): test_promote seed-preflight/PR (139s, 135s),
# test_utilization_stats real-repo audit (77s), test_orphan_root_sweep_mode_d
# filesystem scans (~180s across 5), test_post_state_update_gate daemon
# round-trips (~60s across 3). A genuine hang in any such test was previously
# indistinguishable from "just slow" and ran unbounded. These two BUILT-IN
# (zero-dependency) faulthandler options bound it: after 600s on ANY single
# test, pytest dumps all-thread tracebacks (showing where it stalled) AND exits
# the process, so a hang fails loud instead of buffering silently. 600s is
# calibrated ~4.3x above the slowest observed legit test (139.61s) per guard-594
# -- comfortably clear of these subprocess tests' I/O variance, while "any
# single test > 10min" is unambiguously hung (the whole suite is ~32min).
# Optional upgrade for per-test reporting + signal-based termination:
# `pip install pytest-timeout` then add `timeout = 600` here. NOT enabled by
# default -- the plugin is absent; adding `timeout =` without it is a
# silently-ignored unknown option, not an error, so it would give false
# assurance. faulthandler covers the fail-loud guarantee with no install.
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true
# B16: marker for tests that spawn a REAL subprocess daemon and/or count/kill
# system-wide mind_api.src processes. These conflict with a live daemon (they
# would see/hijack it), so they must NOT run while one is serving agents
# (guard-672). Run the daemon-safe subset with:  pytest -m "not daemon_integration"
# Run the integration subset only in a quiescent window (agents stopped).
# g-306-325 (filed by omni from ZDS-Mind, 2026-08-19): marker for tests whose
# fixtures assume a POPULATED MULTI-AGENT layout -- a second agent dir with real
# content, a live peer to probe for liveness, or forked worker Bodies. On a
# single-agent deployment those assumptions are false, the code under test behaves
# CORRECTLY, and the test fails anyway. Measured on ZDS-Mind (cc-06, own-cloud, 16
# chunks): 14347 passed / 132 failed, VERDICT GENUINE, --triage 45 files, every one
# genuine on solo re-run and every one UNOWNED. Not regressions.
# Why it matters: run-full-suite-after-deep-code makes a green suite the closure
# criterion for every deep core/scripts change, so on a single-agent deployment that
# criterion is UNSATISFIABLE and every closure must hand-triage 132 failures. A
# permanently-red suite is indistinguishable from one nobody reads.
#   Single-agent deployment:  pytest -m "not fleet_layout"
#   Fleet deployment:         no filter (the default -- these tests are meaningful here)
# DO NOT DERIVE THE MARKED SET BY GREP. Measured on Ayoai-Mind (zeta, cc-02,
# 2026-08-19) against a positive control (921/968 files match `def test_`) and a
# negative control (0): token proxies over core/scripts/tests span 47-175 files
# (liveness 47, in_flight 62, partner 78, team_state 125, BODY|worker 161,
# agents_root|agent_dir 175) against 45 actually-failing -- a 3.7x spread, and a
# fleet-agent-NAME match alone hits 591. A file can import agent_dir and still pass
# on a single-agent layout. The set is only observable from a `run-full-suite.sh
# --triage` run ON a single-agent deployment; a fleet box cannot reproduce it,
# because here the fixtures' assumptions hold and the tests pass.
# MARKED SO FAR: 1 of 45 -- test_bash_path_resolution_hook_long_flags.py, the one
# omni quoted whose coupling is corroborated INSIDE the file (its "two EXISTING
# toplevels" case already false-failed once on cc-05 for the same reason,
# g-115-2313, and the fix then chosen -- prefer GIT-TRACKED paths -- holds across
# clones of one deployment but not across deployments). The other 44 are NOT
# marked on purpose: omni's --triage reports FILES while the assertion it quoted
# for each is a single test, and three of the four named files carry 3, 16 and 17
# tests. Marking those whole from a box where they all pass would delete real
# coverage on the deployment that most needs it, so the remaining marks want an
# on-deployment triage run that can name the failing TESTS. Under-marking is the
# safe direction: an unmarked coupled test stays red (visible), a wrongly-marked
# one goes silently missing.
# The runner clause is live: run-full-suite.py --fleet-layout {auto,include,exclude},
# auto excluding only when this box has <2 agent dirs carrying a self.md. It emits
# ONE -m with every clause ANDed, because a SECOND -m does not AND -- pytest keeps
# the last and silently discards the earlier, which would repeal the
# daemon_integration exclusion. Measured 2026-08-19: `-m "not daemon_integration"`
# alone collected 0 files from test_daemon_orphan_prevention.py; adding a second
# harmless -m collected 1. Pinned by test_run_full_suite_fleet_layout.py (9 tests,
# the two-flag form verified RED by mutation).
markers =
    daemon_integration: spawns/counts real OS daemons; run only in a quiescent window (not with a live daemon)
    fleet_layout: assumes a populated multi-agent layout (peer agent dirs with content, peer liveness, or forked Bodies); deselect on a single-agent deployment with -m "not fleet_layout"
