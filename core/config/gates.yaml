    fn_description: "The user receives the same question again from another agent or another world -- the 2026-08-16 complaint verbatim."
    rb_evidence: ["rb-7986", "rb-8085"]
    tuning_notes: "Windows: blocker 24h, else 7d. Match: normalized subject == | subject Jaccard>=0.6 | shared goal/guard/pq ids | body Jaccard>=0.7 -- but two messages that each name ids and share NONE never match on body shape (two outages are two topics). Suppressions are recorded, never dropped."
