      TELEMETRY CONTAMINATION (g-248-102, measured 2026-07-13): 20% of ALL
      lifetime firings (3,569/17,883) and 45% of all pass firings
      (2,521/5,560) were SYNTHETIC — leaked by
      test_target_state_check_positional.py per suite run since 2026-05-17
      (fingerprint: caller="unknown"; production callers always pass
      _caller). Fixed by the PYTEST_CURRENT_TEST guard in _gate_log.log()
      plus in-file neutralization; records before 2026-07-13T18:47 are
      contaminated — evaluator windows spanning that date should discount
      caller="unknown" records or wait for the 30d window to age them out.
    retirement_eligible: true

  - id: removal-intent-verbs
    script: core/scripts/_target_state.py
    embedded: true
    instrumented: true
    sites:
      - { file: "core/scripts/_target_state.py", phase: "REMOVAL_INTENT_VERBS classification" }
    dominant_risk: FP
    asymmetry_magnitude: medium
    keyword_bias: strict
    override_flag: null
    fp_cost: low
    fn_cost: medium
    fp_description: "Non-removal goal misread as removal; dup check skipped; possible duplicate filing."
    fn_description: "Removal goal not detected; target_state false-blocks it (identifiers ARE the removal target); author needs --override-duplication."
    rb_evidence: []
    tuning_notes: >-
      INVERSION sibling of read-intent-verbs (g-248-101). Matches pre-colon
      words + the FIRST post-colon word only (removal verbs are action verbs
      behind generic labels like Apply:/Maintain:). Origin: 3 override-audited
      FPs in session 104 (g-248-100, g-115-2107, g-115-2108); the verb-shape
      fix covers the g-115-2107 class. TAXONOMY (g-115-2295): dominant_risk=FP
      here is LIKELIHOOD (strict matcher over-matches), kept symmetric with
      read-intent-verbs; the COST shape is FN-heavier (fn_cost=medium >
      fp_cost=low), and the retirement evaluator keys its all-noop downgrade
      on the cost fields — the FP label must not be read as "FP is the
      expensive side" (that misread produced the rejected retire
      recommendation in g-115-2281 at gate age 2.1d). Citation-shape FPs (evidence-file
      mentions) remain open — see g-248-103 (also: adverb-prefixed +
      no-colon-position residual classes from the 2026-07-13 fresh-eyes
      pass). TELEMETRY NOTE (g-248-102): the first 17 lifetime firings
      (2026-07-13, caller="unknown") were synthetic pytest leakage from the
      first run of test_target_state_removal_intent.py, before the
      PYTEST_CURRENT_TEST guard landed in _gate_log.log(); discount them in
      any lifetime ratio (30d window ages them out by 2026-08-12).
    retirement_eligible: true

  - id: modify-intent-verbs
    script: core/scripts/_target_state.py
    embedded: true
    instrumented: true
    sites:
      - { file: "core/scripts/_target_state.py", phase: "MODIFY_INTENT_VERBS classification" }
    dominant_risk: FP
    asymmetry_magnitude: medium
    keyword_bias: strict
    override_flag: null
    fp_cost: low
    fn_cost: medium
    fp_description: "Non-modify goal misread as modify; target_state block demoted to advisory; a genuine duplicate could slip the hard block (other 4 checks still apply)."
    fn_description: "Modify goal not detected; target_state hard-blocks it (named identifiers are the modification SUBJECT, present pre- AND post-change); author needs --override-duplication."
    rb_evidence: []
    tuning_notes: >-
      DEMOTE sibling of read-intent-verbs / removal-intent-verbs (g-115-2565),
      but semantically distinct: read/removal SKIP the check (identifier presence
      INVERTS the completion semantic), whereas modify DEMOTES the block to a
      visible advisory — modify-presence is AMBIGUOUS (the symbol is present both
      before AND after the change), so it proves neither duplication nor
      completion. Matches pre-colon words + first post-colon word + an -ly
      adverb-delayed second post-colon word (same position contract as
      removal-intent-verbs). Origin: echo g-115-2556 quantified 71% (37/52) of
      target_state solo-block overrides since 2026-07-04 as subject-not-deliverable
      modify-verb FPs (citation-shape 16, modification-surface 11, test-absence 6,
      union-masks-miss 4). MORE-ROBUST ALT deferred (create-intent allowlist
      inversion) — larger blast radius, its own goal. TAXONOMY: dominant_risk=FP
      is LIKELIHOOD (strict matcher may over-match); cost shape is FN-heavier
      (fn_cost=medium > fp_cost=low), same as the removal sibling.
    retirement_eligible: true

