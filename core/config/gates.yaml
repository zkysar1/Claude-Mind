# Gate Registry
#
# Single source of truth for the gate population. Phase 2 of the gate
# audit/retirement plan. Read by:
#   - aspirations-evolve retirement evaluator
#   - gate-stats.sh dashboard
#   - per-gate tuning reviewer
#   - audit scripts that enumerate all gates
#
# Pairing: meta/gate-firings.jsonl (telemetry log) keys off `id` here.
#
# Field semantics:
#   id                   stable identifier; matches gate_id in firing log.
#   script               implementation path, relative to repo root. For
#                        embedded gates (logic inside a larger script),
#                        the path of the host script.
#   embedded             true if the gate is logic embedded in a larger
#                        script rather than its own standalone gate.
#   instrumented         true if the gate emits a record to meta/gate-firings.jsonl
#                        via _gate_log.log() on every decision. Required input
#                        for the auto-retirement evaluator — uninstrumented gates
#                        produce no firing signal and so are invisible to it.
#   sites                where the gate is invoked from (file + phase).
#   dominant_risk        FN | FP | both — which error mode DOMINATES in
#                        practice. May be likelihood-weighted (which mode is
#                        more PROBABLE) where the pair's costs disagree with
#                        its frequencies — e.g. the intent-verbs pair is FP
#                        (strict matchers over-match) while fn_cost=medium >
#                        fp_cost=low. Cost decisions (the retirement
#                        evaluator's all-noop downgrade, ) key on
#                        fp_cost/fn_cost, NOT on this label — do not read
#                        dominant_risk as a cost field.
#   asymmetry_magnitude  extreme | high | medium | low — how lopsided.
#   keyword_bias         generous | strict | balanced — tuning policy.
#                        FN-dominant → generous (better to over-fire, cheap
#                        to override). FP-dominant → strict (bias toward
#                        letting work through). both-low → balanced.
#   override_flag        name of the bypass flag, or null if none yet.
#   fp_cost              low | medium | high — severity on false positive.
#   fn_cost              low | medium | high — severity on false negative.
#   fp_description       one-line description of the FP failure mode.
#   fn_description       one-line description of the FN failure mode.
#   rb_evidence          list of rb-NNN entries documenting incidents.
#   tuning_notes         current state of the tuning effort.
#   retirement_eligible  true | false. Structural gates (Unix flags, file
#                        existence) are excluded from the auto-retirement
#                        evaluator regardless of fire count.
#
# Source: agents' Session-56 audit (2026-04-22), 14 gates with explicit
# asymmetry analysis. Other gates in core/scripts/ are listed under
# pending_audit pending the same analysis.

schema_version: 1
last_updated: "2026-07-28"

gates:

  # ─── Asymmetry: FN-dominant (extreme) ─────────────────────────────────
  # These two have ~zero FP cost. Bias keywords aggressively wide.

  - id: positive-state-gate
    script: core/scripts/positive-state-gate.py
    embedded: false
    instrumented: true
    sites:
      - { file: ".claude/skills/aspirations-verify/SKILL.md", phase: "Q1 evidence check" }
      - { file: ".claude/skills/agent-completion-report/SKILL.md", phase: "advisory" }
      - { file: ".claude/skills/aspirations-state-update/SKILL.md", phase: "Step 8.75" }
    dominant_risk: FN
    asymmetry_magnitude: extreme
    keyword_bias: generous
    override_flag: "--override"
    fp_cost: low
    fn_cost: high
    fp_description: "Legit evidenced claim blocked; agent forced to re-read (~50ms)."
    fn_description: "Hallucinated state claim passes; downstream reasoning builds on a wrong file."
    rb_evidence: []
    tuning_notes: "Phase 3 candidate. Widen trigger pattern set; tolerate FP."
    retirement_eligible: true

  - id: retrieval-floor-gate
    script: core/scripts/retrieval-floor-gate.sh
    embedded: false
    instrumented: true
    sites:
      - { file: ".claude/settings.json", phase: "PreToolUse[Edit|MultiEdit|Write]" }
    dominant_risk: FN
    asymmetry_magnitude: extreme
    keyword_bias: generous
    override_flag: null
    fp_cost: low
    fn_cost: high
    fp_description: "A non-loop session that consulted the stores via cat/curl/grep (invisible to the manifest) gets one advisory banner on a knowledge write. Costs one re-check; nothing is blocked."
    fn_description: "A knowledge-tree node or convention is written in a non-loop session with nothing consulted — the parametric-memory publish the 2026-08-31 directive names. Downstream readers treat it as ground truth."
    rb_evidence: []
    tuning_notes: "ADVISORY ONLY and must stay so — it can never refuse a write (see guard-4407: hook binds to the Edit/Write TOOLS and the manifest it reads binds to Read/WebFetch/WebSearch, so under a Bash-preference session BOTH halves go blind together and silently). Scope is deliberately narrower than pre-edit-context-gate's: knowledge/tree + conventions only, the stores that ASSERT facts. Do NOT widen to raise yield (guard-2201). The `retrieval-auto` exclusion in DELIBERATE_RETRIEVAL_KINDS is load-bearing — counting the UserPromptSubmit auto pre-pass would make this floor unreachable, passing forever while measuring nothing."
    retirement_eligible: true

  - id: retrieval-pulse-hook
    script: core/scripts/retrieval-pulse-hook.sh
    embedded: false
    instrumented: true
    sites:
      - { file: ".claude/settings.json", phase: "PostToolUse[*]" }
    dominant_risk: FN
    asymmetry_magnitude: extreme
    keyword_bias: generous
    override_flag: null
    fp_cost: low
    fn_cost: high
    fp_description: "A non-loop session that has been consulting via cat/curl/grep (invisible to the manifest) gets one advisory line after N tool calls. Costs one glance; nothing is blocked and the counter resets."
    fn_description: "A non-loop session runs a long interior stretch — edits, filings, censuses, negations — without consulting anything, and no layer notices. Layer 1 only fires on a knowledge-store WRITE, so a session that never writes one is unobserved end to end."
    rb_evidence: []
    tuning_notes: "Layer 2 of g-357-47; layer 1 is retrieval-floor-gate (entry moment), this is the interior. ADVISORY ONLY and must stay so — a PostToolUse hook structurally cannot block, and the guard-4407 limit applies identically: firing is a prompt to check, never proof the session retrieved nothing. Threshold via --threshold or $RETRIEVAL_PULSE_THRESHOLD (default 15; <=0 disables). It MUST keep delegating the count to context-reads.py retrieval-pulse -> count_deliberate_retrievals: re-counting the manifest here, or accepting `retrieval-auto`, would make the pulse reset on the UserPromptSubmit auto pre-pass and measure nothing (guard-1760, the same failure DELIBERATE_RETRIEVAL_KINDS prevents for layer 1). Autonomous sessions are excluded by design — Phase 4 + the 9.5b audit already cover them."
    retirement_eligible: true

  - id: verify-before-assuming-gate
    script: core/scripts/verify-before-assuming-gate.py
    embedded: false
    instrumented: true
    sites:
      - { file: "core/config/conventions/infrastructure.md", phase: "infra-failure classification" }
    dominant_risk: FN
    asymmetry_magnitude: extreme
    keyword_bias: generous
    override_flag: "--override"
    fp_cost: low
    fn_cost: high
    fp_description: "Knowledge gap classified as infra; one extra infra-health.sh call (~5s)."
    fn_description: "Real infra issue misclassified; agent skips probe, files wrong blocker."
    rb_evidence: []
    tuning_notes: "Phase 3 candidate. Widen infra-failure trigger set."
    retirement_eligible: true

