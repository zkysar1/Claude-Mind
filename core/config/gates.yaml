  - id: removal-intent-verbs
    script: core/scripts/_target_state.py
    embedded: true
    instrumented: true
    sites:
      - { file: "core/scripts/_target_state.py", phase: "REMOVAL_INTENT_VERBS classification" }
    dominant_risk: FP
    asymmetry_magnitude: medium
    keyword_bias: strict
    override_flag: null
    fp_cost: low
    fn_cost: medium
    fp_description: "Non-removal goal misread as removal; dup check skipped; possible duplicate filing."
    fn_description: "Removal goal not detected; target_state false-blocks it (identifiers ARE the removal target); author needs --override-duplication."
    rb_evidence: []
    tuning_notes: >-
      INVERSION sibling of read-intent-verbs (g-248-101). Matches pre-colon
      words + the FIRST post-colon word only (removal verbs are action verbs
      behind generic labels like Apply:/Maintain:). Origin: 3 override-audited
      FPs in session 104 (g-248-100, g-115-2107, g-115-2108); the verb-shape
      fix covers the g-115-2107 class. TAXONOMY (g-115-2295): dominant_risk=FP
      here is LIKELIHOOD (strict matcher over-matches), kept symmetric with
      read-intent-verbs; the COST shape is FN-heavier (fn_cost=medium >
      fp_cost=low), and the retirement evaluator keys its all-noop downgrade
      on the cost fields — the FP label must not be read as "FP is the
      expensive side" (that misread produced the rejected retire
      recommendation in g-115-2281 at gate age 2.1d). Citation-shape FPs (evidence-file
      mentions) remain open — see g-248-103 (also: adverb-prefixed +
      no-colon-position residual classes from the 2026-07-13 fresh-eyes
      pass). TELEMETRY NOTE (g-248-102): the first 17 lifetime firings
      (2026-07-13, caller="unknown") were synthetic pytest leakage from the
      first run of test_target_state_removal_intent.py, before the
      PYTEST_CURRENT_TEST guard landed in _gate_log.log(); discount them in
      any lifetime ratio (30d window ages them out by 2026-08-12).
    retirement_eligible: true

  - id: modify-intent-verbs
    script: core/scripts/_target_state.py
    embedded: true
    instrumented: true
    sites:
      - { file: "core/scripts/_target_state.py", phase: "MODIFY_INTENT_VERBS classification" }
    dominant_risk: FP
    asymmetry_magnitude: medium
    keyword_bias: strict
    override_flag: null
    fp_cost: low
    fn_cost: medium
    fp_description: "Non-modify goal misread as modify; target_state block demoted to advisory; a genuine duplicate could slip the hard block (other 4 checks still apply)."
    fn_description: "Modify goal not detected; target_state hard-blocks it (named identifiers are the modification SUBJECT, present pre- AND post-change); author needs --override-duplication."
    rb_evidence: []
    tuning_notes: >-
      DEMOTE sibling of read-intent-verbs / removal-intent-verbs (g-115-2565),
      but semantically distinct: read/removal SKIP the check (identifier presence
      INVERTS the completion semantic), whereas modify DEMOTES the block to a
      visible advisory — modify-presence is AMBIGUOUS (the symbol is present both
      before AND after the change), so it proves neither duplication nor
      completion. Matches pre-colon words + first post-colon word + an -ly
      adverb-delayed second post-colon word (same position contract as
      removal-intent-verbs). Origin: echo g-115-2556 quantified 71% (37/52) of
      target_state solo-block overrides since 2026-07-04 as subject-not-deliverable
      modify-verb FPs (citation-shape 16, modification-surface 11, test-absence 6,
      union-masks-miss 4). MORE-ROBUST ALT deferred (create-intent allowlist
      inversion) — larger blast radius, its own goal. TAXONOMY: dominant_risk=FP
      is LIKELIHOOD (strict matcher may over-match); cost shape is FN-heavier
      (fn_cost=medium > fp_cost=low), same as the removal sibling.
    retirement_eligible: true

  - id: build-test-authoring-intent
    script: core/scripts/_target_state.py
    embedded: true
    instrumented: true
    sites:
      - { file: "core/scripts/_target_state.py", phase: "BUILD_INTENT / TEST_AUTHORING classification" }
    dominant_risk: FP
    asymmetry_magnitude: medium
    keyword_bias: strict
    override_flag: null
    fp_cost: low
    fn_cost: medium
    fp_description: "Non-build/test goal misread as build/test; target_state block demoted to advisory; a genuine duplicate could slip the hard block (other 4 checks still apply)."
    fn_description: "Build/test-authoring goal not detected; target_state hard-blocks it (named identifiers are the integration SURFACE present before the work, not the deliverable); author needs --override-duplication."
    rb_evidence: []
    tuning_notes: >-
      DEMOTE sibling of modify-intent-verbs (g-115-2869). A goal to BUILD a new
      gate/check/module or ADD an integration test names the EXISTING file it
      touches; those symbols are the integration SURFACE, present BEFORE the work,
      not the deliverable — the same before-AND-after ambiguity modify handles, so
      DEMOTE (not skip). Unlike the VERB-led read/removal/modify siblings, build/
      test titles are frequently NOUN-led: the deliverable NOUN names the intent
      with no explicit build verb, so this matches a build VERB or a deliverable
      NOUN (gate/check/module/...) or the noun "test" in the leading segment
      (pre-colon words + first THREE post-colon words — wider than the verb
      siblings' word-1 window because a deliverable noun carries a compound
      modifier: "goal-creation gate", "integration test"). Origin: g-115-2857
      ("goal-creation gate refusing ...") and g-115-2862 ("integration test
      proving ...") both hard-blocked (400) 2026-07 and cleared only after
      re-wording. TAXONOMY: dominant_risk=FP is LIKELIHOOD (wider window may
      over-match); cost shape is FN-heavier (fn_cost=medium > fp_cost=low), same
      as the modify/removal siblings.
    retirement_eligible: true

  - id: lane-pin-gate
    script: core/scripts/gates/lane_pin.py
    embedded: false
    instrumented: true
    sites:
      - { file: "mind_api/src/endpoints/aspirations_write.py", phase: "claim() — after terminal-status + SID-less refusals, before cross_lane" }
    dominant_risk: FP
    asymmetry_magnitude: medium
    keyword_bias: strict
    override_flag: "--override-lane-pin"
    fp_cost: medium
    fn_cost: low
    fp_description: "In-lane claim wrongly refused; the pinned agent's only recourse is --override-lane-pin — i.e. the honor-system escape this gate exists to remove — so a false refusal does not merely cost time, it re-opens the hole."
    fn_description: "Out-of-lane claim allowed; leaves the fleet at the Layer-A honor system where it already was. Not a NEW harm, an unfixed old one."
    rb_evidence: []
    tuning_notes: >-
      Layer B for the '## Standing Lane Pins' table in
      world/conventions/capability-routing.md, parsed LIVE per call: deleting a
      row lifts the pin with no code change or redeploy. Refuses ONLY on
      out-of-lane evidence with NO in-lane evidence — both-columns-match and
      neither-match both ALLOW — which is why fp_cost > fn_cost is the DESIGNED
      shape, not a defect to tune out. TAXONOMY (following the
      build-test-authoring-intent precedent): dominant_risk=FP is the COST
      direction; FP LIKELIHOOD is deliberately low. The two word caps in the
      module (_MAX_ITEM_WORDS=4, _MAX_PARENT_WORDS=5) separate a pin cell's
      ENUMERATION of lane items from its COMMENTARY about agent behavior, and
      were set by measurement against live pin-001, not by intuition: without the
      parent cap a parenthetical inside a commentary sentence leaked the tokens
      `error` and `session`, which wrongly refused g-250-315 and g-335-961.
      Widening either cap re-admits that class and the failure is SILENT, so
      re-measure against real goals before changing them. Single-token matching
      uses the SET DIFFERENCE of the two columns' tokens, so a re-worded registry
      re-tunes the gate with no code change. SURFACES DIFFER BY EVIDENCE KIND:
      single tokens match title+category only, phrases match title+description+
      category — a bare noun in a description is a cited file path, not a work
      type. Baseline over all 1,506 live pending goals classified as the pinned
      agent: 690 out-of-lane / 360 ambiguous / 456 in-lane, and of the 690, a
      targeted probe for lane-vocabulary titles surfaced 7 candidates of which 0
      were genuine false refusals. Know before tuning: 658 of those 690 (95%) came
      from the CATEGORY alone, 527 from ONE category matching ONE token, so
      narrowing the token surface to titles collapses refusals to ~2% of the
      queue — the gate's live behavior is coupled to the category taxonomy.
      Origin g-115-5152; pin-001 filed 2026-08-06 by user directive after prose
      escalation failed to hold (54 claims in 14h, most not needing that box).
    retirement_eligible: true

  # ─── Asymmetry: FN > FP (medium-high) ────────────────────────────────

