    fn_description: "A near-duplicate insight passes the advisory check and is encoded; bloat accrues slowly, surfaced later by retrieval_utility_report (G4b) + /reflect --curate-memory."
    rb_evidence: []
    tuning_notes: "Phase-1 earn-the-keep (g-115-1468 / G4a). Advisory-first: logs keep/drop recommendation via _gate_log, does NOT change the curator decision. Conservative defaults (dup_threshold 0.80, min_novelty 0.20 -- favors keep). Tighten / enforce once advisory firings show a stable signal."
    retirement_eligible: true

