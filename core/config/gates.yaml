    keyword_bias: strict
    override_flag: null
    fp_cost: low
    fn_cost: medium
    fp_description: "Warns on a non-duplicate; the add still lands, author reads the named entry and moves on (seconds). It cannot refuse an entry."
    fn_description: "A true duplicate is added unwarned; two entries drift apart and both get retrieved. This is the COMMON case, not the rare one -- see tuning_notes."
    rb_evidence: [rb-5589]
    tuning_notes: "g-115-3223 built it, g-115-3626 instrumented it. FN-dominant but keyword_bias is deliberately STRICT, and the tension is real: thresholds sit just above each store's measured p99 nearest-neighbour similarity (guardrails 0.45, rb/pattern-sigs 0.55) because an advisory that fires often gets ignored, and alarm fatigue converts straight back into FN. Lexical (jaccard) only -- MEASURED blind to semantic duplicates: guard-1486/guard-1485 are a true duplicate scoring 0.112, ranked 20th, BELOW the store median. So expect a high FN floor no lexical threshold can lower; the semantic half is g-115-3736. Do NOT count-retire on a low fire rate alone -- check the `similarity` distribution in the firing corpus first, since a near-miss cluster just under threshold is a tuning signal, not a uselessness signal."
