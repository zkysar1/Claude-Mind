  - id: notify-user-routing-gate
    script: core/scripts/notification_routing_gate.py
    embedded: false
    instrumented: true
    sites:
      - { file: "core/scripts/notify_dispatch.py", phase: "dispatch() step 1 (framework chokepoint -- every sender, incl. direct email-send.sh callers re-entered via the world transport)" }
      - { file: ".claude/skills/notify-user/SKILL.md", phase: "Step 1.5b (delegates to notify-user.sh)" }
      - { file: "core/scripts/inbox-alert-age-check.py", phase: "_send_email (pre-send routing)" }
      #  swept the direct callers that never entered Step 1.5b.
      - { file: "core/scripts/evolution-complete.py", phase: "_email_user (per-event category)" }
      - { file: "core/scripts/meta-backpressure.py", phase: "_email_rollback" }
      - { file: "core/scripts/stop-reason-record.py", phase: "_send_notification" }
      - { file: "world/scripts/billing-accuracy-guard.sh", phase: "alert (human-only override)" }
      - { file: "world/scripts/daily-cost-report.sh", phase: "send (user-digest)" }
      - { file: "world/scripts/processor-run.sh", phase: "run-complete (suppresses + breadcrumb)" }
      # Explicit NON-sites, recorded so a future sweep does not "complete the
      # wiring" and break them:
      #   core/scripts/user-blocker-escalation-check.py — carries explicit
      #     recorded categories instead; its all-clear is `info`, which this
      #     gate would SUPPRESS, and that send is user-requested (D3).
      #   .claude/skills/aspirations-consolidate/SKILL.md — routes through the
      #     notify-user forged skill, so it is covered by Step 1.5b above.
    dominant_risk: FP
    asymmetry_magnitude: high
    keyword_bias: strict
    override_flag: null
    fp_cost: high
    fn_cost: low
    fp_description: "A notification the user genuinely needs (decision-needed, human-only blocker) suppressed as fleet-handleable; the fleet-side destination (board/goal) is the only trace."
    fn_description: "A fleet-handleable status/completion/update email reaches the user; one more email he asked not to get."
    rb_evidence: ["rb-7986"]
    tuning_notes: "INVERTED fail-safe: unknown category -> SEND. Suppression classes are keyed to the existing HUMAN_ONLY_PATTERNS SSOT; every SUPPRESS returns a destination (never null). Since 2026-08-17 the gate runs inside core/scripts/notify_dispatch.py, the framework chokepoint every sender passes through (a direct email-send.sh call re-enters it), so the g-115-6422 bypass class is closed structurally."
    retirement_eligible: false
