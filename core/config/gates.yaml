    override_flag: null
    fp_cost: low
    fn_cost: medium
    fp_description: "Read-only goal flagged as write; stricter dup check blocks legit new read."
    fn_description: "Write-intent goal classified as read-only; dup-gate skipped; possible duplicate writes."
    rb_evidence: []
    tuning_notes: >-
      INVERSION. Trim verb list; default-to-write-intent is the safer side.
      TELEMETRY CONTAMINATION (g-248-102, measured 2026-07-13): 20% of ALL
      lifetime firings (3,569/17,883) and 45% of all pass firings
      (2,521/5,560) were SYNTHETIC — leaked by
      test_target_state_check_positional.py per suite run since 2026-05-17
      (fingerprint: caller="unknown"; production callers always pass
      _caller). Fixed by the PYTEST_CURRENT_TEST guard in _gate_log.log()
      plus in-file neutralization; records before 2026-07-13T18:47 are
      contaminated — evaluator windows spanning that date should discount
      caller="unknown" records or wait for the 30d window to age them out.
