  - id: stale-summary-source-gate
    script: core/scripts/gates/stale_summary_source.py
    embedded: false
    instrumented: true
    sites:
      - file: core/scripts/iteration-close.sh
        phase: "--summary-file resolution (arg parse, before any phase runs)"
      - file: core/scripts/closure-evidence-write.sh
        phase: "--summary-file read (worker-loop close path)"
    dominant_risk: FP
    asymmetry_magnitude: moderate
    keyword_bias: strict
    override_flag: "--override-stale-source"
    fp_cost: low
    fn_cost: high
    fp_description: >-
      A wrong `block` refuses a narrative whose source file legitimately
      predates the claim — the realistic case is a goal released and re-claimed
      after the note was written, which resets claimed_at under an unchanged
      file. Fully self-service and immediate: the refusal names
      --override-stale-source and the write succeeds on retry. No data is lost,
      because the refusal happens BEFORE the write.
    fn_description: >-
      A wrong `pass` lets one goal's closure evidence be silently replaced by
      another's. Measured 2026-08-24 (alpha worker Body, cc-08): 36,260 chars
      from a stale --summary-file landed over 6,580. The result is valid,
      well-formed, LONGER prose, so no length- or content-based check can see
      it and a later reader cannot tell what was actually shipped. Recovery
      needs a .history dig by someone who already suspects the swap.
    rb_evidence: "g-115-7425 (this gate); g-115-7361 (the falsification that surfaced it); guard-1701 (a gate-blocked heredoc never runs while a later $(cat) returns the previous occupant)"
    tuning_notes: >-
      Reference is the goal's claimed_at, falling back to session_start. The
      fallback is MEASURED WEAK and that is recorded rather than smoothed over:
      an autonomous session runs for days (5d 4h at build time), so almost every
      candidate file postdates session_start and an unclaimed goal gets far less
      protection. GRACE_SECONDS=120 is clock-skew allowance only, not a
      tolerance dial. Deliberately does NOT gate on "the note cites another goal
      id" — legitimate notes cite siblings constantly and the cross-record
      protocol requires it (guard-2860: never relax an ownership test into a
      pattern). No daemon half exists or should be added: this gate judges a
      FILE PATH, which only the shell layer ever sees.
