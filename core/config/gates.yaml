    fn_description: "A wrong `pass` lets long-lived goal prose be silently destroyed. Measured 2026-08-21 (g-115-105): a 36,904-char description was replaced with 3,467 chars belonging to an UNRELATED goal; the wrapper exited rc=0 and echoed the full record, the daemon wrote cleanly, the changelog logged an ordinary edit, and nothing warned. Recovered only from the .history copy-on-write pre-image (snapshot 2026-08-21T04-22-40 -> blob 3f597ef0). The generating mechanism is documented and recurrent: aspirations-update-goal.sh has no --append and drops unrecognized flags silently while the value REPLACES the field (guard-2525/2444/1691), and RMW against a truncated read does the same (guard-1251)."
