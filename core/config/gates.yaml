    dominant_risk: FN
    asymmetry_magnitude: high
    keyword_bias: generous
    override_flag: --no-retrieval-applicable
    fp_cost: medium
    fn_cost: high
    fp_description: "NOT the usual cheap-override FP. When the gate blocks, its own message names a remedy — 'run utilization-feedback.sh manually with explicit --helpful items' — that is unreachable by construction: the infer pass ran moments earlier inside the same do_state_update and closed the session, so the call returns already_processed (g-115-3173, observed 4x). The only remaining exit is --no-retrieval-applicable, which is FALSE whenever retrieval genuinely helped, so the agent must record something untrue to proceed. That is guard-1532 verbatim, and it corrupts the signal this gate exists to protect."
    fn_description: "A close passes on zero positive signal, so times_helpful stays at zero across the population. That is what nearly triggered the retire-400+-rb-entries sweep in rb-472 — the corpus looked dead because nothing was crediting it."
    rb_evidence: [rb-472]
    tuning_notes: "Instrumented g-115-3148. Was ALREADY enforcing at the call site since it shipped (iteration-close.sh:912 exits 1) — the 'arm it' step that goal was filed for had no work in it. What was missing was OBSERVABILITY: with no _gate_log, the only trace was world/phase-4-26-overrides.jsonl, which records overridden blocks and NOTHING else, so blocks that STOOD and every pass were invisible and the pass/block split was unmeasurable. Note also the gate fires in do_state_update, which is AFTER do_verify writes status=completed — it halts the close-out, it does not prevent completion. Measured baseline before instrumentation (2026-08-01): 25 overridden blocks over 98 days, all 5 agents, 25 distinct goals, by method infer 20 / all_unknown 4 / all_noise 1; 24 of the 25 fall on or after 2026-07-25, the day g-115-3113/3123 made the predicate reachable — dated correlation, not a verified per-row cause. Do NOT tune from override VOLUME alone: several of those rows are the foreclosed-remedy FP above, not genuine no-signal closes. Use gate-stats.sh --gate phase-4-26-gate once firings accumulate, and fix the remedy reachability (g-115-3173) before reading the FP ratio as a tuning signal."
    retirement_eligible: false

  - id: fresh-eyes-dispatch-observation
    script: .claude/skills/aspirations-precheck/SKILL.md
    embedded: true
    instrumented: true
    sites:
      - { file: ".claude/skills/aspirations-precheck/SKILL.md", phase: "Phase 0-pre3 (fresh-eyes dispatch, beside the fresh_eyes_last_dispatch stamp)" }
    dominant_risk: FN
    asymmetry_magnitude: high
    keyword_bias: balanced
    override_flag: null
    fp_cost: low
    fn_cost: high
    fp_description: "There is effectively no FP: this gate never blocks and never advises. A spurious row costs one spooled local append and one line of telemetry, and a wrong `merged_payloads` value is self-describing in the row."
    fn_description: "A dispatch goes unrecorded, and g-115-4254's pooled sample cannot fill. That is not hypothetical: the hypothesis accumulated ZERO observations in the 8 days after filing, while dispatches were demonstrably happening, because merged_payloads reached no durable store at all."
    rb_evidence: []
    tuning_notes: "TELEMETRY-ONLY, not an enforcement gate -- it emits one `pass` row per DISPATCH and never blocks, so `keyword_bias` is inert here (there is no keyword matching to tune) and `balanced` is recorded rather than `generous` specifically to keep it out of gate-retirement-eval's FN-dominant keyword-widening branch. Registered under g-115-5323 so gate-retirement-eval can see the firings at all (_gate_log.log docstring: an unregistered gate_id is invisible to the evaluator). WHY THE DISPATCH SIDE AND NOT THE WRITE SIDE -- the observation unit is a dispatch, and two sentinel writes that MERGE produce only one dispatch, so instrumenting iteration-close's write point would inflate the denominator. There is a second, independent reason the write side is wrong: merged_payloads is computed only in fresh-eyes-sentinel-merge.py, which runs ONLY when an unconsumed payload already exists, so a merge-side probe would record 100% merged and never see the unmerged case the hypothesis needs as its baseline. WHY ONLY THE DISPATCH BRANCH IS LOGGED (deliberate, against guard-502's every-branch default) -- the no-dispatch case fires on every precheck iteration, so logging it would be a per-close append; the observation unit is the dispatch, and the merged/unmerged split is read off `extra.merged_payloads` (absent or 1 = unmerged, >=2 = merged), so noop rows carry no information the sample needs. RETIREMENT CRITERION AT BIRTH (guard-769) -- this gate exists to feed one starved hypothesis. Retire it once g-115-4254 has resolved on >=10 pooled non-null observations, OR once gate-stats.sh shows >=10 rows with a non-null `extra.merged_payloads` spread across >=2 agents and no open hypothesis consuming them. It is NOT load-bearing for any enforcement path, so retirement costs nothing but the sample."
    retirement_eligible: true

