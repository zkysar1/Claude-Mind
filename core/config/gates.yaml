# Gate Registry
#
# Single source of truth for the gate population. Phase 2 of the gate
# audit/retirement plan. Read by:
#   - aspirations-evolve retirement evaluator
#   - gate-stats.sh dashboard
#   - per-gate tuning reviewer
#   - audit scripts that enumerate all gates
#
# Pairing: meta/gate-firings.jsonl (telemetry log) keys off `id` here.
#
# Field semantics:
#   id                   stable identifier; matches gate_id in firing log.
#   script               implementation path, relative to repo root. For
#                        embedded gates (logic inside a larger script),
#                        the path of the host script.
#   embedded             true if the gate is logic embedded in a larger
#                        script rather than its own standalone gate.
#   instrumented         true if the gate emits a record to meta/gate-firings.jsonl
#                        via _gate_log.log() on every decision. Required input
#                        for the auto-retirement evaluator — uninstrumented gates
#                        produce no firing signal and so are invisible to it.
#   sites                where the gate is invoked from (file + phase).
#   dominant_risk        FN | FP | both — which error mode hurts more.
#   asymmetry_magnitude  extreme | high | medium | low — how lopsided.
#   keyword_bias         generous | strict | balanced — tuning policy.
#                        FN-dominant → generous (better to over-fire, cheap
#                        to override). FP-dominant → strict (bias toward
#                        letting work through). both-low → balanced.
#   override_flag        name of the bypass flag, or null if none yet.
#   fp_cost              low | medium | high — severity on false positive.
#   fn_cost              low | medium | high — severity on false negative.
#   fp_description       one-line description of the FP failure mode.
#   fn_description       one-line description of the FN failure mode.
#   rb_evidence          list of rb-NNN entries documenting incidents.
#   tuning_notes         current state of the tuning effort.
#   retirement_eligible  true | false. Structural gates (Unix flags, file
#                        existence) are excluded from the auto-retirement
#                        evaluator regardless of fire count.
#
# Source: agents' Session-56 audit (2026-04-22), 14 gates with explicit
# asymmetry analysis. Other gates in core/scripts/ are listed under
# pending_audit pending the same analysis.

schema_version: 1
last_updated: "2026-04-22"

gates:

  # ─── Asymmetry: FN-dominant (extreme) ─────────────────────────────────
  # These two have ~zero FP cost. Bias keywords aggressively wide.

  - id: positive-state-gate
