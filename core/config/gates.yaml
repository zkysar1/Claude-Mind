  - id: domain-suite-gate
    script: core/scripts/domain-suite-gate.py
    embedded: false
    instrumented: true
    sites:
      - { file: "core/scripts/iteration-close.sh", phase: "do_verify (status=completed, BEFORE the status write; both roles)" }
    dominant_risk: FN
    asymmetry_magnitude: high
    keyword_bias: strict
    override_flag: "--override-domain-suite"
    fp_cost: low
    fn_cost: high
    fp_description: "A close is refused for a red the closing Body did not cause: several Bodies edit one shared $WORLD_PATH/scripts tree and the trigger is mtime (Edit-tool writes to world/ never reach the changelog, so nothing can attribute them). The refusal names the touched files; the override logs the attribution the reader supplies. Or a slow domain suite is run on a close that only touched a comment."
    fn_description: "A unit closes 'verified' while the world's domain test suite cannot even collect. Measured 2026-08-29 on a live deployment: tests importing symbols that later units removed; `Interrupted: 2 errors during collection`; every later goal in the lane verified against nothing. The domain half is invisible to full-suite-recommender (git-based, guard-1947) and run-full-suite-after-deep-code.md only NAMES its command."
    rb_evidence: ["guard-399", "guard-1947", "guard-955"]
    tuning_notes: "Instrumented from day one (g-353-75). Fires only when a code file (.py .sh .yaml .toml .cfg .ini) under $WORLD_PATH/scripts is newer than the goal's claimed_at (aspirations-read.sh; fallback 6h); a world with no run-domain-tests.sh hook AND no test_*.py is noop. Runner: the world hook when present, else python -m pytest -q with cwd=scripts, STORAGE_BACKEND=local pinned, 900s bound (timeout and pytest rc 3/4 fail OPEN as decision=error). Verdict is a RATCHET, not green-or-block: the dev world measured 651s with 2 real reds nobody had seen, so demanding green would have refused every fleet close on day one. world/domain-suite-baseline.json (per box) holds the previous run's failing set; the first run seeds it and passes; a later run blocks only on a red NOT in it or on a collection error (rc=2, never baseline-able); a subset run passes and shrinks the baseline. Read the FP ratio against world/domain-suite-overrides.jsonl reasons: an override citing a tracked goal is the designed shared-tree FP; an override on a COLLECTION error is a Body laundering a broken import and is the signal to tighten, not retire."
    retirement_eligible: false

  - id: close-review-gate
    script: core/scripts/close-review-gate.py
    embedded: false
    instrumented: true
    sites:
      - { file: "core/scripts/iteration-close.sh", phase: "do_verify (status=completed, BEFORE the status write; both roles)" }
    dominant_risk: FN
    asymmetry_magnitude: high
    keyword_bias: strict
    override_flag: "--override-close-review / --override-note-marker"
    fp_cost: low
    fn_cost: high
    fp_description: "A tier-2 close is refused for a goal whose accuracy was in fact fine, costing one review cycle; or the note-marker check flags a legitimate close whose note QUOTES a not-done phrase while refuting it. The second is measured and real — g-115-5085 ('do not reopen this goal') is a correct close the high tier flags — which is why the refusal prints the matched context and is override-able rather than being a hard deny, and why the detector must NOT be widened to raise yield (guard-2201)."
    fn_description: "A goal closes green while its stated outcomes were never checked by anyone but its author. Measured: coach g-012-02 closed with 6/16 wrong entity identities because the author self-graded against count-based criteria (g-357-39). Note-marker half: a goal sits at a terminal status while its own note argues it is not done — g-326-736 read `completed` under a note opening 'REOPENED BY ITS OWN CRITERIA', and it was the sole owner of a product smoke test that went dark three days."
    rb_evidence: ["guard-1532", "guard-142", "rb-4452", "guard-2201"]
    tuning_notes: "SHIPPED DORMANT (2026-09-02, g-357-40) — close_review_gate.enabled and .note_marker_enabled both default false in core/config/aspirations.yaml, a MISSING key reads false. This is a ship condition, not a hedge: check A's refusal names a remedy (the fresh-eyes close reviewer) whose producer is sibling goal g-357-41 and does not exist yet, and enabling a gate whose named remedy is unreachable forces every caller onto --override, manufacturing false records in the very ledger the gate fills (guard-1532, measured twice). Check B needs its refusal rate measured over the live completed population first. MEASURED (g-357-77, zeta 2026-09-04): tier-2 share on deep non-recurring closes = 44/50 (88.0%) primary / 301/339 (88.8%) full -- hypothesis CONFIRMED (>=80%), tier-2 is near-universal on deep closes; the entities trigger dominates (38/44 tier-2), and framework+first_of_asp are structurally inert because iteration-close.sh:1160 passes only --goal/--source (no --files, no --first-of-aspiration). Note-marker (check B) refusal rate = 0/448 (0.0%) at the gate HIGH-confidence threshold over the live completed population, so check B's precondition is SATISFIED green and it is ELIGIBLE to enable (override --override-note-marker reachable; guard-1532 does not apply to B). Left dormant pending a separate enable decision -- flipping note_marker_enabled breaks test_gate_is_DORMANT_by_default and changes the shipped posture, beyond g-357-77's record-the-rate scope. The flags are independent — flip each when ITS precondition lands. Tier logic is a pure, separately-tested module (goal_close_risk_tier.py): tier 0 (recurring + routine + no artifacts) short-circuits FIRST so a recurring framework-hygiene sweep never demands review; tier 2 fires on any of 6 triggers. Fail-to-tier-1 on every classifier fault (guard-142) — but verdict ABSENCE is a refusal, never a fail-open, because absence of review is the condition the gate exists to catch. Read the FP ratio against world/close-review-overrides.jsonl."
    retirement_eligible: false

  - id: defer-routing-target
    script: core/scripts/gates/defer_routing_target.py
    embedded: false
    instrumented: true
    sites:
      - { file: "core/scripts/aspirations.py", phase: "cmd_update_goal — field == defer_reason, triggered on the FIELD (never on _is_narrative_defer)" }
      - { file: "mind_api/src/endpoints/aspirations_write.py", phase: "update_goal — field == defer_reason (the LIVE half; wrappers are daemon-only)" }
    dominant_risk: FP
    asymmetry_magnitude: medium
    keyword_bias: strict
    override_flag: "--force-defer"
    fp_cost: medium
    fn_cost: medium
    fp_description: "A correct defer is refused and the author must reach for --force-defer, which is the honor-system escape the gate exists to reduce. Measured and designed against on the live corpus of 130 deferred goals: the naive predicate (cites a grant + waits) fires on 2 and one of them, g-335-552, is the best-written defer in the corpus — human_blocked prefix, re-derived on both axes, a positive control on its own probe, and it names grant-014/013/010 precisely to explain why none of them retires it. That is the guard-3882 gradient, where the best-probed defers cite the most registries and so trip a naive target check. Judging citation STANCE (relied-on vs ruled-out) over a window around each citation drops the population to 1 — the true positive alone. Lane A (agent vs lane pin) was DEMOTED to advisory for the same reason: as a refusal it measured 1 firing and 1 false positive, g-350-334, which correctly routes a DEV session run to foxtrot and is blocked on the single generic token server leaked from surrounding prose."
    fn_description: "A defer names an owner who is not the owner and the goal freezes behind them. Measured cost of the three instances that motivated this gate: g-369-112 sat undone while two HIGH goals named it as their blocker and took about 25 minutes to execute once attempted; g-369-08 and g-369-03 both routed to an external owner work the fleet identity could already perform in the same AWS account. The residual FN is deliberate: lane A advises rather than refuses, so an out-of-lane agent routing still lands."
    rb_evidence: ["guard-3882", "guard-1470", "guard-3803", "guard-4883", "guard-1802", "rb-10090"]
    tuning_notes: "Three lanes, each population measured against the 130 live deferred goals on 2026-09-04 (cc-08), never reasoned. Lane B (grant cited as a gate) REFUSES: a standing grant is a PERMISSION — every registry row ends never (revoke by deleting this row) — so a grant can retire a gate and can never create one, which makes a grant cited as grounds for waiting decidable without understanding the work. Lane A (agent a live pin excludes) also REFUSES, but ONLY with the pin matched over the ROUTED CLAUSE rather than the whole defer: a defer_reason is a paragraph in which one clause routes work, so whole-text matching let an unrelated sentence decide the verdict and measured 1 firing / 1 false positive (g-350-334, a lone 'server' inside a provenance marker two sentences from a clause pin-001 explicitly permits). Clause scoping takes lane A to 0 firings / 0 false positives across all 130 while a constructed genuine violation still refuses with the pin quoted — the zero is UNEXERCISED, not dead. Lane C ADVISES (owner-phrases are prose; guard-1470). Trigger on the FIELD, never on _is_narrative_defer: that predicate returns False for every STRUCTURED_DEFER_PREFIXES value and the live corpus measured 130 of 130 structured, so gating it the way capability-gate is gated would fire on exactly ZERO of the population while looking correct in review (guard-1802). Role-aware agent extraction is load-bearing: a bare roster word-match fires on 89 of 130 because defers cite agents as PROVENANCE, and requiring the agent to be the target of a routing verb takes that to 4 (guard-4883). Lane A calls gates.lane_pin.evaluate rather than re-deriving lane matching, so the defer gate and the claim gate cannot disagree about what a pin means (guard-2676). Deny messages are built by CONCATENATION, never format(), because they quote registry prose containing braces (guard-3803)."
    retirement_eligible: false

