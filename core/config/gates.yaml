    rb_evidence: []
    tuning_notes: "TELEMETRY-ONLY, failure-only (decision=fail_open, emitted from the || branch of the worker-ref-consume --check invocation; clean passes log nothing — own-cloud append cost, same posture as the pre-commit suite BLOCK-only telemetry). Registered so the rows are visible to gate-retirement-eval at all (_gate_log.log docstring: an unregistered gate_id is invisible to the evaluator). Keyword fields are inert — there is no keyword matching here; `balanced` keeps it out of the FN-dominant keyword-widening branch. RETIREMENT CRITERION AT BIRTH (guard-769): retire when the touch-after-success alternative lands (making the failure self-retrying) OR when 30 days of firings show zero rows while worker Bodies are demonstrably active — either means the dark path is closed or never taken."
    retirement_eligible: true

