    fn_description: "Prose-only goal slips through; verify phase has no structured criteria; goal completes on hallucinated success."
    rb_evidence: ["g-115-1440"]
    tuning_notes: >-
      KEEP — do NOT retire (g-115-1440 scoping verdict, 2026-06-14). The
      all-noop streak (446 in-window / 2204 all-time) is NOT drift-absence:
      the prose check (aspirations.py:_check_prose_verification_drift,
      reachable only via validate_goal) is ORPHANED from the live daemon
      write path. Daemon add_goal (mind_api/src/endpoints/aspirations_write.py:1159)
      and _validate_aspiration call the daemon's _validate_goal SUBSET (L202)
      which omits the prose check (git log -S confirms it never had it); the
      CLI's validate_aspiration is dead code (no callers). Both historical
      blocks (g-test-3, g-115-28) predate the 2026-05-14 daemon cutover; 671
      post-cutover firings produced 0 blocks. FN is REALIZED in the live queue:
      g-315-119 (completed) and g-316-08 (pending) carry the "Verification
      outcomes:" marker with zero verification.checks and slipped through.
      rb-1235 pattern (guaranteed-noop because wired to a vestigial path).
      FIX (queued, follow-up goal): wire _check_prose_verification_drift into
      the daemon _validate_goal on add + update — restore daemon/CLI parity.
      retirement_eligible set false so gate-retirement-eval emits "keep
      (structural)" instead of re-flagging INVESTIGATE every cycle (guard-756).
    retirement_eligible: false

