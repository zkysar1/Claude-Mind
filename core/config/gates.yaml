  - id: stale-read-gate
    script: core/scripts/stale-read-gate.py
    embedded: false
    instrumented: true
    sites:
      - { file: "core/scripts/aspirations.py", phase: "cmd_add_goal (parent_goal stale-context check)" }
    dominant_risk: FN
    asymmetry_magnitude: medium
    keyword_bias: balanced
    override_flag: "--override-stale-read"
    fp_cost: low
    fn_cost: medium
    fp_description: "Agent with a stale tracked receipt forced to re-read parent before filing child; ~1 extra read. Never-read case (no receipt) retired g-115-1572 -- it passes (was fail-open under g-115-1569)."
    fn_description: "Child filed on stale parent context; constraints/decomposition shape derived from outdated requirements (g-115-410 class)."
    rb_evidence: []
    tuning_notes: "g-115-410 sub-task 3. Skips when parent_goal absent OR parent has no last_modified (legacy). Block 2 compares parent.last_modified vs <agent>/session/goal-reads.jsonl most-recent read_at. g-115-1569: the never-read branch (no receipt) FAILS OPEN instead of blocking. g-115-1572 (decision B): never-read branch PERMANENTLY RETIRED -- option A (extract a daemon-safe goal-read writer to re-activate it) was REJECTED. The receipt mechanism is structurally false-positive-prone (parent context arrives via compact data / selector / prior session, not only daemon reads); all 29 ledger overrides were never-read FPs where the agent HAD read the parent, zero genuine. Restoring the writer would re-create that 100pct-override friction at write-on-every-read cost. Block 2 is itself DORMANT here (no path writes goal-reads.jsonl, so last_read is always None) -- retained as correct logic should receipts return; the gate is currently inert (a whole-gate-retirement candidate). g-115-1796 (2026-07-06): alpha's g-333-02-MISSED straggler goal-reads.jsonl (114667 frozen lines, last content read_at 2026-05-14) DELETED -- it was the sole survivor (bravo/charlie/delta/echo/zeta already clean under g-333-02), so Block 2's 'last_read is always None' now holds FLEET-WIDE and the gate is provably inert for every agent. The gate-retirement-eval 'tighten' recommendation is SUPERSEDED: it rested on the 29 never-read overrides, a branch ALREADY retired under g-115-1572 -- nothing remains to tighten (Block 2 is the irreducible genuine check; further tightening = a no-op = de-facto retirement). Honest disposition is RETIREMENT, staged as a follow-up for the daemon-hot-path code removal (gates.yaml entry + aspirations.py cmd_add_goal + daemon aspirations_write.py + stale-read-gate.py + gates/stale_read.py + --override-stale-read flag + test_stale_read_gate.py). Audit ledger: world/stale-read-overrides.jsonl."
    retirement_eligible: true

