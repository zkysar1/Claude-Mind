      - { file: ".claude/skills/aspirations-state-update/SKILL.md", phase: "Step 8.75" }
    dominant_risk: FN
    asymmetry_magnitude: extreme
    keyword_bias: generous
    override_flag: "--override"
    fp_cost: low
    fn_cost: high
    fp_description: "Legit evidenced claim blocked; agent forced to re-read (~50ms)."
    fn_description: "Hallucinated state claim passes; downstream reasoning builds on a wrong file."
    rb_evidence: []
    tuning_notes: "Phase 3 candidate. Widen trigger pattern set; tolerate FP."
    retirement_eligible: true

