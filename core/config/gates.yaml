      - { file: "core/scripts/aspirations.py", phase: "cmd_update_goal (defer_reason)" }
    dominant_risk: FN
    asymmetry_magnitude: high
    keyword_bias: generous
    override_flag: "--override-agent-match"
    fp_cost: medium
    fn_cost: high
    fp_description: "User-only goal reclassified as agent-capable; agent thrashes, recoverable."
    fn_description: "Agent-capable work routed to user; freezes for days/weeks (g-115-156 class)."
    rb_evidence: []
    tuning_notes: "Already wide via three-source scan (forged-skills, SKILL.md triggers, capability-routing.md)."
    retirement_eligible: true

  - id: blocker-create-gate
