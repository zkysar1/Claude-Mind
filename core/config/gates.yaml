    rb_evidence: []
    tuning_notes: "Instrumented g-115-3626. Its whole tuning history is FP suppression (release-kind hits no longer keep race_risk latched forever; goal-record citations no longer flip it -- g-115-2131, g-115-3459), hence strict. `block` here means ADVISORY-block: race_risk IS a yield recommendation, so `block` is the honest label even though the probe never hard-blocks -- unlike store-dupe-warn above, which recommends nothing and therefore logs a warn as `pass`. Same mechanism, two verdicts: do not unify the mappings."
    retirement_eligible: true

  - id: phase-4-26-gate
    script: core/scripts/phase-4-26-gate.py
