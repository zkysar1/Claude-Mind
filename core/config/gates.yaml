  # STRUCTURAL, DO NOT RETIRE (, 2026-07-29). The evaluator recommended
  # RETIRE on 11 firings / 11 noops / 0 decisions in 68 days. Investigating it
  # showed the zero-output is caused UPSTREAM, not by obsolescence:
  # `selection_heuristics` (goal-selection-strategy.yaml) and
  # `generation_heuristics` (aspiration-generation-strategy.yaml) are BOTH EMPTY
  # LISTS, so the matcher iterates nothing and can only ever log noop. It is not
  # a too-narrow trigger — there is nothing to trigger against.
  #
  # The only writers of those fields are meta-transfer.py (cross-domain IMPORT)
  # and meta.yaml's `[]` initial state. No local producer generates heuristics
  # from experience — that missing producer is the real defect (tracked
  # separately), and it is what makes the corpus empty.
  #
  # Retiring this consumer would delete a working matcher AND orphan the field
  # meta-transfer imports INTO, silently breaking cross-domain strategy transfer
  # — while registering as a complexity-budget win. Marked not-eligible so the
  # evaluator returns "keep (structural)" instead of re-recommending retire
  # every pass on evidence that can never improve until the producer exists.
  - id: strategy-apply
    script: core/scripts/strategy-apply.py
    embedded: false
    instrumented: true
    sites:
      - { file: ".claude/skills/aspirations-execute/SKILL.md", phase: "meta-strategy match" }
    dominant_risk: both
    asymmetry_magnitude: low
    keyword_bias: balanced
    override_flag: null
    fp_cost: low
    fn_cost: low
    fp_description: "Strategy misapplied; mild behavior drift."
    fn_description: "Strategy missed; slightly slower learning this iteration."
    rb_evidence: []
    tuning_notes: "Low priority for tuning."
    retirement_eligible: false   # see the STRUCTURAL note above (g-001-221)

