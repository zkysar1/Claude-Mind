    asymmetry_magnitude: high
    keyword_bias: generous
    override_flag: "--override-duplication"
    fp_cost: low
    fn_cost: medium
    fp_description: "Legit non-overlap blocked on shared keyword; agent rewords or overrides (~30s)."
    fn_description: "Duplicate goal filed; partner conflict / self-thrash on overlapping work (g-115-141 class)."
    rb_evidence: ["rb-466"]
    tuning_notes: "4-check mosaic (recent_completions, git_log, insight_triggers, target_state). target_state has class-name inference fallback (g-248-56). IDF-weighted keywords (cd93fe4)."
    retirement_eligible: true

