    dominant_risk: FN
    asymmetry_magnitude: high
    keyword_bias: generous
    override_flag: "--override-blocker-gate"
    fp_cost: medium
    fn_cost: high
    fp_description: "Legit blocker needs extra probe step; small friction."
    fn_description: "Blocker filed on false premise; 5-day TTL freeze + corrupted reasoning bank."
    rb_evidence: ["rb-245"]
    tuning_notes: "Statistical-negation pattern. Schema-probe-first protocol enforced."
    retirement_eligible: true

  - id: goal-duplication-gate
    script: core/scripts/goal-duplication-gate.py
    embedded: false
    instrumented: true
    sites:
