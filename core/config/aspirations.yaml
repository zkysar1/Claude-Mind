# Aspiration Engine — Framework Definition
# Immutable configuration. Agent state lives in world/aspirations.jsonl
# init-world.sh copies core/config/world-aspirations-initial.jsonl to world/ on first run.
# init-agent.sh copies core/config/agent-aspirations-initial.jsonl to <agent>/ on first run.

# --- FRAMEWORK ---

max_active: 100

# Team-based goal delegation
max_concurrent_goals: 3   # Max concurrent goals per iteration (primary + parallel)

# --- GOAL TEMPLATES ---
# Reference templates for goal creation. Match the goal's purpose to a template.
# When creating a goal, start from _common_fields, then layer on the style-specific fields.
# These are patterns, not live data — adapt IDs, titles, and details to the situation.

goal_templates:
  # Fields required on EVERY goal regardless of style
  _common_fields:
    id: "g-{asp}-{seq}"             # aspiration number + sequence (e.g., g-003-02)
    title: "Short descriptive title"
    description: "What this goal does, why it matters, and key context"
    status: pending
    participants: [agent]            # [agent] (any), [user], [alpha], [bravo], or combinations
    blocked_by: []                   # IDs of prerequisite goals
    blocked_since: null               # ISO 8601 — when blocked_by was first populated (for timeout)
    verification:                    # unified field (replaces desiredEndState + completion_check)
      outcomes: ["Measurable outcome that agent can verify"]  # human-readable
      checks: []                     # machine-verifiable conditions
      preconditions: []              # what must be true before execution
    achievedCount: 0
    priority: MEDIUM                 # HIGH, MEDIUM, LOW
    category: null                    # Tree category for retrieval — set via category-suggest.sh
    deferred_until: null              # ISO 8601 timestamp — goal skipped in COLLECT until this time
    defer_reason: null                # Why deferred — non-null value filters goal from selection
    review_requested: null            # ISO 8601 timestamp — set when code-change goal completes, needs peer review
    review_completed: null            # ISO 8601 timestamp — set when reviewing agent approves

  # Build knowledge — deep-dives, audits, topic exploration
  research:
    skill: /research-topic
    verification:
      outcomes: ["Knowledge node registered for {topic} with research findings"]
      checks:
        - type: file_check
          target: "world/knowledge/tree/_tree.yaml"
          condition: "Node registered for {topic} with research findings"

  # Code changes — bug fixes, features, refactoring, security hardening
  development:
    skill: null                      # agent uses tools directly (Read, Edit, Bash)
    verification:
      outcomes: ["Specific code artifact changed or created"]
      checks: []                     # agent verifies inline during Phase 5
      verification_hint: "Consider: file_check on changed file, command_check on build/test"

  # Testable predictions — created by sq-009 spark or /decompose companion
  hypothesis:
    skill: "/review-hypotheses --hypothesis {hypothesis_id}"
    hypothesis_id: "{YYYY-MM-DD}_{slug}"  # links to pipeline backing file
    horizon: short                   # session | short | long (micro stays in working memory)
    resolves_no_earlier_than: null    # session: null, short: +12h, long: +24h
    resolves_by: null                # session: session_end, short: +7d, long: +90d
    # Pipeline record must exist in world/pipeline.jsonl (accessed via pipeline-read.sh)
    # Phase 5 handles CONFIRMED/CORRECTED/PENDING/EXPIRED — not completion_check

  # Batch hypothesis operations — resolve outcomes, learn from results
  review:
    skill: "/review-hypotheses --resolve"  # or --learn, --full-cycle, --accuracy-report
    verification:
      outcomes: ["Pipeline records processed and accuracy updated"]
      checks: []
      verification_hint: "Consider: command_check on pipeline-read.sh to verify records moved"

  # Recurring housekeeping — goals that re-fire on a schedule.
  # NOTE: Any goal template can be combined with these recurring fields.
  # Add recurring: true + interval_hours to any goal to make it repeat.
  # The monitoring template is an example of a naturally recurring pattern.
  recurring:
    recurring: true
    interval_hours: 24
    lastAchievedAt: null
    achievedCount: 0
    currentStreak: 0
    longestStreak: 0
    windowStreak: 0                 # tolerant streak — counts cycles within
                                    # windowStreakMultiplier × interval_hours
    longestWindowStreak: 0
    windowStreakMultiplier: 7        # default tolerance: 7× interval. Set
                                    # higher for "fire at least once per week"
                                    # goals; lower for stricter cadences.
    verification:
      outcomes: ["Task completed successfully"]
      checks: []
      preconditions: []
      verification_hint: "Consider: command_check or file_check appropriate to the recurring task"

  # Requires user decision or infrastructure access the agent lacks
  user_action:
    participants: [user]
    skill: null
    # Agent skips in COLLECT (scores +0 in agent_executable)
    # Agent logs reminder and continues autonomously

  # --- Verification & Testing ---

  test_automated:
    skill: null
    verification:
      outcomes: ["Test suite passes with N assertions covering {scope}"]
      checks:
        - type: command_check
          command: "{test_command}"
          condition: "exit code 0"

  test_manual:
    skill: null
    verification:
      outcomes: ["Observed behavior matches expected: {description}"]
      checks: []
      verification_hint: "Consider: can this be converted to a command_check or automated test?"

  test_regression:
    skill: null
    verification:
      outcomes: ["Regression test added covering {bug/change}"]
      checks:
        - type: file_check
          target: "{test_file_path}"
          condition: "exists and contains assertion for {scenario}"

  test_integration:
    skill: null
    verification:
      outcomes:
        - "Integration path traced: {trigger} -> {handler} -> {side_effect}"
        - "Silent behavioral gaps identified or confirmed absent"
      checks: []
      verification_hint: "STRONGLY consider: command_check on integration test, file_check on trace output"
      preconditions:
        - "Target module or integration path identified"

  # --- Analysis & Knowledge ---

  analysis:
    skill: null
    verification:
      outcomes: ["Analysis complete with findings documented in {location}"]
      checks: []
      verification_hint: "Consider: file_check on output document or knowledge node"

  audit:
    skill: null
    verification:
      outcomes: ["Audit complete: {N} items reviewed, {M} issues found"]
      checks: []
      verification_hint: "Consider: file_check on audit report, command_check verifying item count"

  documentation:
    skill: null
    verification:
      outcomes: ["{document} created/updated at {path}"]
      checks:
        - type: file_check
          target: "{path}"
          condition: "exists"

  knowledge_encoding:
    skill: null
    verification:
      outcomes: ["Knowledge node {key} updated with {topic} findings"]
      checks:
        - type: file_check
          target: "world/knowledge/tree/_tree.yaml"
          condition: "Node {key} exists with updated content"

  infrastructure:
    skill: null
    verification:
      outcomes: ["{system} deployed/configured and operational"]
      checks: []
      verification_hint: "Consider: command_check on health endpoint or infra-health.sh check"

  # --- Pain / Reactive ---

  diagnosis:
    skill: null
    # Deliverable is understanding, not code. Use when something is broken
    # and the root cause is unknown. Distinct from development (which fixes).
    verification:
      outcomes: ["Root cause of {problem} identified and documented"]
      checks: []
      verification_hint: "Consider: file_check on knowledge node documenting root cause"

  blocker_resolution:
    skill: null
    # Actively clear a blocker instead of waiting for expiry or user.
    # Links to working memory known_blockers entries.
    verification:
      outcomes: ["{blocker} resolved — {skill/resource} now accessible"]
      checks: []
      verification_hint: "Consider: command_check verifying the previously-blocked action succeeds"

  cleanup:
    skill: null
    # Remove stale data, orphaned references, dead code, contradicted knowledge.
    # Distinct from audit (which finds issues) — cleanup fixes them.
    verification:
      outcomes: ["{target} cleaned — {N} items removed/updated, no orphaned references"]
      checks: []
      verification_hint: "Consider: command_check counting remaining orphaned items (should be 0)"

  # --- Recurring / Trigger-Aware ---

  monitoring:
    skill: null
    # Naturally recurring observation. Combine with recurring fields.
    # Use for health checks, log watching, metric tracking.
    recurring: true
    interval_hours: 4
    lastAchievedAt: null
    achievedCount: 0
    currentStreak: 0
    longestStreak: 0
    verification:
      outcomes: ["Health check passed for {system}, anomalies documented if found"]
      checks: []
      verification_hint: "Consider: command_check on health endpoint, file_check on anomaly log"

  # --- Learning Through Building ---

  spike:
    skill: null
    # Build throwaway prototype to learn. Artifacts are disposable —
    # the LEARNING (encoded in knowledge tree) is the deliverable.
    # Do not commit spike code to production repos.
    verification:
      outcomes: ["Spike findings documented — {question} answered via {approach}"]
      checks:
        - type: file_check
          target: "world/knowledge/tree/_tree.yaml"
          condition: "Node updated with spike findings"

# Proactive starvation prevention — create work BEFORE the pipeline empties.
# Phase 0.5.1 counts executable goals and triggers /create-aspiration when below this.
pipeline_low_water_mark: 3      # create new work when executable goals drop below this

# Hypothesis pipeline starvation prevention — ensure the prediction pipeline stays active.
# Phase 0.5.2 counts discovered+active pipeline records and triggers investigation when below this.
hypothesis_pipeline_low_water_mark: 4   # create prediction review goal when flowing hypotheses drop below this

# Accuracy health gate — create investigation work when prediction accuracy drops critically.
# Phase 0.5.3 reads pipeline accuracy and triggers investigation when below this threshold.
accuracy_critical_threshold: 0.40       # trigger investigation when accuracy drops below 40%
accuracy_min_sample: 5                  # require at least 5 resolved hypotheses before gate activates

# Tree-encoding drift threshold (): iteration-close.sh tree-encoding-drift-gate fires
# force_tree_encoding=true sentinel + resets counter when goals_since_last_tree_update >= this.
# Lower → more frequent forced encoding; higher → tolerates longer deep-without-encoding streaks.
tree_encoding_drift_threshold: 3

# temp/ accumulation pressure (file-model normalization Phase 5).
# precheck-eval.py cmd_temp_pressure counts UNDRAINED working docs directly under
# the bound agent's temp/ (excluding the drained/ audit subdir) and flags
# accumulation so temp/ never becomes the new slush directory. warn = visible
# nudge; drain = orchestrator files a HIGH /drain-temp goal (deduped against any
# open drain goal). temp/ is a staging SSOT that drains to the knowledge tree —
# see core/config/conventions/temp-store.md.
temp_pressure:
  warn_threshold: 10          # >= this many undrained docs -> visible warn (no goal)
  drain_goal_threshold: 20    # >= this many -> file a HIGH /drain-temp goal

# --- STALE-SENTINEL CANARY () ---
# Defense-in-depth for Cat C sentinels (bash writer + SKILL-only consumer).
# If the consumer SKILL is skipped mid-iteration (graceful-stop interruption,
# compact recovery, LLM omission), the sentinel accumulates a set value and
# goes unread. The canary counts consecutive canary-runs in which each
# tracked sentinel remains set, then files an Investigate goal at threshold.
#
# Tracked sentinels (force_* counter-gate family, set/clear semantics):
#   - force_tree_encoding              (consumer: aspirations-state-update Step 8)
#   - force_tree_maintain              (consumer: aspirations-precheck Phase 0-pre)
#   - fresh_eyes_dispatch_pending      (consumer: aspirations-precheck Phase 0-pre3)
#   - force_metric_encoding_pending    (consumer: aspirations-precheck Phase 0-pre4)
#
# Not tracked: consolidation_health (refresh-snapshot, no set/clear) and
# known_blockers (list-shaped, handled by blocker-recheck.sh).
#
# Invoked from: iteration-close.sh do_productivity_check() (fail-open).
# Source: core/scripts/stale-sentinel-canary.py
stale_sentinel:
  threshold_iterations: 3   # consecutive canary runs with the sentinel still set before filing Investigate

# --- PRECHECK BUDGET CAP (Magic Wand 2 — ) ---
# Budget cap on aspirations-precheck wall-clock cost. When cumulative precheck
# elapsed-ms exceeds budget_pct of iteration_budget_ms, deferrable sweeps are
# dropped. Always-run sweeps NEVER drop regardless of budget. The cost-meter
# (core/scripts/aspirations-precheck-budget-meter.sh) tracks per-sweep cost
# and logs decisions to <agent>/session/precheck-drops.jsonl for visibility.
#
# Why wall-clock and not tokens: within a single turn, context-budget.json's
# token counters are stable (only update at turn boundaries), so per-sweep
# token-delta is structurally zero. Wall-clock seconds give a meaningful,
# real-time signal. The "context budget" framing in the goal description is
# preserved via the zone-drop fallback below.
#
# Sweep tiers (priority order):
#   always-run:  Phase 0-pre (tree-debt), 0-pre2 (experience-archival),
#                0-pre3 (fresh-eyes-code-dispatch). Safety-critical sentinels.
#                Plus the two notification-age safety gates inbox-alert-age-check
#                (0.5b.1b) + handoff-aging-check (0.5b.2b) — they escalate aged
#                unclaimed work to external parties (user email / partner board),
#                so they fire reliably; not meter-gated (6).
#   medium:      aspirations-recover-recurring, monitor-stale-check,
#                precheck-eval (run-all), blocker-recheck (Phase 0.5b.0.5),
#                defer-recheck (Phase 0.5b.4).
#   deferrable:  pending-questions-sweep (0.5b.5), recurring-precondition-sweep
#                (0.5c), fresh-eyes-cadence (0.5e), fresh-eyes-program-cadence
#                (0.5e.5), felt-sense-cadence (0.5f), l1-skew-cadence (0.5g),
#                health-regression-cadence (0.5h). All are themselves
#                cadence-gated, so dropping them in tight zones is safe.
#
# Always-run sweeps fire 100% of the time regardless of zone or budget. If
# precheck-drops.jsonl ever shows an always-run drop, that's a bug — raise
# budget_pct or move the sweep up the priority order.
precheck:
  enabled: true                # global on/off
  budget_pct: 15               # informational target — drop deferrable when zone==tight OR elapsed > budget
  iteration_budget_ms: 600000  # nominal iteration wall-clock cap (10 min); budget = 15% = 90s. Raised 2026-05-10 (g-115-559) — observed precheck cost 100-300s under OneDrive sync; 9s cap (60s nominal) was dropping all deferrable sweeps every cycle. 90s allows fast cycles to complete deferrables, still drops slow/stalled cycles.
  zone_drop_rules:
    fresh: []                  # run all
    normal: []                 # run all (under autocompact 50%)
    tight: [deferrable]        # drop deferrable sweeps in tight zone
  drop_log: precheck-drops.jsonl  # appended under <agent>/session/

# --- ANTICIPATORY REFLECTION (Phase 3.96 / ; design: world/conventions/anticipated-failures.md) ---
# Devil's-Advocate failure prediction BEFORE deep goals (Gate 1 = estimated_depth==deep),
# scored over time as anticipation_accuracy (sibling of the Phase 3.95 depth-calibration signal).
# DORMANT by default — flag off = zero behavior change. Flip on (or set env GATE_3_96_ENABLED)
# for the Phase E A/B trial. A MISSING key reads false (fail-safe to dormant; bravo 
# ship condition). This flag is the single off-ramp for the whole mechanism.
anticipatory_reflection:
  enabled: false               # default-OFF off-ramp; env override GATE_3_96_ENABLED for experiments

planning:
  check_interval_goals: 3       # run alignment check every N completed goals
  novelty_drought_hours: 48     # hours since last first-time goal completion
  maintenance_threshold: 0.70   # fraction of recurring goals that suggests planning

# --- ASPIRATION SCOPES ---
# Aspirations are classified by scope to control research depth, goal count,
# and archival maturity. Default is "project" — multi-session arcs with research.
# Scope cascades into: research requirements, goal count ranges, archival gates.
# Cognitive primitives (Unblock/Investigate/Idea goals) are scope-exempt.

aspiration_scopes:
  sprint:
    description: "Tactical — single fix, cleanup, reactive response (1-2 sessions)"
    goal_range: [2, 5]
    research_required: false
    archival_min_sessions: 1
    goal_addition_research: false
  project:
    description: "Multi-session arc — research + build + test lifecycle (3-10 sessions)"
    goal_range: [5, 15]
    research_required: true
    archival_min_sessions: 2
    goal_addition_research: true
  initiative:
    description: "Strategic arc — phased work, many sessions (10+)"
    goal_range: [10, 30]
    research_required: true
    archival_min_sessions: 4
    goal_addition_research: true
    phased_generation: true    # Generate Phase 1 goals now; later phases in description

default_scope: project

# --- INTENT-SATISFIED CLOSURE ---
# Aspirations can close via the intent-satisfaction pathway (aspirations-complete-intent.sh)
# when the `motivation` has been met by already-completed goals, even if trailing goals
# are blocked or no longer necessary. Structural evidence gates prevent abuse:
#   1. Evidence cardinality (this block's scope floor + 50% of non-recurring goals)
#   2. Evidence quality (every evidence goal is status=completed with verification.outcomes)
#   3. Rationale >=40 chars with >=1 token overlap with motivation
# Trailing goals listed in superseded_goal_ids transition to status=superseded.
# See: core/scripts/aspirations.py cmd_complete, aspirations-complete-review Phase 7.4.

intent_satisfaction:
  min_evidence_by_scope:
    sprint: 2         # sprint: small; 2 completed goals is a meaningful majority
    project: 3        # project: default; 3 completed goals is a credible record
    initiative: 5     # initiative: don't cheaply close a multi-session strategic arc
  # Phase 7.4 (Intent-Satisfaction Pre-Gate) only triggers when trailing blocked goals
  # have been blocked_since longer than this (coarse age gate — fresh blockers don't count).
  phase_7_4_min_blocked_hours: 24
  # Zombie scan threshold — aspirations matching this in precheck get routed to Phase 7.4.
  zombie_completion_ratio: 0.80

# Post-state-update gate cooldown (). Suppresses /fresh-eyes-code
# dispatch re-fires when the gate's flagged file set is a subset of the last
# fire's set AND the last fire was within `cooldown_hours`. Prevents the
# dispatch-loop observed across iter 37/42/45 where each deep state-update
# re-listed cumulative files already covered by a recent review. Set to 0 to
# disable cooldown (dispatch fires every iteration that crosses threshold).
# Raised 4 → 12 ( / iter-109 finding): cooldown_hours=4 was too tight
# for cross-agent inter-arrival. iter-109 case: bravo /fresh-eyes-code at 02:48,
# alpha gate fired 07:17 (4h 29m later — peer cooldown expired by 29 min).
# Alpha's intermediate ships had not touched bravo's 7 reviewed files, so the
# duplicate review was waste. 12h covers the natural 4-8h cross-agent gap with
# margin. If own-cadence regression observed (own work needing re-review within
# 12h), split into peer_cooldown_hours: 12 + own_cooldown_hours: 4.
post_state_update_gate:
  cooldown_hours: 12

# Consolidation-health snapshot thresholds (). Centralizes constants
# previously hardcoded in core/scripts/consolidation-health.py. Three readers
# consume the derived counts (create-aspiration Step 1, aspirations-select
# Phase 2.55, aspirations-evolve Step E) via the consolidation_health WM slot.
# Keep both thresholds in [0.0, 1.0]; NEAR must exceed STALLED.
consolidation_health:
  near_complete_threshold: 0.75   # ratio at/above which an aspiration is "nearly done"
  stalled_threshold: 0.25         # ratio below which an aspiration is "stalled"

# --- EPISODE CHAINING (MR-Search: Meta-RL with Self-Reflection) ---
# When a goal fails or produces a surprising outcome, chain multiple attempts
# with structured reflection between each. Context accumulates:
#   goal → episode₀ → reflection₀ → episode₁ → reflection₁ → ...
# Inspired by: MR-Search (arXiv 2603.11327) sequential episode chaining.
# The agent learns through failure within the same problem context rather than
# deferring retry to a future loop iteration with no structured memory.

episode_chaining:
  # max_episodes_per_goal removed  — context_zone_override is the live
  # source of truth; see aspirations-execute/SKILL.md:507 "do not add a
  # fallback to max_episodes_per_goal; that hides config drift."
  reflection_budget_per_episode: "mini"  # mini | standard — controls reflection depth between episodes
  chain_on_outcomes:                 # Which outcomes trigger chaining
    - "failed"                       # Goal execution failed (NOT infrastructure — Phase 4.0 handles those)
  carry_forward_context: true        # Include prior episode context in next attempt
  context_zone_override:             # Limit chaining based on context budget
    tight: 0                         # Disabled — no retries in tight context
    normal: 1                        # One retry
    fresh: 2                         # Two retries

# --- EXPLORATION MODE (MR-Search: Exploration/Exploitation Masking) ---
# Designates certain goal executions as "exploration" where failure does NOT
# negatively impact accuracy stats, streaks, or evolution triggers.
# Information gathered IS retained in experience archive and knowledge tree.
# Inspired by: MR-Search exploration episode masking — zero reward during
# backpropagation, but full context retention in forward pass.

# --- PLATEAU DETECTION (AVO-inspired: arXiv 2603.24517) ---
# Detects when aspirations keep completing goals but learning yield is stagnating.
# Inspired by NVIDIA AVO's self-supervision mechanism that detects exhausted
# exploration directions and unproductive cycles, then redirects strategically.

plateau_detection:
  velocity_window: 5              # Number of recent completed goals to analyze
  plateau_threshold: 0.2          # Learning velocity below this = plateau
  diminishing_returns_window: 5   # Goals over which to check monotonic decline
  # Learning is measured by aspiration-trajectory.py as: reasoning bank entries,
  # guardrails, pattern signatures, and tree node updates attributed to each goal.

# --- CYCLE DETECTION (AVO-inspired: arXiv 2603.24517) ---
# Detects when the agent cycles through similar failing approaches across
# different goals within the same aspiration without stepping back to
# question root assumptions. Inspired by AVO's unproductive edit cycle detection.

cycle_detection:
  lookback_window: 3              # Number of recent goals to check for cycles
  report_signal_age_days: 7       # zero_learning_velocity suppression: any <agent>/temp/*.md mtime within N days for recent goal IDs counts as substantive learning artifact (g-115-188 false-positive fix; reports/ abolished 2026-06-02, temp/ is the scan target — key name retained for consumer compat)
  checks:                         # What the precheck skill looks for
    - repeated_failure             # Almost all recent goals skipped/blocked
    - zero_learning_velocity       # Same-category goals producing no learning artifacts

# --- PROACTIVE ESCALATION ---
# Notify user via forged notification skill or pending-questions when blocked beyond these thresholds.
# Caller-side cooldown via proactive_escalation_log WM slot prevents spam.
proactive_escalation:
  blocker_age_hours: 2          # Phase 0.5b: notify when blocker active > N hours
  b7_notify: true               # B7: notify before exponential backoff sleep
  circuit_breaker_notify: true   # Phase 5.5: notify when circuit breaker fires
  inbox_alert_age_hours:        # Phase 0.5b.1b (g-115-848): notify when an alert-sweep-filed Unblock has aged unclaimed.
    high: 4                     #   Aged > high → fire HIGH-severity notification (>= these many hours since created_at).
    medium: 12                  #   Aged > medium with no prior HIGH fire → fire MEDIUM-severity notification.
                                #   Cooldown via wm.proactive_escalation_log keyed on f"inbox_alert_{goal.id}". Closes  finding (2).

# --- UNBLOCK INTAKE PROBE (7, rb-1111) ---
# Fast intake-time probe for Unblock goals at claim time. Parses the goal's
# failure_reason for named artifacts (commit hashes, file:line refs, function
# names) and emits a probable-fix-landed | bug-still-present | inconclusive
# verdict. Saves redundant fix cycles when the cited bug was resolved by an
# independent commit between filing and pickup. Canonical incident: 
# (filed 2026-05-19 vs commit a49e4805 fix landed before pickup).
# Wired into aspirations-execute Phase 4 just-after-claim.

unblock_intake_probe:
  enabled: true                 # Set false to disable the probe entirely
  min_age_hours: 6.0            # Skip Unblocks newer than this — no realistic fix-after-filing race window

# --- PORTFOLIO HEALTH REVIEW ---
# Periodic portfolio-level assessment during evolution. Catches drift that
# per-aspiration mechanisms miss: priority inflation, completed aspirations
# lingering unarchived, recurring goals trapped in project aspirations.
# Runs as Step 2.75 in aspirations-evolve (same cadence as evolution).

portfolio_review:
  priority_concentration_warn: 0.70 # Warn when >70% of active aspirations share the same priority level
  stale_threshold_sessions: 2       # Demote HIGH aspirations with 0 aggregate score for N+ sessions

exploration_mode:
  auto_designate_below_capability: 0.30  # Categories below this capability_level
  max_exploration_fraction: 0.25          # Max fraction of goals in exploration mode per session
  shield_from:                            # What exploration goals are shielded from
    - accuracy_stats                      # Don't count toward accuracy tracking
    - streak_reset                        # Don't break streaks on failure
    - evolution_triggers                  # Don't fire accuracy_drop or consecutive_losses
  retain_in:                              # What exploration goals still contribute to
    - experience_archive                  # Full-fidelity trace preserved
    - tree_encoding                       # Knowledge encoded regardless of outcome
    - pattern_signatures                  # Patterns still matched and recorded

# --- LIGHTWEIGHT GOAL MODE (; design ) ---
# PRE-execution trivial-goal classifier. core/scripts/trivial-goal-classify.py
# predicts whether a goal is TRIVIAL (no learning worth extracting) so Phase 4
# can skip the ~17 ceremony sub-phases in the Phase 3.9-4.5 window (intelligent
# retrieval, mid-exec drift/chunk encoding, episode chaining, causal-enabler
# scan, experience archival, knowledge reconciliation). COMPLEMENTARY to the
# POST-execution `routine` outcome_class (skips 4.25/6) and recurring-close.sh
# (collapses 5/8/9.5/10) — this is the only mechanism that reaches the pre/mid/
# immediate-post band, because it fires BEFORE execution.
#
# A goal is "trivial" ONLY when ALL THREE booleans hold (conservative AND-gate);
# ANY uncertainty or error -> "full". Asymmetric risk is the decisive constraint:
# a false-negative (trivial treated as full) costs only overhead, but a
# false-positive (real goal treated as trivial) skips learning and is recoverable
# only via the Phase-4-post escape hatch — so every ambiguity resolves to "full".
#   1. empty_verification_checks — verification null OR checks empty
#   2. no_diff_expected — explicit produces_diff:false, OR skill matches a
#      pure_action_skills substring, OR category in action_only_categories.
#      NEVER inferred from a code/framework/analysis category.
#   3. no_retrieval_call — explicit retrieval:none, OR pure-action skill.
#
# `enabled` DEFAULTS OFF (: ship a behavior-changing factor flag-gated,
# validate before activating). With enabled:false the classifier returns "full"
# for every goal — byte-identical to pre-change loop behavior. Flip to true only
# after an A/B / validation pass. Allowlists are domain-tunable (mirrors
# class_balance.targets) — a domain extends them via world/config/aspirations.yaml.
lightweight_mode:
  enabled: false                    # master gate. Validated 2026-06-13 (g-305-16): kept OFF
                                    # because INERT, not unsafe. With --assume-enabled, 0 of 1668
                                    # recurring+completed goals classify trivial. Binding constraint is
                                    # no_retrieval_call (boolean 3): NO goal sets retrieval:"none" /
                                    # produces_diff:false, and no goal's skill-field matches a
                                    # pure_action_skills substring. action_only_categories (boolean 2)
                                    # CANNOT overcome boolean 3, so populating it is a no-op today.
                                    # Flip ON only after the activation gap is closed (goals adopt the
                                    # explicit-trivial fields, or boolean 3 gains a category path). See
                                    # the  follow-up. ( ship-OFF-validate-enable pattern)
                                    #  DECISION (2026-06-15, zeta): activation gap CLOSED by
                                    # decision, not by flipping ON. Live-corpus repro (1840 active goals):
                                    # b1=1723 pass, b2=0, b3=0 -> 0 trivial. Refines : b2 ALSO 0
                                    # today (not just b3) -- both blocked by the same unpopulated metadata
                                    # (retrieval=<absent> + produces_diff=<absent> on all 1723 empty-checks
                                    # goals; skill=None on 1683, and the 40 with skill match 0 pure-action).
                                    # Path (b) extend-boolean-3-to-category = REJECT (weakens the asymmetric-
                                    # risk explicit-opt-in judgment guard -- the decisive design constraint).
                                    # Path (c) align-pure_action_skills = REJECT (void: pure-action goals
                                    # carry skill=None via forged-skill resolution; 0 corpus matches).
                                    # Path (a) explicit per-goal retrieval:"none"/produces_diff:false (auto-
                                    # stamp at goal-create) is the ONLY design-preserving route, but DEFERRED:
                                    # the genuinely-trivial cohort is <=8 goals, all recurring -> already
                                    # covered by recurring-close.sh (5/8/9.5/10) + routine (4.25/6); the only
                                    # marginal gain is the Phase 3.9-4.5 band on those <=8, not worth a goal-
                                    # create auto-stamp build now. Revisit (a) when the trivial cohort grows.
                                    # Full trace: agents/zeta/experience/exp-. (rb-222: activate the
                                    # existing explicit-field mechanism; don't add inference paths.)
  pure_action_skills:               # skill-name substrings (case-insensitive) treated as pure-action
    - notify
    - health
    - presence
    - inbox
  action_only_categories: []        # category names that are pure-action (no diff, no retrieval).
                                     # Empty default = category inference disabled (explicit goal
                                     # fields only); domain supplies monitoring/notification categories.
  never_trivial_categories:         # asymmetric-risk denylist — these NEVER classify trivial even if
                                     # the three booleans somehow hold (defense-in-depth for code/learning work)
    - framework-architecture
    - framework-engineering
    - framework-meta
    - framework-maintenance

# --- STRATEGIC SCAN (Environmental Observation) ---
# Periodic "step back and look" phase that reads world signals
# and generates work from environmental observation rather than
# introspection. Runs conditionally — not every iteration.

strategic_scan:
  goal_cadence: 5               # Run scan every N completed goals (tightened from 8 to surface "is this serving the Program?" at ~60% higher frequency)
  hours_cadence: 4              # Run scan every N hours (regardless of goal count)
  recurring_ratio_trigger: 0.80 # Run scan when this fraction of recent goals are recurring
  knowledge_staleness_days: 30  # S2a staleness floor (raised 14->30, g-115-1410); combined with capability_level==EXPLORE scoping. Age alone is not drift on a mature tree.
  concentration_threshold: 0.70 # Flag when this fraction of work is in one category
  max_signals_per_scan: 10      # Cap signals to prevent over-generation

# --- FRESH-EYES REVIEW (Periodic user-facing joint Self + portfolio review) ---
# Every N completed goals, the agent assembles a briefing and pushes it to
# the user via email with two meta-questions:
#   1. Is the current Self still right?
#   2. Are we working on the right problems?
#
# Deliberately goal-count cadence ONLY — no session/hour triggers. If the
# agent did nothing between firings, there is nothing new to review.
#
# Cadence is the SINGLE source of truth: goal-count threshold only.
# (skip_if_pending gate removed 2026-05-19 — rituals no longer file
# pending-questions, so the gate had nothing valid to read.)
# See .claude/skills/fresh-eyes-review/SKILL.md for the ritual; gated by
# core/scripts/fresh-eyes-cadence-check.sh.

fresh_eyes_review:
  goal_cadence: 25              # Every N completed goals — goal-count cadence only
  wm_slot: last_fresh_eyes_review
  report_glob: "fresh-eyes-[0-9]*.md"  # g-115-1308 auto-reconcile: glob for THIS
                                # ritual's archive reports under <agent>/temp/.
                                # The [0-9] excludes the program/tree siblings
                                # (fresh-eyes-program-*, fresh-eyes-tree-*) whose
                                # names have a letter after the dash. When a
                                # report newer than the slot stamp exists, the
                                # cadence-check re-stamps instead of re-firing
                                # (stamp lost to autocompact between Phase 4
                                # archive and Phase 8 record-tick).
  min_session_goals: 1          # g-115-1054: minimum goals_completed_this_session
                                # required before fire. World-goal completions tick
                                # every agent's cadence; per-agent Self briefing
                                # needs ≥1 session-scoped goal to have material to
                                # review. 0 disables the gate (legacy behavior).
  first_fire_offset: 5          # Stagger first-fire 5 goals out from now when
                                # this slot is null on a mature world ().
                                # Lowest cadence → smallest offset → fires first
                                # of the three sibling rituals after a fresh seed
                                # event (new agent dir / migration / slot wipe).
                                # See fresh-eyes-cadence-check.py seed-stagger
                                # branch for the implementation.

# --- FRESH-EYES PROGRAM (Periodic local shared-purpose self-audit) ---
# Sibling ritual to fresh_eyes_review. Targets world/program.md (The Program —
# the world's shared purpose) instead of <agent>/self.md. Examines:
#   1. Is The Program still the right shared purpose for this world?
#   2. Do both agents' Selfs still serve The Program (are we drifting)?
#
# Lower cadence than the per-agent Self review because shared purpose changes
# much less frequently than individual identity — ~100 goals is "every 2-3
# weeks at observed 50 goals/day pace" for each agent, and the first agent to
# hit cadence fires the review. Closes the "program.md has no systematic
# evolution path" gap called out in
# core/config/conventions/domain-hooks.md → Directional Context.

fresh_eyes_program:
  goal_cadence: 100             # Every N completed goals — lower than review's 25
  wm_slot: last_fresh_eyes_program_review
  report_glob: "fresh-eyes-program-*.md"  # g-115-1308 auto-reconcile (see review block)
  min_session_goals: 0          # g-115-1054: Program review is cross-agent/shared,
                                # not session-scoped — 0 = no session-goal gate
                                # (default). Any agent crossing cadence can fire.
  first_fire_offset: 30         # Stagger first-fire 30 goals out (g-270-02).
                                # Highest cadence → largest offset → fires LAST
                                # of the three sibling rituals after a fresh
                                # seed event. Spreads first-fires by ~10-15
                                # goals between siblings (5 / 15 / 30).
  team_aware: true              # g-115-1388: The Program is a SHARED resource with
                                # one time series. Any agent's fire stamps
                                # world/team-state.yaml shared_cadences.<wm_slot>
                                # (record-tick), and the cadence gate noops while
                                # current_world - stamp.world_goals_count_at_last_fire
                                # < goal_cadence. Counts are WORLD-ONLY (agent-queue
                                # counts differ per agent and are not comparable).
                                # Per-agent WM slot stays as the secondary gate.

# Sibling ritual to fresh_eyes_review and fresh_eyes_program. Targets the
# knowledge tree's top-level taxonomy — the L1 set. Periodic local self-audit;
# the user invokes l1-domain-add.sh / l1-domain-rename.sh manually if any
# taxonomy change is warranted after reading the briefing.
# Lower frequency than program (200 vs 100) because L1 changes are
# high-blast-radius and the skew + pick-rate evidence needs accumulation
# time. See `.claude/skills/fresh-eyes-tree/SKILL.md`.
fresh_eyes_tree:
  goal_cadence: 200             # Every N completed goals
  wm_slot: last_fresh_eyes_tree_review
  report_glob: "fresh-eyes-tree-*.md"  # g-115-1308 auto-reconcile (see review block)
  min_session_goals: 0          # g-115-1054: Tree taxonomy review is structural,
                                # not session-scoped — 0 = no session-goal gate
                                # (default). Any agent crossing cadence can fire.
  first_fire_offset: 50         # Stagger first-fire 50 goals out — well clear
                                # of review (+5), felt-sense (+15), program (+30).
  team_aware: true              # g-115-1388: the tree is a SHARED resource — see
                                # fresh_eyes_program.team_aware. Canonical incident:
                                # delta re-fired the 200-goal tree review 24h after
                                # the 2026-06-09 team review because per-agent WM
                                # slots never see team-wide fires.

# --- FELT-SENSE CHECK-IN (Periodic structured 7-lane self-audit) ---
# Every N completed goals, the agent runs a structured 7-lane sweep that
# converts the user's proven-high-yield diagnostic question into an
# autonomous routine. The seven lanes:
#   1. Memory hygiene (tree/reasoning-bank/guardrails/experience from recent mistakes)
#   2. Out-of-cycle completions (close work already done but still pending/in-progress)
#   3. Unblocks (flip blocked goals whose premise resolved back to pending)
#   4. Forward backlog (file new goals/aspirations surfaced by this diagnosis)
#   5. Framework tests (extend /verify-learning if recent changes warrant new checks)
#   6. Meta tuning (edit meta/* strategy files if cycle revealed drift)
#   7. Felt sense (where is the pain, what would I change — material findings route
#      through Self-update protocol per guard-380; cosmetic → journal only)
#
# Distinct from fresh-eyes-review (preemptive joint user+agent meta-Q&A) — this
# is an autonomous structured self-audit that writes directly. No user ping.
# Cadence is lower frequency (75 goals vs 25) because the seven lanes are
# expensive and Lane 7 needs room to feel earned rather than ritual.

felt_sense:
  goal_cadence: 75              # Every N completed goals — anchored by user 2026-04-22
  wm_slot: last_felt_sense_checkin
  min_session_goals: 3          # g-115-1054: lanes 1-6 require firing-agent's
                                # session-scoped data (sensory buffer, recent
                                # closes, in-flight signals). ≥3 ensures the
                                # 7-lane sweep has substantive material — hollow
                                # rituals with 0-1 session goals produce no-op
                                # output. 0 disables the gate.
  first_fire_offset: 15         # Stagger first-fire 15 goals out (g-270-02).
                                # Middle cadence → middle offset → fires SECOND
                                # of the three sibling rituals after a fresh
                                # seed event (after review @ +5, before program @ +30).

# --- L1 DISTRIBUTION SKEW CHECK (S1 — Phase 1 of tree taxonomy review) ---
# Periodic passive check: every N completed goals, compute per-L1 distribution
# (structural mass, retrieval volume, mature capability mass) and flag skews
# above `threshold`x via coordination-board post. Surfaces "L1 X has 10x the
# leaves of L1 Y — is the boundary right?" signals that no other trigger
# asks. Consumed by /fresh-eyes-tree (S5) when that ritual fires.
#
# NOT a user-facing ritual — no email, no pending-question. Quiet on balanced
# state. Designed to accumulate evidence the taxonomy review can act on.
# Implementation: core/scripts/l1-skew-check.py --cadence --post-board
l1_skew_check:
  goal_cadence: 50              # Every N completed goals — passive observability
  wm_slot: last_l1_skew_check
  threshold: 5.0                # Skew ratio that triggers a board post
  first_fire_offset: 20         # Stagger first-fire so it doesn't collide with
                                # fresh-eyes (+5) or felt-sense (+15) on a fresh
                                # seed event — 20 goals out lands distinctly.

# --- TREE-NODE CLUSTER ARCHIVAL (D2 — , design d2-cluster-archival-design.md) ---
# LLM-reviewed, cluster-aware archival of STALE LEAF tree nodes. A leaf >180d past
# its effective relevance is a candidate; its cluster (shared parent / source-asp /
# tag-Jaccard) is REFRESHED instead of archived when any member was retrieved within
# the lookback window (project-resurgence rule). Interior nodes are NEVER archived;
# default-to-keep under uncertainty. Engine: core/scripts/tree_archive.py; lane:
# reflect-maintain /reflect --curate-memory (tree-node-archival lane).
#
# NATURAL-GATED DORMANT (guard-348): archives_per_pass=0 means the autonomous lane
# scans + LLM-reviews + applies keep/refresh (non-destructive) but applies ZERO
# `archive` verdicts. Raise archives_per_pass above 0 to activate destructive
# archival. The cap-of-0 IS the gate — no `enabled:` boolean (rb-395 SSOT pattern).
tree_archival:
  archive_threshold_days: 180     # A leaf > this many days past effective relevance is a candidate
  refresh_lookback_days: 60       # Cluster member retrieved within this window → refresh whole cluster, skip archive
  tag_jaccard_floor: 0.5          # Signal C: tags Jaccard >= floor (NOT mere intersection — mega-cluster guard)
  max_cluster_size: 40            # Cluster blows past this → signal C too loose, fall back to A∪B
  archives_per_pass: 0            # NATURAL GATE — 0 = dormant (no autonomous archive verdicts applied)
  compounding_gate_enabled: false # D3 cross-link: gate eligibility on compounding_events==0 once that field ships

# --- GUARDRAIL RETIREMENT (D1, ) -- guardrail instantiation of the
# shared cluster-refresh pattern (D2 = tree_archival above). LLM-reviewed,
# cluster-aware retirement of stale guardrails. NATURAL-GATED DORMANT per
# guard-348: retires_per_pass=0 means scan+keep+refresh run but ZERO retire
# verdicts auto-apply. Engine: core/scripts/guardrail_retire.py +
# guardrail-retire.sh. Design: agents/bravo/temp/d1-cluster-retirement-design.md.
guardrail_retirement:
  retire_threshold_days: 180      # Guard > this many days past effective relevance is a candidate (user-set, conservative; > guard-707's 60d floor)
  refresh_lookback_days: 60       # Cluster member retrieved/fired within this window -> refresh whole cluster, skip retire
  tag_jaccard_floor: 0.5          # Signal C: tags Jaccard >= floor (NOT mere intersection -- mega-cluster guard)
  category_cohesion_floor: 40     # Signal A (category) is a STANDALONE edge only in categories smaller than this; large categories need B or C too
  max_cluster_size: 30            # Cluster blows past this -> signals too loose, fall back to B-only (source-incident, the tightest signal)
  retires_per_pass: 0             # NATURAL GATE -- 0 = dormant (no autonomous retire verdicts applied)
  allowlist: []                   # class-(b1) rare-but-critical + (b3) constitutional guard ids: NEVER auto-retire

# --- MAINTENANCE CADENCE (Protected time-based maintenance) ---
# Protects maintenance work (tree curation, evolution) from goal-execution budget
# competition. Patterned on strategic_scan.hours_cadence + last_strategic_scan WM slot.
# Fires as Phase 8.8 of the aspirations loop AFTER state-update, BEFORE evolution cadence.
#
# Rationale: /tree maintain had 7 call sites, all gated on goal-count or growth
# thresholds — none fire on time alone. Under context pressure, goals always won
# and tree debt accumulated across sessions (157 decompose + 85 distill candidates
# after 3 sessions in session 47). This adds a time-based safety net with a
# debt-floor override so backlog-triggered runs don't wait for the cadence clock.

maintenance_cadence:
  tree_maintain:
    hours_cadence: 8            # Fire /tree maintain every N hours of wall-clock agent-up time
    tight_zone_skip: false      # Tree maintain runs even in tight zone (too critical to defer)
    debt_floor: 50              # Force-fire when (decompose + distill) candidates exceed this count
  evolution:
    hours_cadence: 12           # Fire /aspirations-evolve every N hours regardless of goal count
    tight_zone_skip: true       # Skip in tight; normal+ only
  full_cycle_reflection:
    hours_cadence: 24           # Fire /reflect --full-cycle daily
    tight_zone_skip: true       # Skip in tight; normal+ only

# --- STEPPING-STONE RETRIEVAL (OMNI-EPIC-inspired: arXiv 2405.15568) ---
# When generating new aspirations, retrieve K most recently completed aspirations
# from the archive as creative stepping stones. Nearby successes are the best
# substrate for novel task generation. Partial archive visibility (showing only K,
# not everything) supports creativity — OMNI-EPIC's key design choice.

stepping_stones:
  default_limit: 5              # K — number of archived aspirations to retrieve
  source: archive               # Where to pull stepping stones from

# --- OPEN-ENDED PROGRESS (OMNI-EPIC-inspired: ANNECS metric) ---
# Tracks accumulated number of Novel, Interesting aspirations Created and Solved.
# "Novel" = passed interestingness filter. "Solved" = completed with learning artifacts.
# Used by evolution to detect stagnation in aspiration QUALITY, not just velocity.

open_ended_progress:
  metric: annecs                # Accumulated Novel Aspirations Created and Solved
  novelty_window: 10            # Compare against last N archived aspirations for novelty
  track_in: aspirations-meta.json

# --- RECURRING GOAL SCORING ---
# Controls how recurring goals are scored, penalized during saturation, and how
# non-recurring work gets boosted during debt recovery (agent comes online after gap).
# All values are read by goal-selector.py at scoring time.

recurring:
  urgency_base: 1.5              # Base score when a recurring goal becomes due
  urgency_log_scale: 1.5         # Multiplier for log2(1 + overdue_ratio)
  urgency_max: 4.0               # Cap on log-scaled urgency raw (g-115-1090, zeta-1477).
                                  # Without cap, heavily-overdue recurring goals
                                  # (overdue_ratio > 3 → raw > 4.5) systematically
                                  # out-score capped role_affinity (1.5 ceiling × 1.0
                                  # weight). 4.0 default bounds asymmetry while
                                  # preserving relative ordering up to ~3x overdue.
  saturation_window: 4            # Recent completions window for saturation check
  saturation_max_penalty: 4.0     # Max raw penalty when all recent are recurring
  debt_threshold: 0.80            # Candidate ratio triggering debt recovery bonus
  debt_bonus: 3.0                 # Score bonus for non-recurring goals during recovery
  streak_mult: 3.0                # Streak resets when elapsed > this * interval_hours.
                                  # Single source of truth for two readers
                                  # (, 2026-05-18):
                                  # - mind_api/src/endpoints/aspirations_write.py
                                  #   cmd_complete_by — fires the streak-break
                                  #   signal that produces an Investigate canary.
                                  # - core/scripts/streak-break-reflector.py
                                  #   _auto_resolve_recovered_canaries — defines
                                  #   the "recovered cadence" window for the
                                  #   forward-looking auto-resolve sweep.
                                  # Renamed from streak_reset_multiplier
                                  # ( / rb-335) — the prior name had a
                                  # loader in goal-selector.py but no consumer;
                                  # the rename consolidates with the literal
                                  # variable name (streak_mult) used at both
                                  # readers and in the zeta journals where the
                                  # constant's role was characterized.
                                  # 2026-06-24 (user directive): raised 2.0 -> 3.0 to give
                                  # recurring cadence more best-effort slack before flagging
                                  # drift. Helps BOTH readers in the same direction:
                                  # cmd_complete_by fires the streak-break signal later
                                  # (fewer FP canaries), and the reflector's recovered-cadence
                                  # auto-resolve window widens (more lingering canaries
                                  # self-close). Pairs with the existing anti-flood gates
                                  # 9 (filing-suppression) +  (auto-resolve).
  session_gap_threshold_hours: 2.0  # Auto-resolve threshold for streak-break canaries
                                    # that recover OUTSIDE the streak_mult window.
                                    # When a canary's source goal fires again later than
                                    # streak_mult * interval_hours after the canary was
                                    # filed (would normally stay open as "real drift"),
                                    # AND the agent's execution-diary shows a gap >= this
                                    # threshold between canary-filing and recovery, the
                                    # canary is reclassified as session-inactivity (the
                                    # agent wasn't running, so cadence-miss was structural,
                                    # not a bug) and auto-resolved with a session-gap note.
                                    # Closes the streak-break-burst ratchet that fires when
                                    # an agent returns after a multi-hour gap (bravo
                                    # 2026-05-20 catch-up cluster: 6 Investigates from 30h
                                    # session gap). Set very high (e.g., 999) to disable
                                    # the gap-escape path entirely and keep the original
                                    # streak_mult-only window.
                                    # Single source of truth: streak-break-reflector.py
                                    # _load_session_gap_threshold() is the sole reader.
  streak_break_contention_suppress: true  # (g-115-1643) Pass-1 selector-contention
                                    # suppression. When true (default), a streak-break for a
                                    # NON-HIGH recurring goal whose elapsed window had the
                                    # agent CONTINUOUSLY ACTIVE (no session gap) is suppressed
                                    # as benign selector contention, NOT filed as a canary.
                                    # Best-effort recurring cadence (rb-257) means a goal fires
                                    # only when the selector picks it over ~100 candidates, so
                                    # LOW/MEDIUM goals routinely exceed interval 2-80x in a
                                    # saturated queue (measured median 4.77x across 99 world
                                    # canaries, 98 of which closed transient/FP). HIGH goals
                                    # still file (cadence matters there; the selector's overdue
                                    # boost should have prevented the miss). Set false to
                                    # restore the pre-3 behavior (continuous-activity
                                    # non-HIGH breaks file). Single source of truth:
                                    # streak-break-reflector.py _load_contention_suppress()
                                    # is the sole reader.
  cargo_cult_threshold: 3         # consecutive routine outcomes before auto-filing Idea
                                  # (see rb-335: YAML duplicate-key collision fix 2026-04-20)
  # --- CARGO-CULT PLACEHOLDER SUPPRESSION (9) ---
  # Second-layer suppression of Phase 4.25 force_experience_archival sentinel
  # for forced-flip routine→deep closes that produce no substantive artifact.
  # First layer is  (empty encoding_queue + sensory_buffer); this
  # extends to cover sessions with non-empty buffers from unrelated earlier
  # work. The probe checks four artifact types in a tight time window:
  # tree node .md write, new goal filed, non-status board post, pipeline-
  # meta mtime change. ALL FOUR negative → suppress.
  # Fail-open at every layer: probe errors → sentinel fires as normal.
  # Read by core/scripts/recurring-close.sh Phase 4.25 enforcement block.
  cargo_cult_suppress_no_artifact: true   # gate this entire layer on/off
  cargo_cult_artifact_window_seconds: 90  # how far back the probe scans
  routine_streak_flip_threshold: 5  # In-session per-goal routine streak ceiling. When a
                                    # recurring goal closes routine N times in a row WITHIN
                                    # one session and N >= this threshold, signal-mutation
                                    # Block A flips outcome to deep (forcing the productive
                                    # counter + reflection paths). Independent of
                                    # cargo_cult_threshold, which is cross-session and
                                    # triggers interval calibration. Read by
                                    # core/scripts/recurring-loop-state-mutate.py — Magic
                                    # Wand #1 single-writer for loop_state during recurring
                                    # close (alpha session-60 reflection, 2026-05-07).
                                    # MOVED from strategic_pulse: block 2026-05-12 ();
                                    # the script always reads `recurring:` not `strategic_pulse:`.
  routine_streak_global_ceiling: 5  # Cross-goal session-wide routine streak ceiling. When
                                    # the agent closes routine N times in a row across ANY
                                    # mix of recurring goals within one session and N >=
                                    # this threshold, signal-mutation Block C forces the
                                    # next routine close to flip to deep AND resets the
                                    # counter to 0. Independent of the per-goal Block A
                                    # threshold (routine_streak_flip_threshold) — Block A
                                    # targets one goal repeating; Block C targets a broad
                                    # routine pattern across goals. Lowered from 8 → 5
                                    # 2026-05-12 per bravo session-66 feedback: "by 7
                                    # routines I'm already in pattern-mode." Read by
                                    # core/scripts/recurring-loop-state-mutate.py.

  # --- SUBSTANTIVE-AVAILABILITY DEMOTION (FW-1, 2026-05-25, 7-agent feedback) ---
  # Six of seven agents reported recurring sweeps perpetually out-ranking rare
  # substantive work (e.g. : 175 runs, 98.8% routine, score 13.87, still
  # #1). urgency_max / saturation / debt_bonus each address a piece, but a HEALTHY
  # MIX of candidates still lets one recurring goal top the list because it also
  # wins on priority / agent_executable / role_affinity. This caps any recurring
  # goal's effective score to `substantive_demotion_margin` BELOW the best
  # non-recurring, agent-executable candidate — UNLESS that recurring goal is
  # overdue beyond `substantive_demotion_overdue_exempt_ratio` (monitoring must
  # not rot). Applied post-scoring in goal-selector.apply_substantive_demotion,
  # AFTER the debt bonus so the substantive floor already reflects catch-up boosts.
  substantive_demotion_enabled: true        # master gate for the whole mechanism
  substantive_demotion_margin: 0.5          # demoted recurring lands this far below top substantive
  substantive_demotion_floor: 5.0           # only fires when a non-recurring agent-exec goal scores >= this
  substantive_demotion_overdue_exempt_ratio: 5.0  # recurring goals overdue beyond N× interval are exempt

  # --- AUTO-CONTRACT (LifingPolls plan item 4 — 2026-05-08) ---
  # Inverse of cargo-cult auto-extend. When a recurring goal consistently
  # produces deep outcomes (issues found on every fire), the cadence is too
  # loose — shrink it. Mirror semantics to the extend path:
  #
  #   threshold:  N consecutive deep closes before auto-contract fires
  #   divisor:    interval_hours / divisor on each contract
  #   floor:      never contract below floor_ratio × original_interval_hours
  #               (1/3 default, symmetric to extend cap_ratio of 3.0)
  #
  # Past the floor, fall through to the Idea path (parallel to extend cap):
  # human decides whether to rebase the original interval or accept the
  # natural cadence as a config-level edit.
  deep_streak_contract_threshold: 3
  deep_streak_contract_divisor: 1.5
  contract_floor_ratio: 0.33

# --- STRATEGIC PULSE (LifingPolls plan item 10 — 2026-05-08) ---
# Cadence and thresholds for /strategic-pulse autonomous surface.
# The skill itself is hybrid (user-invocable AND agent-callable);
# this block governs the autonomous cadence, not the user-pull path.
strategic_pulse:
  cadence_goals: 50            # auto-fire every N completed goals
  min_quiet_hours: 6           # don't re-fire within this window even if cadence met

# cargo_cult: block lives below (~line 687). rb-335: YAML duplicate-keys
# collide silently — keep exactly one block in this file.

# --- PER-GOAL RAPID-REPEAT SUPPRESSION (Tranche B 2026-04-20 — rb-390) ---
# Distinct from the recurring.saturation_* block above, which penalizes
# recurring goals dominating recent selections at the CLASS level (any
# recurring goal counts toward the ratio). This block suppresses the SAME
# goal_id firing multiple times within a small window — the concrete
# failure mode observed in the 2026-04-20 user session:  fired
# 4 times in 2 minutes before the cargo-cult detector caught it.
#
# Operates on `goals_completed_this_session` working-memory entries, which
# carry `goal_id` but no timestamp — so the window is COUNT-based
# (last N session completions), not wall-clock. A fire of goal X followed
# by 7 other goals and then X again will NOT trigger (the prior X fell
# out of the count window). A fire of X followed by 1 other goal and
# then X WILL trigger. Count-based is intentional: it measures "is this
# goal_id dominating recent work" rather than "was this goal recently
# done," which is what the user cares about.
#
per_goal_saturation:
  window_size: 8                  # look back at last N session completions
  consecutive_threshold: 1        # ≥N prior fires of this goal_id in window → suppress
  suppress_penalty: -5.0          # raw score penalty when threshold hit
                                  # Weight: meta/goal-selection-strategy.yaml → per_goal_saturation
                                  # (default 0.8; -5.0 * 0.8 = -4.0 weighted penalty)

# --- USER-SIGNAL BOOST (Tranche C — rb-390) ---
# Reweights goals based on fresh user-signal evidence collected by the
# signal-refresh hook (<agent>/session/user-signal-snapshot.yaml).
# Consumed by goal-selector.py criterion 7d (user_signal_boost).
#
# Snapshot shape:
#   sources.email.replies_last_24h / replies_last_72h  — active thread indicator
#   sources.pending_questions.silent_48h_goal_ids      — per-goal silence list
#   sources.board_directives.directives_last_24h       — active directive indicator
#
# Goals carry three optional fields populated by the scanner (see
# goal-schemas.md "Optional Outcome & User-Signal Fields"):
#   user_thread_id       — stable thread identifier
#   user_signal_kind     — reply / directive / silence_48h / override
#   user_signal_last     — ISO timestamp of most recent signal
#
# The natural gate for this criterion is snapshot existence — no separate
# `enabled` flag. Missing snapshot, missing fields, or all-zero counts →
# zero contribution to the scorer. No goal ever penalized for lacking
# signal metadata.
user_signal_boost:
  reply_boost: 2.5                  # user_signal_kind == "reply" — user answered on this thread
  directive_boost: 3.0              # user_signal_kind == "directive" — user explicitly requested
  silence_48h_boost: 1.5            # pending-question silent ≥48h — surface the ask
  override_penalty: -2.0            # user_signal_kind == "override" — user superseded this thread
  thread_active_boost: 1.0          # user_thread_id present AND recent replies/directives observed
                                    # Weight: meta/goal-selection-strategy.yaml → user_signal_boost
                                    # (default 1.2)

# --- WORK-CLASS BALANCE (Tranche C — rb-390) ---
# Pulls under-represented work_class values up when the last-N session
# completions distribution drifts from the configured targets. Addresses
# work-mix skew (framework maintenance accumulating gravity unopposed).
# Consumed by goal-selector.py criterion 7e (class_balance_bonus).
#
# The natural gate is `targets` non-empty — no separate `enabled` flag.
# Domains MUST supply their own `targets` map — empty targets = disabled.
# Missing work_class on a goal defaults to "unclassified" (excluded from
# both distribution and bonus). Session completions without work_class
# are excluded from the denominator.
class_balance:
  window_size: 20                   # look back at last N completions
  max_boost: 2.0                    # cap when work_class is severely under-represented
  max_penalty: -2.0                 # cap when work_class is severely over-represented
  targets:                          # {work_class: fraction} — domain supplies this.
    product: 0.40                   # end-user product value (domain-specific; see world/program.md)
    framework: 0.25                 # cognitive engine (skills, scripts, conventions)
    hygiene: 0.15                   # ops plumbing (infra, monitoring, data integrity)
    research: 0.20                  # investigation, landscape, analysis
                                    # Set 2026-04-21 via  (alpha session 55).
                                    # Taxonomy from core/config/work-class-mapping.yaml.
                                    # Agent-authored decision (participants:[agent,user]) —
                                    # override by editing these fractions if the user
                                    # wants a different portfolio steering target.
                                    # Weight: meta/goal-selection-strategy.yaml → class_balance_bonus
                                    # (default 0.8)

# --- SELF-DRIFT GATE (Tranche C.5 — rb-390) ---
# class_balance_bonus (scorer criterion 7e) nudges under-represented classes
# UP at selection time. When that nudge is insufficient — the class stays
# below a CRITICAL fraction of its target for multiple iterations — this
# gate escalates by filing an Unblock goal. Consumer:
# core/scripts/self-drift-gate.py, wired into aspirations-precheck.
#
# Natural gates (SSOT, rb-395): the gate is inactive whenever
# class_balance.targets is empty OR target_aspiration_id is empty. No
# redundant `enabled` flag — the values that already govern behavior
# ARE the on/off switch. Fail-open: missing config = no-op, not error.
#
# Fires per work_class independently; each fire is subject to a cooldown
# (so the same drift does not spawn goal after goal). Domain-agnostic —
# operates only on classes listed in class_balance.targets above.
self_drift_gate:
  window_size: 30                   # look back at last N completions
  critical_ratio: 0.50              # observed < (target × ratio) counts as "drifted"
  min_iterations_before_fire: 20    # gate stays silent until the agent has this much data
  cooldown_hours: 48                # suppress re-fire for the same class for this long
  target_aspiration_id: ""          # REQUIRED to activate: aspiration under which Unblock
                                    # goals get filed. Empty string = natural-gated, gate
                                    # silently no-ops (script comment L18: "empty
                                    # target_aspiration_id = natural gate"). Set 2026-04-21
                                    # via  to "asp-244" (portfolio-steering
                                    # aspiration itself), but asp-244 reached status=completed
                                    # 2026-04-21→2026-05-03 — the gate's lookup at
                                    # self-drift-gate.py L241 requires status=="active",
                                    # so post-completion every fire returned "Aspiration
                                    # asp-244 not found" (5+ errors logged in
                                    # bravo/session/self-drift-log.jsonl from 2026-05-03
                                    # onwards).  disabled rather than repointed
                                    # because no currently-active aspiration is a clean
                                    # semantic fit for cross-class drift Unblocks (work_class
                                    # families span product/research/framework/hygiene; pinning
                                    # to a single aspiration mis-routes the others). Re-enable
                                    # by setting an aspiration id when a portfolio-steering
                                    # aspiration is reactivated or a new one is created.

# --- CROSS-AGENT HANDOFF SCORING (Item 3) ---
# Goals tagged `handoff_to: <agent-name>` get scoring bonus on the named agent's
# selector. Prevents cross-agent handoffs from rotting in the world queue.
# See goal-selector.py criterion 13c (handoff_bonus). Schema: goal-schemas.md.
#
# Sender-side take-back penalty (handoff_sender_penalty) applies when the goal
# is tagged for a DIFFERENT agent. It decays only while the routed partner is
# silent (agent_status.<partner>.last_active in world/team-state.yaml is older
# than partner_active_threshold_min). This moves the decision from a magic
# constant drifting on the clock to a signal derivable from observed partner
# liveness. FAIL-OPEN on missing inputs: if team-state is missing/corrupt or
# either last_active or handoff_created_at is absent, the penalty is 0 — the
# feature disengages rather than fake-protecting. No fallback branch, single
# source of truth (observed partner state).
scoring:
  handoff_bonus: 0.30             # added to score when goal.handoff_to == current agent
  handoff_sender_penalty: -2.5    # applied when goal.handoff_to names ANOTHER agent

handoff_aging:
  warn_hours: 48                     # aged handoffs get an escalating scoring bonus from here
  escalate_hours: 72                 # aspirations-precheck posts to board + notifies at this age
  sender_decay_hours: 4              # partner-silence window for full penalty decay (sender side)
  partner_active_threshold_min: 30   # if partner last_active within this, penalty stays full

# --- CRITICAL-BLOCKER SURFACE (, bravo US-07) ---
# Boost candidates that ARE a high-downstream-unlock bottleneck recorded in
# world/team-state.yaml critical_blockers[] (written by aspirations-consolidate
# Step 8.87 as the top-3 bottlenecks, purged by team-state-sync-blockers.py once
# resolved). Those entries are typically "ready-unclaimed" EXECUTABLE goals that
# other work out-ranks indefinitely -- surfacing them lets "break one, unlock
# five" fire. Consumed by goal-selector.py load_critical_blocker_surface_config()
# + the critical_blocker_surface score_goal criterion; the WEIGHT lives in
# meta/goal-selection-strategy.yaml weights.critical_blocker_surface (strict
# SSOT -- not here). enabled is opt-in (default False in the loader); set true
# here to activate.
critical_blocker_surface:
  enabled: true            # master switch for the selector criterion
  min_downstream: 3        # ignore bottleneck entries below this downstream_count
  downstream_cap: 10       # normalize boost -- downstream_count >= cap scores 1.0

# --- UTILITY-SHAPED GOAL SCORER (BRD Gap 8, ) ---
# Flag-gated SECOND scoring path in goal-selector.py::score_goal(). The additive
# scorer stays the live default; set use_iaus: true ONLY after the sibling A/B
# () demonstrates parity-or-improvement on the replay fixture.
# Design: core/config/iaus-selector-design.md. Reversible by a single flag flip.
# Utility scoring = multiply + veto-by-zero: a zero in the VETO tier (agent_executable)
# zeros the whole score, so a goal with no capability cannot rank via high
# completion_pressure the way additive scoring lets it.
iaus_selector:
  use_iaus: false        # default OFF -- additive scorer remains the default (R1 hot-path mitigation)
  primary_floor: 0.1     # b-floor on PRIMARY axes so a legit-zero axis (e.g. recurring_urgency
                         #   for a non-recurring goal) does NOT act as an unintended veto;
                         #   only the VETO tier (b=0) zeros the score.
  watermark: 0.0         # prune candidates whose post-veto base < watermark; 0.0 = no pruning
  bonus_scale: 4.0       # divisor mapping the tier-3 weighted-sum into a bounded (0.5x-1.5x) multiplier

# --- GO-EXPLORE CELL-RETURN BOOST (BRD Gap 17 child C, ) ---
# Flag-gated, boost-only selection adjustment in goal-selector.py::apply_cell_return_boost().
# Mirrors the  PPR blend (retrieve.py): DEFAULT OFF -> apply_cell_return_boost is a
# byte-identical no-op (selection unchanged by construction, no regression). When ON, it seeds
# Personalized PageRank from the top-N highest-value archived Go-Explore cells (the cells worth
# RETURNING to), then adds a bounded, boost-only graph-proximity bonus to each candidate goal by
# the SUM of PPR mass over the candidate's record-id entities (HippoRAG passage score, 2405.14831;
# reuses the  cell store +  cell-similarity matcher + the /43 KG+PPR
# substrate). Deterministic: the matcher's score is a deterministic function of (candidate, archive,
# graph). Turn on ONLY after a sibling A/B validates parity-or-improvement (mirrors  for
# ). Reversible by a single flag flip; no schema change, no data migration.
cell_return:
  enabled: false         # default OFF -- byte-identical no-op when off (no-regression by construction)
  seed_top_n: 5          # number of top-by-score archived cells to seed PPR from (the cells to "return" toward)
  bonus_scale: 3.0       # multiplier mapping a candidate's summed PPR mass into the additive bonus range
  bonus_max: 1.5         # additive bonus cap (mirrors retrieve.py ppr_weight_max upper bound)
  enrich_signature: false # g-306-51: when true, inject cat:<category> + tag: pseudo-node entities into each candidate signature so same-category high-value cells boost same-category candidates (a bare goal-id footprint is often graph-distant). Default OFF until an A/B (cell-return-ab-harness --enrich-signature) proves the enriched signal helps.

# --- PRODUCTIVITY SELF-STOP GATE (Item 2) ---
# Composite productivity score computed at end of each iteration (via
# iteration-close.sh → productivity-stop-gate.sh). If the agent is padding the
# session with routine/ritual work rather than producing encoded learning,
# gracefully self-stop so the user gets a clean hand-off instead of stale tokens.
# Score formula (see core/scripts/productivity-stop-gate.sh):
#   score = (1 - routine_ratio) * 0.4 + encoding_ratio * 0.3 + deep_ratio * 0.3
# Trigger: goals_completed >= min_iterations AND score < stop_threshold
#          AND no stop-requested signal already pending.
productivity_gate:
  min_iterations: 10              # session must have ≥N completed goals before gate arms
  stop_threshold: 0.25            # score strictly below this triggers self-stop
  # Trigger notification is board post (type=self-stop) + journal append —
  # both unconditional in productivity-stop-gate.sh. No notify_user toggle:
  # notify-user is an LLM-invoked skill, not shell-callable, so a config key
  # here would lie about what the script can do.
  #
  # --- Per-artifact weights for encoding_ratio (Fix D — 2026-04-22) ---
  # The gate scores a session by summing COUNTS × WEIGHTS across all artifact
  # kinds produced since session_start, then dividing by goals_completed.
  # Weights encode the framework's value hierarchy:
  #   tree_writes 1.0 — highest-durability encoding (collective knowledge)
  #   guards      0.9 — active cross-session safety rules
  #   rb          0.8 — reasoning-bank lessons learned
  #   patsigs     0.8 — pattern signatures that match across future goals
  #   hyp_created 0.6 — prediction formed (calibration input)
  #   hyp_resolved 0.6 — prediction resolved (calibration output)
  #   experience  0.3 — raw interaction trace (1-per-goal baseline credit)
  #
  # EXCLUDED from the counter by design (do NOT add without re-reading this
  # block — silent double-counting risk):
  #   spark questions — already captured downstream via the rb/tree/guard
  #     entries they spawn. Counting sparks AND the resulting rb would
  #     double-credit the same learning event.
  #   journal entries — 1+ per goal baseline, not a learning signal.
  #   skill forges — rare high-value events stored in a YAML file without
  #     per-entry timestamps that map cleanly to session_start. Would be
  #     worth adding if the schema gains created_at; currently the
  #     downstream guardrail/rb entries from a forge already count.
  #   beliefs — schema supports per-entry last_updated but file is typically
  #     empty for active agents. Zero signal; skip rather than no-op count.
  #
  # Bravo session-56 calibration (1 tree_writes + 1 rb + 2 hyp_resolved +
  # ~4 experience across 8 goals, routine~0.10, deep~0.70):
  #   weighted = 1*1.0 + 1*0.8 + 2*0.6 + 4*0.3 = 4.2
  #   ratio = min(1.0, 4.2 / 8) = 0.525
  #   score = 0.9*0.4 + 0.525*0.3 + 0.70*0.3 = 0.36 + 0.16 + 0.21 = 0.73
  #   (well above 0.25 floor — bravo would have continued)
  #
  # Adversarial-padding calibration (0 artifacts + 10 experience, 10 goals,
  # routine=0.9, deep=0.1): weighted=3.0, ratio=0.30, score=0.16 → STOPS.
  # Experience baseline buffers good sessions but doesn't save padded ones.
  artifact_weights:
    tree_writes: 1.0              # highest-quality durable encoding
    guards: 0.9                   # active safety rules, cross-session
    rb: 0.8                       # reasoning bank entries (lessons)
    patsigs: 0.8                  # pattern signatures (cross-goal match)
    hyp_created: 0.6              # predictions formed (calibration input)
    hyp_resolved: 0.6             # predictions resolved (calibration output)
    experience: 0.3               # raw traces — baseline credit, per-goal
    forges: 1.0                   # new skills forged — cross-session durable, high value (g-251-09)
    structural_progress: 1.0      # tree maintain ops actioned + work_class=framework goals (Lane D Magic Wand #1, 2026-05-08). Weight 1.0 matches tree_writes/forges — structural reorganization is durable cross-session work even though it doesn't create new files. The previous 8 axes measured WRITTEN artifacts; this axis measures DONE structural work. See session_artifacts_count.count_structural_progress().
  #
  # --- Cool-down ladder (Fix E — 2026-04-22) ---
  # A single sub-threshold score should not fire stop-requested immediately.
  # The gate runs at the end of every iteration — one bad iteration between
  # artifact landings (e.g. a recurring-goal streak before the next tree
  # write) is a normal within-session fluctuation, not a session-ending
  # signal. The ladder introduces trend detection: the gate writes
  # `blocked_sleep_until` (reuses Phase -0.5e's existing sleep-wake
  # machinery) and increments `productivity_cooldown_streak` in WM. Stop
  # only fires after the streak saturates the ladder — the agent has been
  # consistently sub-threshold across N cool-down windows AND the breaks
  # did not produce recovery.
  #
  # Mirror of the B7 backoff ladder in aspirations-all-blocked SKILL.md,
  # with longer steps because productivity cooldown is a higher-level
  # trend signal than "selector returned empty once". 1800/3600/7200 =
  # 30m/1h/2h — three chances to recover before hard stop.
  #
  # Reset: any iteration where score >= stop_threshold resets the streak
  # to 0. A single recovering iteration is enough — the gate doesn't need
  # hysteresis beyond the ladder itself (which already is the hysteresis).
  #
  # The sentinel is `blocked_sleep_until` (reused, not a new WM slot).
  # Reuse is safe because B7 and productivity-gate never fire in the same
  # iteration — B7 runs at selector-empty, productivity runs at
  # iteration-close after a completed goal. The post-wake light-precheck
  # in Phase -0.5e finds no blockers and falls through cleanly.
  cooldown_ladder:
    ladder_seconds: [1800, 3600, 7200]  # 30m, 1h, 2h — stop fires on 4th sub-threshold read
    # WM slot name is hardcoded in productivity-stop-gate.sh (COOLDOWN_SLOT)
    # and must match the session_signals initializer in
    # .claude/skills/aspirations/SKILL.md Phase -0.5 — not tunable via config.

# --- QUIESCENCE GATE ---
# Script-gated "confidently idle" state. When the queue is HONESTLY
# user-gated (every blocked goal has a structured blocker_ref with an
# observable external_id and future expires_at), the loop earns the right
# to sleep longer than the default B7 backoff — without running B3/B4/B5
# work-generation every iteration and without forcing idle_fallback fabrication.
#
# Prevents the lazy-escape risk: the LLM does NOT decide quiescence; the queue
# structurally IS quiet (as computed by quiescence-gate.py against structured
# blocker_refs). Narrative defers without blocker_ref are rejected by
# aspirations.py at write-time, so the gate cannot be gamed by writing
# defer_reason="awaiting user feedback" on every goal.
#
# First wake-miss emits an Investigate goal; three consecutive misses
# auto-disable quiescence for the session.
quiescence_gate:
  hysteresis_iters: 2             # same blocker-set hash required across N iters
  budget_pct: 0.40                # max fraction of session wall-clock in quiescence
  sleep_seconds_min: 1800         # 30 min floor when quiescence approved
  sleep_seconds_max: 3600         # 60 min cap (wake signals can break sooner)
  wake_miss_cooldown: 3           # N consecutive wake-misses → auto-disable session
  log_file: quiescence-log.jsonl  # relative to <agent>/session/ — decision trail
  audit_file: quiescence-audit.jsonl  # relative to <agent>/session/ — wake-miss record

  # ---  (bravo, 2026-06-25) — prolonged-quiescence escalating user-ping ---
  # When the SAME blocker-set hash has persisted >= prolonged_quiescence_hours of
  # wall-clock (tracked via signals.quiescence.hash_first_seen_at) AND every
  # blocked goal is gated by a user-only blocker_ref type (user_action,
  # credentials-required, security-trust, physical-hardware), the gate emits
  # prolonged_quiescence + should_notify so the orchestrator fires ONE focused
  # /notify-user naming the single highest-leverage blocker. Throttled per
  # blocker-set hash via <agent>/session/prolonged-quiescence-pinged.json so a
  # long user-bound window produces AT MOST one ping per throttle period — the
  # anti-email-flood requirement that motivated the goal.
  prolonged_quiescence_hours: 4   # wall-clock under one hash before a ping is warranted
  prolonged_throttle_hours: 12    # min hours between pings for the SAME blocker-set hash

  # --- Magic Wand #3 (alpha session-60, 2026-05-07) — fragmentation downgrade ---
  # When quiescence approves a sleep but external signals (board posts, claim
  # releases, partner activity) break it early, the agent burns precheck tokens
  # waking up only to re-quiesce. MW#2 (wake-signal class split) demotes
  # informational signals during quiescent sleep, but blocker-class signals can
  # still legitimately fragment a sleep — and over time, repeated fragmentation
  # means the 1800s approval is wishful thinking.
  #
  # MW#3 tracks actual_sleep_s in a rolling window (signals.quiescence.actual_sleep_history,
  # last fragmentation_window entries). When the AVG of that window falls below
  # fragmentation_threshold_s, the gate downgrades the next approval's
  # sleep_seconds to fragmented_sleep_seconds (an "ack-and-yield" pattern):
  # acknowledge the queue is user-gated, yield briefly, but don't pretend a
  # 30-minute sleep is achievable when bursty signal makes the agent surface
  # within minutes anyway.
  fragmentation_threshold_s: 600    # avg actual_sleep_s below this → fragmented
  fragmentation_window: 5            # how many recent sleeps to average
  fragmentation_min_samples: 3       # need this many samples before decision
  fragmented_sleep_seconds: 600      # downgraded sleep duration (10 min)
  fragmented_history_max: 10         # cap on the rolling history length

  # --- Magic Wand 2 (bravo session-61, 2026-05-07) — newly-arrived-work ---
  # The blocker-hash drift check at verify-wake catches changes in STRUCTURAL
  # state (a blocker resolved, expired, or got rehashed). It does NOT catch
  # "did better work arrive while I was asleep" — a goal created during sleep
  # that is not blocked, not deferred, and not time-gated would otherwise be
  # invisible to verify-wake until the next iteration's selector runs.
  #
  # MW#2 captures total goal count in active_snapshot at quiescence-entry,
  # then at wake-verify compares the count and re-runs the selector if the
  # delta exceeds min_delta. If the selector returns >= min_executable
  # candidates, drift is flagged via "__new_work_arrived__" — the
  # orchestrator's existing miss-handling path (file Investigate, increment
  # misses) breaks the quiescence cycle. Two-tier on purpose: cheap count
  # delta gates the expensive selector run.
  newly_arrived_work:
    enabled: true
    min_delta: 2          # require >= N new goals before running selector
    min_executable: 2     # require selector to return >= N candidates to flag

# --- BATCH CALIBRATION SWEEP (Change 3) ---
# When a single recurring goal hits cargo_cult_threshold, redirect to a
# batch sweep instead of filing a per-goal Idea. The sweep evaluates EVERY
# recurring goal in one pass (world + agent queues) and emits ONE ranked
# Idea — collapses symptom-chasing into a single calibration. Dedupe gates
# re-filing when a recent batch Idea is still outstanding.
#
# Set batch_audit_dedupe_hours: 0 to disable the batch mode entirely and
# fall back to the legacy per-goal Idea path. See
# core/scripts/cargo-cult-detector.py --audit-all.
cargo_cult:
  multiplier: 1.5                 # per-goal auto-extend: new_interval = current * this
  cap_ratio: 3.0                  # per-goal auto-extend: max ratio new/original before Idea fallback
  batch_audit_dedupe_hours: 24    # caller-side (recurring-close.sh) suppress: filters pending/in-progress only
  # Self-side temporal dedup (): cargo-cult-detector.py audit_all() suppresses
  # emission when ANY batch goal (regardless of status — completed/skipped/expired included)
  # was created within this window. Defense-in-depth against the caller-side gap that let
  # three duplicate batches land in 4 iterations during bravo session 58 (,
  # , ). Set 0 to disable; default 72h spans typical recurring-cycle period.
  audit_all_batch_dedup_hours: 72
  # Chronic-low lifetime-hit-rate detection (). The consecutive_routine
  # trigger above misses a goal that is chronically-but-INTERMITTENTLY low-signal
  # (e.g. 4% lifetime substantive yet never 3 routine in a row). --audit-all flags
  # a goal "chronic" when it has accumulated >= chronic_min_runs TRACKED closes
  # (substantive_runs, counted from field-introduction so pre-tracking achievedCount
  # history never poisons the rate) AND its lifetime substantive rate
  # (substantive_hits / substantive_runs) is below chronic_hit_rate_threshold.
  # chronic_score_weight boosts such a goal's audit-all rank so it surfaces even
  # when its consecutive_routine streak is short. substantive_hits counts GENUINE
  # deeps only (forced-flips are anti-drift, not real signal -- mirrors consecutive_deep).
  chronic_hit_rate_threshold: 0.15
  chronic_min_runs: 8
  chronic_score_weight: 2.0

# --- RECURRING-GOAL CARGO-CULT DETECTION ---
# Per the plan improve-recurring-goals-kind-yao.md (2026-04-19):
# A recurring goal that returns outcome=routine N consecutive times is
# probably running on a wrong-fit interval, wrong skill, or has nothing
# left to do. After N hits, recurring-close.sh fires cargo-cult-detector.py
# to auto-file an Idea goal proposing to extend the interval, change the
# skill, or retire the recurring goal entirely.
#
# Counter lives on the goal record as `consecutive_routine` (cross-session
# — distinct from loop_state.routine_streaks which resets each session).
# recurring-close.sh increments on routine, resets on deep, and resets again
# after auto-filing the Idea (so the detector does not re-fire while the
# Idea sits in the queue). `cargo_cult_threshold` now lives in the primary
# `recurring:` block above (merged 2026-04-20 — was a duplicate-key bug that
# silently wiped urgency_base / saturation_window / debt_bonus / etc.).

# --- MULTI-AGENT COORDINATION (Distributed Systems Theory) ---
# Informed by "Language Model Teams as Distributed Systems" (Mieczkowski et al., 2026).
# LLM teams are structurally distributed systems — governed by the same scalability laws,
# consistency requirements, and coordination overhead tradeoffs.

multi_agent:
  # Claim expiry: stale claims from crashed/abandoned sessions are auto-released.
  # Without expiry, a claimed goal persists forever if the claiming agent's session ends
  # without releasing. This implements straggler mitigation (Finding 5 of the paper).
  claim_timeout_hours: 4            # Claims older than this are treated as expired
  abstention_timeout_hours: 72      # Abstentions older than this expire (fail-open: re-attempt)
