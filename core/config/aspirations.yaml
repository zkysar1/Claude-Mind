# --- RUNNER HEARTBEAT (crashed-session liveness) ---
# The runner stamps <agent>/session/runner-heartbeat mtime on every aspirations
# iteration (Phase -0.5). Observer /stop and /start RUNNING+autonomous check
# this mtime via core/scripts/heartbeat-stale.sh to detect crashed runners.
# Missing file counts as stale (fail-open on crashed-runner edge case).
# No hardcoded default in scripts — a missing block here fails loud so misconfig
# is visible instead of silently using a magic number (rb-313: script-authoritative
# decisions beat LLM narration; same principle applies to config-authoritative).
runner_heartbeat:
  # Observer /stop and /start RUNNING+autonomous treat the runner as crashed when
  # runner-heartbeat mtime is older than this many minutes. Set generously — long
  # goals (research, consolidation, /run-processor) legitimately take 20+ minutes.
  # Bumped 30->60 on 2026-05-14 after bravo recovered mid-deep-close at iter 36
  # (). Deep-close LLM work (precision extraction, multi-tree-node
  # edits, encoding) regularly runs 30-45 min between iteration-close.sh phase
  # invocations with no diary writes -- both heartbeat AND diary-stale signals
  # triggered. 60 min absorbed that without per-tool-call heartbeat
  # instrumentation — UNTIL  (2026-08-28): the tick now ALSO fires
  # before every Bash tool call from the PreToolUse hook (bash-agent-inject.py,
  # rate-limited to one per _shared_tick.SHARED_HEARTBEAT_INTERVAL_S), so a
  # runner's freshness no longer depends on its iteration length. A served 27B
  # whose precheck alone ran 1h53m read as crashed under the old cadence. 60
  # stays as the genuine-dead-runner bound (a dead process stops ticking within
  # one interval). Trade-off: genuine zombie recovery takes ~2x longer.
  # Tunable; raise further if 60 still false-positives.
  # CROSS-MACHINE TWIN (2026-07-07, bravo dual-runner incident): the DDB
  # runner-lease staleness (owncloud_backend.DEFAULT_RUNNER_STALE_SECONDS,
  # 3900s = 65 min; env override OWNERSHIP_STALE_SECONDS) MUST stay ABOVE
  # this value — a peer machine must never stale-break a claim the owner's
  # own machine still considers fresh. If you raise stale_minutes, raise the
  # DDB default too. Guarded by test_ownership_cutover.py::
  # test_config_invariant_ddb_stale_exceeds_local_heartbeat_stale.
  stale_minutes: 60
  # Wedged-loop detection threshold (recovery-gate Path D, ;  fix).
  # A phase_start left UNCLOSED (phase entered, never exited) longer than this is
  # a WEDGE: the loop keeps the heartbeat FRESH while diary writes stall behind a
  # wedged _fileops lock (2026-07-04 own-cloud fleet-wedge,  #4/#5).
  # INVARIANT (): wedge_stale_minutes MUST be > runner_heartbeat.stale_minutes
  # (60). WHY, AS ORIGINALLY CALIBRATED: a HEALTHY non-phase-4 phase's local
  # runner-heartbeat aged WITH its phase_start (both stamped near Phase -0.5 and
  # nothing re-ticked mid-phase), so a healthy phase_start past wedge_stale had a
  # STALE heartbeat and Path D's heartbeat-FRESH gate suppressed FIRST; only a
  # genuine wedge (heartbeat re-ticked while the diary froze) reached the check.
  # At 45 (< 60) a long precheck / state-update false-recovered a HEALTHY agent
  # -- the  defect, found by fresh-eyes-code self-review of .
  # 65 = 60 + 5min margin closed that window.
  # SINCE  (2026-08-28) THAT COUPLING NO LONGER HOLDS: the heartbeat
  # re-ticks at tool-call cadence from the PreToolUse[Bash] hook, so a healthy
  # phase that runs past wedge_stale WITHOUT a diary write now presents the
  # wedge signature. What still separates it from a wedge: phase-4-execute's 4h
  # execute-in-flight suppressor, the runner-age gate (), the diary
  # liveness veto (any diary write inside the window) and the assistant-turn
  # veto () -- which reads a CLAUDE CODE transcript and therefore
  # cannot fire under another runner platform. A deployment whose non-phase-4
  # phases legitimately exceed 65min (served small models) MUST raise this via
  # meta/config-overrides; the > stale_minutes invariant still applies.
  # Raising the threshold is monotonically safe: it can only REDUCE Path D firings.
  # phase-4-execute is separately protected by the execute-in-flight suppressor
  # (4h) shared with Paths A/C. Env override: WEDGE_STALE_MINUTES. Guarded by
  # test_phase_wedge_check.py::test_config_invariant_wedge_exceeds_heartbeat_stale.
  wedge_stale_minutes: 65
  # Assistant-turn liveness window for recovery-gate Path D ().
  # Path D is SUPPRESSED when the bound agent's runner session emitted an
  # assistant turn within this many minutes, read from the Claude Code session
  # transcript (assistant-turn-freshness.py). This is the ONLY Path-D
  # discriminator not derived from the execution diary, and that is the whole
  # point: a live user conversation emits ZERO diary writes BY CONSTRUCTION
  # (the diary records loop phases, not conversational turns), so "wedged" and
  # "alive-but-off-loop" are IDENTICAL in diary+heartbeat space. Three prior
  # narrowings (, , ) were each diary-derived and each
  # was followed by another false firing -- 5 across 4 agents, a FLOOR.
  # INVARIANT: assistant_turn_fresh_minutes < wedge_stale_minutes (65). WHY: this
  # probe is only reached once a phase_start has been unclosed longer than
  # wedge_stale. If the window were >= that, an assistant turn from the very START
  # of the wedge window -- plausibly the turn that WEDGED -- could suppress the
  # recovery of its own wedge. Strictly below guarantees a suppressing turn
  # post-dates the oldest part of the wedge window. Guarded by
  # test_assistant_turn_freshness.py::test_config_invariant_fresh_below_wedge_stale.
  # 60 reuses runner_heartbeat.stale_minutes rather than introducing a fourth
  # independent constant: a conversation an hour silent is not distinguishable
  # from an absent one. Env override: ASSISTANT_TURN_FRESH_MINUTES.
  # DIRECTION (guard-3802): the predicate is point-freshness against a FIXED
  # threshold, so P(suppress) DECREASES as a wedge lengthens -- it is not the
  # window-length-is-the-severity-metric shape that silences the worst cases.
  assistant_turn_fresh_minutes: 60
  # Watchdog STALLED-detection threshold (agent-watchdog.py StalledProbe, ).
  # The watchdog reports STALLED (not OK) when the runner-heartbeat is FRESH (loop
  # alive + re-ticking every iteration) but the execution-diary.jsonl mtime is
  # stale beyond THIS many minutes (no goal-execution progress). That conjunction
  # is root cause #5 of the 2026-07-04 own-cloud fleet-wedge (): own-cloud
  # write deadlock froze goal execution for DAYS while the loop kept ticking the
  # heartbeat, and the watchdog reported OK because HeartbeatProbe only fires on a
  # STALE heartbeat — a fresh heartbeat masks the wedge.
  # INVARIANT (same shape as wedge_stale_minutes > stale_minutes): this MUST be >
  # runner_heartbeat.stale_minutes (60). WHY: deep-close LLM work legitimately
  # freezes the diary AND ages the heartbeat TOGETHER for 30-45 min (see the
  # stale_minutes comment above). If this threshold were <= stale_minutes, a diary
  # stale past it would imply a heartbeat also stale -> classify_stalled's
  # fresh-heartbeat gate fails first -> the STALLED verdict is INERT. Only a
  # genuine wedge (heartbeat re-ticked FRESH while the diary stays frozen far
  # longer) presents fresh-heartbeat WITH diary-stale > this threshold. 180 = 3x
  # the 60-min heartbeat window, well above the 45-min deep-close gap; distinct
  # from wedge_stale (65, unclosed-phase detection) because a TOTAL diary freeze
  # is a longer/rarer condition than a single unclosed phase and this probe is
  # observability (a log event), not recovery. Env override:
  # STALLED_DIARY_STALE_MINUTES. Guarded by
  # test_agent_watchdog_stalled.py::test_config_invariant_diary_stale_exceeds_heartbeat_stale.
  stalled_diary_stale_minutes: 180
  # Reducer self-fencing stand-down threshold (). T_stepdown: after
  # THIS many seconds of CONTINUOUS DDB claim-renewal failure, a reducer stops
  # acting as reducer voluntarily, so the lease has a defined step-down window
  # instead of an infinite one.
  # INVARIANT (the whole point of the goal): stepdown_seconds MUST be <
  # owncloud_backend.DEFAULT_RUNNER_STALE_SECONDS (T_takeover, 3900s; env
  # override OWNERSHIP_STALE_SECONDS). Classic lease correctness — the holder
  # must step down BEFORE a peer may legally take over, or the two windows
  # overlap and both boxes act as reducer (split-brain). This is the OPPOSITE
  # direction from every other invariant in this block (which require the
  # cross-machine value to EXCEED the local one), because this threshold governs
  # when the OWNER yields, not when a PEER may seize. Before 2026-08-05
  # T_stepdown was effectively INFINITY: cc-04 lost its claim at 14:38 and kept
  # executing as reducer for 2.5+ hours while two other bodies acquired it, and
  # split-brain was avoided by luck, not by the mechanism.
  # 1950 = 3900/2, deliberately EQUAL to the escalation threshold heartbeat-tick.sh
  # already uses (`_HB_STALE / 2`, ) so the loud stderr warning and the
  # stand-down fire at the same moment rather than at two thresholds a reader has
  # to reconcile. Guarded by
  # test_reducer_self_fence.py::test_config_invariant_stepdown_precedes_takeover.
  # NOTE the gap this does NOT close: a SAME-BOX reducer restart keeps the same
  # machine_id, so the different-holder read cannot see it (same measured limit
  # worker_reducer_liveness.py states for its takeover proxy).
  #
  # 2026-08-17 () — the SIGNAL now exists but THIS consumer does not
  # read it yet, and the distinction matters: do not read the line above as
  # "still blocked on the endpoint". `runner-claim.sh status` — the exact command
  # reducer_self_fence.check() already runs — now carries `token-fp <digest>` on
  # its LIVE line, and worker_reducer_liveness consumes it as a second takeover
  # axis. reducer_self_fence.parse_machine() still reads only the machine id, so
  # the same-box restart remains invisible HERE. Wiring it is deliberately NOT
  # done as part of that goal: this module sets `stop-requested` on a HEALTHY
  # loop, so every added trigger is weighed against guard-1562, and its
  # conservative "every other signal HOLDS" posture is load-bearing rather than
  # incidental (.claude/rules/stop-hook-compliance.md).
  #
  # And do NOT close it by exposing the raw token, which is what the previous
  # wording invited. `runner_token` is the ConditionExpression bearer credential
  # for heartbeat() and release_runner(): publishing it lets any reader forge a
  # heartbeat (defeating reclaim_if_stale) or release a live claim. The digest is
  # the publishable form — see owncloud_backend.runner_token_fingerprint.
  stepdown_seconds: 1950

# --- Reducer self-promotion () — DEFAULT OFF, and it must stay off ---
# Relaxes worker-loop Phase 0.5's NEVER-PROMOTE invariant behind six gates.
# Decision logic: core/scripts/reducer_promotion.py (pure `decide`).
# Spec + kill-test bar + RETIREMENT CRITERION:
#   core/config/conventions/reducer-promotion.md
#
# SAFETY ARGUMENT IN ONE LINE: promotion waits for T_takeover (3900s), and
# stepdown_seconds (1950s) above is strictly below it, so by the time a worker
# may promote the old holder has had a full step-down window to yield. That
# ordering is the whole proof — do NOT raise stepdown_seconds toward 3900
# without re-deriving this.
#
# WHY enabled STAYS false today: the fence's T_stepdown is proven by CODE and by
# unit tests, but not yet by kill-tests ON THIS FLEET. `fence_verified_at` is the
# second, independent gate for exactly that reason — flipping `enabled` alone
# cannot promote anything, so neither flag is a single point of failure.
reducer_promotion:
  # G1 master kill switch. Only an explicit `true` enables; absent means off.
  enabled: false
  # G2 ISO timestamp, written ONLY after the three kill-tests in the convention
  # have been run and recorded on this fleet. Absent => every input HOLDs.
  # This is the dependency lock (rb-4452): the invariant is fixed in reviewable
  # form BEFORE the dependency exists, so it constrains the kill-test lane's
  # design instead of being retrofitted onto it.
  fence_verified_at: null
  # G3 EXACT machine ids that may hold the reducer claim. Exact string equality,
  # never a glob or prefix (guard-2860): the cardinality of what this admits must
  # be a property of THIS LIST, reviewable here, not of what a pattern happens to
  # match later on some box's disk. Laptop / on-demand / WSL boxes stay OFF the
  # list deliberately — a box that sleeps is a box whose claim goes stale.
  # Empty list = nothing is eligible, which is the correct default.
  eligible_machines: []

# --- Recovery gate (script-gated crashed-runner auto-recovery) ---
# core/scripts/recovery-gate.sh fires from the SessionStart hook when ALL FOUR
# conditions hold: state=RUNNING + heartbeat stale + stop-requested NOT set +
# `background-jobs.sh has-pending` exits 1 (no Tier-A registered job).
# When all four pass, the gate calls session-manifest-clear.sh (same script
# /start --recover Phase 0.7 calls), transitions state to IDLE, writes
# <agent>/session/recovery-notice for /prime to surface, and appends to
# recovery-log.jsonl.
#
# Plan called for a 5th condition (PID liveness via runner-alive.sh) but it
# was removed: the LLM has no honest way to write a stable runner PID
# ($PPID from LLM-bash resolves to init/1 — the launcher decouples). A
# layer that systematically mis-reports DEAD would auto-recover healthy
# sessions whenever heartbeat staled (long subagent calls). Heartbeat is
# the canonical liveness signal; we trust it.
#
# This is the SECOND authorized caller of session-state-set.sh outside /start
# and /stop (productivity-stop-gate is the first). LLM remains locked out —
# only the SessionStart hook may invoke recovery-gate.sh. See:
#   .claude/rules/stop-hook-compliance.md  (exception block)
#   .claude/rules/user-interaction.md      (Script-Level Restrictions)
#
# Long-running Processor jobs (3-7h) suppress the gate via
# background-jobs.sh has-pending (single source of truth — NOT via inflating
# stale_minutes above). Manual /start --recover provides the explicit entry
# when the auto-gate's 4 conditions don't match.

# --- Stale background-process scanner ---
# The scanner is a WORLD script (`world/scripts/stale-jobs-scan.py`) — it
# identifies registered background jobs past their lifetime and unregistered
# OS-level orphans matching known signatures. Kills are logged to
# core/logs/stale-scanner-kills.jsonl.
#
# Process-type thresholds were the framework-specific (Processor, roblox-bridge,
# llama-server, ssh-efs) and lived here as a leak. Moved 2026-05-18 (packaging
# plan Phase 2.7) to `world/config/stale-scanner.yaml`. The world script reads
# its own thresholds from there with internal hardcoded fallbacks — core no
# longer ships the domain process names. A fresh deployment without a stale
# scanner inherits the world script's defaults or skips the scanner entirely.

# ------------------------------------------------------------------
# Git-drift + host-capacity detection ( — agent-watchdog GitDriftProbe)
# ------------------------------------------------------------------
# Nothing monitored per-box git divergence or host disk until 2026-08-14. Both
# holes were found the same way — an operator asked a question. Measured
# 2026-08-13: cc-07 forked at 342 ahead since 2026-08-08; cc-08 accumulated 223
# main-bound commits in 3 days; cc-03 sat DORMANT 163 behind with no heal path
# (0 ahead, 0 dirty, so nothing ever fired). Companion: zakbox1 reached 90% of
# 905G with 450G of policy-retained .history payload, equally invisible.
#
# The probe reads these thresholds; it does NOT carry its own copies (guard-308
# — a probe's default MUST reference the source of truth, never restate it).
# Every value has an env override for a one-off run without editing config.
git_drift:
  # Local commits not on origin/main. A reducer pushes every iteration, so a
  # standing `ahead` means the shared branch is not being fed from this box.
  # 25 ~= a long single session's worth of iteration commits: high enough that
  # ordinary in-flight work never trips it, low enough to catch a fork the day
  # it starts rather than at 342. Env: GIT_DRIFT_AHEAD.
  ahead_threshold: 25
  # Commits on origin/main this box has not merged. Deliberately LOOSER than
  # ahead: being behind is normal between pulls and self-heals at the next
  # launch, whereas being ahead needs a human or a push. 50 catches the cc-03
  # dormant-box class (163 behind, no loop, no heal) without firing on a box
  # that simply has not pulled for an hour. Env: GIT_DRIFT_BEHIND.
  behind_threshold: 50
  # Commits on a LIVE Body's refs/workers/<agent>/<sid> carrier that are not
  # reachable from origin/main. worker-ref-consume.sh is report-only with no
  # scheduled caller ( owns the cadence), so durable-on-ref work can
  # sit unlanded indefinitely — measured 58-318 across 6 refs on cc-02.
  # ONLY live Bodies count: a CLOSED body's ref is frozen history by design and
  # counting it is the false positive the first draft of  fell into.
  # Env: GIT_DRIFT_UNCONSUMED.
  unconsumed_threshold: 100
  # Host filesystem holding PROJECT_ROOT, as df reports Use% — used/(used+free),
  # which EXCLUDES root-reserved blocks and is therefore the number a human sees
  # and the more conservative of the two. (used/total is ~4 points lower on a
  # default ext4; on cc-02 2026-08-14 that is 92% vs 88%.) 80 leaves room to act
  # before writes start failing. Env: GIT_DRIFT_DISK_PCT.
  disk_used_pct_threshold: 80
  # ...AND fewer than this many GiB actually free. BOTH must hold before disk
  # counts as a breach. A bare percentage is scale-blind: on 2026-08-22 a
  # 905 GiB volume sitting at 81% used -- 169 GiB free, completely healthy --
  # filed five HIGH Investigate goals in one hour across four containers. Every
  # one was correctly ignored, which is the damage: the probe was training its
  # readers to ignore it, and it was doing so during an hour when the same box
  # really was failing (of memory, which nothing was watching). Requiring an
  # absolute floor too keeps the genuine small-volume case (a 40 GiB root at
  # 97% is 1.2 GiB free and fires) while dropping the large-volume noise.
  # Env: GIT_DRIFT_DISK_FREE_GIB.
  disk_free_floor_gib: 15
  # `git fetch` is the only network I/O in the watchdog tick, and the tick runs
  # every iteration. Fetch at most this often; between fetches the counts come
  # from the last-known remote ref and the payload carries stale_basis=true so a
  # reader never mistakes a cached count for a fresh one. Env:
  # GIT_DRIFT_FETCH_THROTTLE_MIN.
  fetch_throttle_minutes: 30
  # Consecutive breaching ticks before an Investigate goal is filed. 2 (not 1)
  # because a fetch that races a partner's push can read one transient spike.
  # Env: GIT_DRIFT_TICKS_TO_FILE.
  ticks_to_file: 2
  # Re-validation cadence for the probe's `fired` latch. `fired` is written only
  # in the CLEARED branch, so while a breach PERSISTS it never takes the negative
  # (guard-4870: a store written ONLY inside its own fire condition is a latch).
  # Once fired, if the covering goal is closed -- or never landed -- while the
  # breach continues, the box is breached + un-goaled + UN-REFILEABLE, because
  # `not self.fired` short-circuits before the filer's own dedup can run. A
  # latched detector has silently STOPPED DETECTING, and the fleet reads the
  # quiet as health -- strictly worse than no detector, under the standing
  # detection-outranks-attribution directive.
  # 50 matches MirrorWedgeProbe.WEDGED_TICKS_TO_REVALIDATE so the twin probes
  # re-file on ONE cadence rather than two that drift apart. Set 0 to disable
  # re-validation and restore the pre-fix fire-once behaviour.
  # Env: GIT_DRIFT_TICKS_TO_REVALIDATE.
  ticks_to_revalidate: 50

# ------------------------------------------------------------------
# Infra-health failing-streak alerting ( — asp-249)
# ------------------------------------------------------------------
# When infra-health.py records repeated probe failures for the same component,
# the counter increments silently. Without a surfacing signal, recurring infra
# probe goals happily report "completed" while their target service is down —
# exactly the failure mode asp-249 exists to prevent (: an infra
# probe rotted for weeks). The streak-alert subcommand reads this config and routes
# components exceeding threshold to a surfaced notification.
#
# failing_streak_threshold: min consecutive_failures before alert fires (default 3).
# window_hours: only alert if last_failure is within this recency window — keeps
#   historically-broken components from spamming after they're known-blocked.
infra_health:
  failing_streak_threshold: 3
  window_hours: 6
  # : `infra-health.sh status` annotates each component stale=true when
  # its most-recent recorded result (max of last_success/last_failure) is older
  # than this many hours, so a stored value is not misread as the CURRENT state
  # (the 2026-05-25 false roblox-down-10-days alarm; structuralizes guard-647).
  # Advisory annotation only — never changes probe/streak/blocker behavior.
  # Fail-open default 6.0 if unset.
  status_staleness_hours: 6
  # : when a component crosses failing_streak_threshold, sync a
  # known_blocker entry into per-agent WM so goal-selector's blocker gate
  # (aspirations-precheck Phase 0.5b) can suppress dependent goals. Without
  # this map, cmd_failing_streak fires alerts but only via JSON output /
  # log file — never reaching the selector. Lookup is by component name;
  # missing entries route to empty list (blocker filed without
  # affected_categories, harmless to selector). Maintain alongside
  # world/scripts/probe-*.sh additions.
  #
  # The component_categories map was deployment-specific (named the host
  # deployment's probe components inline) and moved 2026-05-18
  # (packaging plan Phase 2.7) to `world/config/infra-health-categories.yaml`.
  # infra-health.py reads from the world overlay; core ships an empty
  # component_categories dict here as schema documentation. A fresh deployment
  # without an infra-health overlay gets an empty map (alerts fire but never
  # reach the selector — same as the legacy "missing entry" path).
  component_categories: {}

# ------------------------------------------------------------------
# Experience-archival compliance gate (rb-428 — asp-248 follow-up)
# ------------------------------------------------------------------
# Phase 4.25 Experience Archival is LLM-orchestrated (payload needs
# retrieval_audit, verbatim_anchors, content_path — cognitive fields bash
# cannot compose). When staleness is detected, experience-staleness-check.sh
# writes the force_experience_archival WM sentinel; aspirations-precheck
# Phase 0-pre2 reads the sentinel and blocks goal selection until the LLM
# composes the missed experience record retroactively (pattern mirrors
# force_tree_maintain / Phase 0-pre at precheck:57-75).
experience_archival_gate:
  staleness_hours: 12              # mirrors EXPERIENCE_STALENESS_HOURS default

# ------------------------------------------------------------------
# Health-regression detection & tiered revert (health-ledger subsystem)
# ------------------------------------------------------------------
# Single source of truth for the per-agent self-health ledger. Full spec:
# core/config/conventions/health-ledger.md. Design provenance: workflow
# wf_b82a26e9-958 (2026-06-03). The subsystem ships DORMANT — see `mode` and
# `calibration` below; no revert authority activates until the calibration
# AND-gate is satisfied AND `mode` is advanced past detect-only.
health_regression:
  # Master mode switch. Advance deliberately, one phase at a time:
  #   collect-only      — append ledger records; no detection, no reverts (Phase 1)
  #   detect-and-report — + detection sweep files Investigate goals; no reverts (Phase 2)
  #   full              — + tiered revert pipeline active (Phase 3, post-calibration)
  #  (2026-07-06): advanced collect-only -> detect-and-report (agent-judgable
  # low-risk step; calibration AND-gate satisfied 2026-07-06, alpha composite 0.7497
  # trend +0.0026 healthy). 2026-07-14: advanced detect-and-report -> full with explicit
  # in-session user authorization ("I am granting you permission to revert") — the
  # user-paced step per health-ledger.md §10. Calibration marker at crossing:
  # days=30 records=475. Tiered revert pipeline now active (Ring 3 auto-revert
  # gated by revert.confidence_gate below; Ring 1.5/2 route to Unblock goals).
  mode: full

  # --- Composite weights (health-ledger §4). Reused signals from
  # world/productivity-snapshots.jsonl — NOT recomputed. Renormalized over
  # available signals when one drops. ---
  weights:
    composite_productivity: 0.40   # productivity-snapshots `score`
    encoding_ratio: 0.25           # breakdown.encoding_ratio
    deep_ratio: 0.20               # breakdown.deep_ratio
    tree_writes: 0.15              # breakdown.counts.tree_writes (normalized by cap)
  tree_writes_cap: 8               # tree_writes normalized as min(raw/cap, 1.0)
  min_signals: 2                   # below this, composite=null (excluded from trend)
  warmup_records: 2                # first N non-null records per session are warmup-excluded

  # --- Baseline (reuses meta/audit-baselines.yaml ratchet under key health_composite) ---
  baseline_tolerance: 0.10         # below_baseline = composite < baseline * (1 - tolerance)

  # --- Detection gate (health-ledger §8; Phase 2). ALL three + the counter must hold. ---
  detection:
    interval: 10                   # sweep cadence (every N completed goals), medium-tier deferrable
    slope_threshold: -0.02         # composite_trend must be below this (negative slope)
    floor: 0.40                    # composite must be below this absolute floor
    consecutive_below_baseline: 3  # require N consecutive below_baseline records before tripping

  # --- Calibration AND-gate (health-ledger §10). BOTH must hold before `full` mode reverts. ---
  calibration:
    min_days: 30                   # ≥ N days of records, AND
    min_records: 50                # ≥ N records (AND, not OR — prevents ~1-day activation)

  # --- Revert pipeline (Phase 3) ---
  revert:
    confidence_gate: 0.70          # Ring 3 auto-revert requires attribution_score ≥ this (else demote to Ring 2)
    verification_iterations: 5     # post-revert: keep if composite improves ≥ improve_delta within N iterations
    improve_delta: 0.05            # min composite improvement to confirm a revert helped
    dead_end_expiry_days: 30       # (file,signal) revert dead-ends expire after N days
    chain_depth_cap: 1             # bidirectional dead-end cap — prevents revert↔undo oscillation

  # --- Signal→file correlation map (health-ledger §9.3; consumed by
  # health-attribution.py). When a signal degrades, files matching its globs
  # are the most plausible causes. correlation_weight: 1.0 direct (the file
  # governs the signal's machinery) / 0.5 indirect / 0.3 unknown (default for
  # any changed file matching no rule). Agent-evolvable — start lean and let
  # the map accrete from confirmed attributions (OD-4 re-seed cadence). All
  # globs are framework-internal paths (domain-free). attribution_score =
  # temporal_proximity × correlation_weight × recency_decay. ---
  signal_file_correlation:
    default_weight: 0.3            # unknown — any changed file matching no rule below
    rules:
      - signal: encoding_ratio    # how much the agent encodes per goal
        weight: 1.0
        globs:
          - "core/config/memory-pipeline.yaml"
          - ".claude/skills/aspirations-state-update/**"
          - ".claude/skills/aspirations-consolidate/**"
          - ".claude/skills/aspirations-learning-gate/**"
          - "meta/encoding-strategy.yaml"
      - signal: deep_ratio        # deep vs routine work mix
        weight: 1.0
        globs:
          - "meta/goal-selection-strategy.yaml"
          - "core/scripts/goal-selector.py"
          - ".claude/skills/aspirations-execute/**"
      - signal: tree_writes       # knowledge-tree write volume
        weight: 1.0
        globs:
          - ".claude/skills/tree/**"
          - "core/config/knowledge-conventions.md"
          - "core/config/conventions/tree-retrieval.md"
      - signal: composite_productivity  # the master score — broad, so indirect
        weight: 0.5
        globs:
          - "core/config/aspirations.yaml"
          - "core/scripts/productivity-stop-gate.sh"
          - "meta/reflection-strategy.yaml"

# --- History-store vacuum cadence (-b; design -a in
# world/knowledge/tree/system/history-store-gc-cadence.md). The CAS-delta
# .history store's GC (_history_store.vacuum) had NO caller; orphaned
# blobs/patches accumulated (measured 8.1G = 98% of WORLD_PATH). This block
# drives history-vacuum-tick.sh (24h time-gate + per-box lock + backgrounded)
# from the iteration-close productivity-check maintenance sink. Archive-before-
# delete (archive-before-delete.md / rb-2859): orphan payloads COPY to a
# lifecycle-exempt REMOTE graveyard + are verified (count+bytes+content-hash
# key) before any local unlink; archive/verify failure ABORTS without deleting.
history_vacuum:
  enabled: true
  interval_hours: 24
  # Local fast-access retention for the CAS payload. Because retention-dropped
  # payloads are graveyard-archived first (Decision 3), "dropped" means
  # local-only — the payload stays restorable from the graveyard indefinitely,
  # so a short LOCAL window is safe on the 98%-full disk. null disables
  # retention-drop (orphan-sweep only).
  # 30 -> 7 (2026-08-13, operator-directed): zakbox1 hit 90% of 905G and the
  # measured cause was THIS window working as configured — cc-04 alone held
  # 105G of blobs, 32,284 of 32,326 younger than 30d (~1,600 blobs/~3.5G per
  # day churn), so 4 resident mirrors ≈ 450G of policy-retained payload. A
  # 7-day window keeps a week of instant local restores and caps the fleet
  # steady-state near ~100G; everything older is a graveyard fetch away.
  # First tick after this lands drains ~3-4 weeks of cohort per box
  # (archive-verify-then-delete, backgrounded, per-box lock — fail-safe).
  metadata_only_after_days: 7
  # apply=true (): the tick now ARCHIVES orphans to the remote
  # graveyard, VERIFIES, then deletes locally (archive/verify failure => abort,
  # NO delete — fail-safe). Flipped ONLY after four independent proofs the
  # pipeline is safe: (1) 11/11 test_history_vacuum_archive.py (run()
  # orchestration + ordering + every abort path, LocalDirArchiver); (2) direct
  # real-S3 put+GET+md5-match against zds-own-cloud-data (stronger than the
  # S3Archiver head-size check); (3) full real-S3 end-to-end via the PRODUCTION
  # code path (synthetic orphan: reachable-survives + archived + deleted +
  # restored+content-verified, and the cloud SDK's default credential chain
  # authenticates in the tick env — no latent abort-trap); (4) lifecycle-safety
  # verified (see
  # graveyard_bucket note above). CAS orphan count was 0 at flip time
  # (-c), so no immediate deletion — the guard fires on the first
  # retention-drop orphans (~metadata_only_after_days). To revert: set false.
  apply: true
  # drain_legacy_dirs=false (): gates the SEPARATE legacy-per-file-dir
  # drain pass (run_legacy_drain). The CAS vacuum (apply above) covers ONLY the
  # content-addressed store (.history/{snapshots,blobs,patches}); the frozen
  # pre-2026-07-16 legacy per-file dirs (aspirations.jsonl/, knowledge/, board/,
  # reasoning-bank.jsonl/, ...) are a SEPARATE store with no manifest/blob/patch
  # model. Landing INERT (false): even with apply=true the legacy pass NEVER runs
  # until this flag is deliberately flipped — safe-by-construction (a buggy
  # enumeration cannot delete anything while off). Flip to true ONLY after (1) a
  # dry-run enumeration review — `python3 core/scripts/history_vacuum_archive.py
  # --base-dir <WORLD|META> --drain-legacy --dry-run` — confirms exactly which
  # top-level entries + file count would drain, and (2) a positive control
  # (archive+delete+restore-verify a copy), exactly as apply=true was flipped
  # (-c). Archives PATH-PRESERVING copies (legacy/<rel_path> gkey) to
  # the retention-immune graveyard before delete. To revert: set false.
  drain_legacy_dirs: false
  # s3 = production (REMOTE graveyard; Decision 3 forbids a local archive on the
  # near-full disk). local = test/dev only.
  archiver: s3
  # graveyard_bucket: this env's OWN own-cloud data bucket (per
  # core/config/environments/ayoai-mind.yaml -> bucket: zds-own-cloud-data).
  # It is NOT "lodestar-data" — that bucket never existed (-c
  # HeadBucket 404 + full `aws s3 ls`); the topology is per-env buckets
  # (claude-mind-own-cloud-data, zds-own-cloud-data, vinheim-data), not a
  # shared "lodestar-data". The graveyard rides a lifecycle-SAFE prefix in this
  # bucket: the only lifecycle rule that could expire data is
  # NoncurrentVersionExpiration(14d; was 90d until 2026-07-31), which touches ONLY overwritten
  # (noncurrent) versions — graveyard objects are write-once with unique
  # date/run-id keys, so they stay CURRENT forever and no clock touches them
  # (there is no current-version Expiration rule). Verified .
  graveyard_bucket: zds-own-cloud-data
  graveyard_prefix: ayoai-mind/graveyard/history
  # A vacuum lock dir older than this is presumed dead (backgrounded run
  # crashed before rmdir) and reclaimed, so GC is never wedged forever.
  stale_lock_reclaim_hours: 2

# Aspirations hot-store eviction cadence (2026-08-14, operator-directed S3
# cost-down; threshold approved verbatim "go 3"). The evictor
# (aspirations-evict-completed.py) is metric-neutral (census) and merge-safe
# (evicted_ids tombstones, ) — but it had NO call site and its 45d default
# delivered 0.02% of the measured saving (). First hand-run
# 2026-08-14T12:54 (cc-04): world 36.6MB -> 16.6MB, 54% smaller, 4,809 goals;
# the store was 54.4 GB/day of whole-object PUT churn () and regrows
# ~2.9MB/day without a cadence. Daily per-box tick via
# aspirations-evict-tick.sh at iteration-close (the history_vacuum sibling
# pattern); multi-box overlap harmless — eviction is idempotent and the merge
# layer drops stale-replica resurrections at the tombstone set.
#
# THERE IS NO RECORD-LEVEL RECOVERY. This block and evict-tick.sh both claimed
# "recoverable (.history 7d + lifecycle-exempt graveyard)" until 2026-08-18; both
# halves were false and the clause is removed above. The evictor contains ZERO
# graveyard code (`grep -c graveyard` = 0, no s3/put_object anywhere in it) — the
# graveyard belongs to history_vacuum_archive.py, a DIFFERENT tool over a
# DIFFERENT set, which is the adjacent-backup trap archive-before-delete.md names
# as rb-6344. And ".history recovery" is verbatim the sentence the evictor's own
# header retracts as "infeasible in practice" (measured 2026-08-11; it had already
# sent one investigation hunting a store that cannot answer the question). Both
# false claims were written into these two files three days AFTER that retraction.
# Measured 2026-08-18 (alpha, cc-04): 6,069 evicted-id tombstones, of which 34
# (0.56%) resolve to a record in aspirations-archive.jsonl. Per
# archive-before-delete.md step 2 an unverifiable recovery layer is treated as
# ABSENT; here it is measurably absent. Eviction is a ONE-WAY drop of goal
# records, and that is BY DESIGN (the evictor's "a goal id is ephemeral by
# design") — the defect was only ever the two comments promising otherwise.
#
# age_days 3 CUTS INSIDE THE COMPLETION-REPORT LOOKBACK, and nobody re-derived the
# margin when the operator approved "go 3". The evictor's rationale justifies its
# 45d default as "well beyond completion-report lookback (~7d) ... so no
# record-consumer loses signal it actually uses". That derivation does not survive
# 3d: agent-completion-report SKILL.md step 2 filters goal RECORDS on
# `completed_at >= since`, so any report window wider than ~3 days silently
# under-reports completed goals. Measured the same day: terminal non-recurring
# goals in the live store bucket 194/447/113/54 at ages 0/1/2/3d and then hit
# EXACTLY ZERO from day 4 out — while the positive control (non-terminal goals,
# which eviction never touches) runs a smooth tail to 99d. The cliff is eviction,
# not a quiet fleet. Tracked by ; do NOT change age_days here to "fix"
# it — 3 is an operator decision ("go 3") and the tradeoff is the operator's.
aspirations_eviction:
  enabled: true
