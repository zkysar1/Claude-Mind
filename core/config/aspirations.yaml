# --- RUNNER HEARTBEAT (crashed-session liveness) ---
# The runner stamps <agent>/session/runner-heartbeat mtime on every aspirations
# iteration (Phase -0.5). Observer /stop and /start RUNNING+autonomous check
# this mtime via core/scripts/heartbeat-stale.sh to detect crashed runners.
# Missing file counts as stale (fail-open on crashed-runner edge case).
# No hardcoded default in scripts — a missing block here fails loud so misconfig
# is visible instead of silently using a magic number (rb-313: script-authoritative
# decisions beat LLM narration; same principle applies to config-authoritative).
runner_heartbeat:
  # Observer /stop and /start RUNNING+autonomous treat the runner as crashed when
  # runner-heartbeat mtime is older than this many minutes. Set generously — long
  # goals (research, consolidation, /run-processor) legitimately take 20+ minutes.
  # Bumped 30->60 on 2026-05-14 after bravo recovered mid-deep-close at iter 36
  # (). Deep-close LLM work (precision extraction, multi-tree-node
  # edits, encoding) regularly runs 30-45 min between iteration-close.sh phase
  # invocations with no diary writes -- both heartbeat AND diary-stale signals
  # triggered. 60 min absorbs that without forcing per-tool-call heartbeat
  # instrumentation. Trade-off: genuine zombie recovery takes ~2x longer.
  # Tunable; raise further if 60 still false-positives.
  stale_minutes: 60

# --- Recovery gate (script-gated crashed-runner auto-recovery) ---
# core/scripts/recovery-gate.sh fires from the SessionStart hook when ALL FOUR
# conditions hold: state=RUNNING + heartbeat stale + stop-requested NOT set +
# `background-jobs.sh has-pending` exits 1 (no Tier-A registered job).
# When all four pass, the gate calls session-manifest-clear.sh (same script
# /start --recover Phase 0.7 calls), transitions state to IDLE, writes
# <agent>/session/recovery-notice for /prime to surface, and appends to
# recovery-log.jsonl.
#
# Plan called for a 5th condition (PID liveness via runner-alive.sh) but it
# was removed: the LLM has no honest way to write a stable runner PID
# ($PPID from LLM-bash resolves to init/1 — the launcher decouples). A
# layer that systematically mis-reports DEAD would auto-recover healthy
# sessions whenever heartbeat staled (long subagent calls). Heartbeat is
# the canonical liveness signal; we trust it.
#
# This is the SECOND authorized caller of session-state-set.sh outside /start
# and /stop (productivity-stop-gate is the first). LLM remains locked out —
# only the SessionStart hook may invoke recovery-gate.sh. See:
#   .claude/rules/stop-hook-compliance.md  (exception block)
#   .claude/rules/user-interaction.md      (Script-Level Restrictions)
#
# Long-running Processor jobs (3-7h) suppress the gate via
# background-jobs.sh has-pending (single source of truth — NOT via inflating
# stale_minutes above). Manual /start --recover provides the explicit entry
# when the auto-gate's 4 conditions don't match.

# --- Stale background-process scanner ---
# The scanner is a WORLD script (`world/scripts/stale-jobs-scan.py`) — it
# identifies registered background jobs past their lifetime and unregistered
# OS-level orphans matching known signatures. Kills are logged to
# core/logs/stale-scanner-kills.jsonl.
#
# Process-type thresholds were the framework-specific (Processor, roblox-bridge,
# llama-server, ssh-efs) and lived here as a leak. Moved 2026-05-18 (packaging
# plan Phase 2.7) to `world/config/stale-scanner.yaml`. The world script reads
# its own thresholds from there with internal hardcoded fallbacks — core no
# longer ships the domain process names. A fresh deployment without a stale
# scanner inherits the world script's defaults or skips the scanner entirely.

# ------------------------------------------------------------------
# Infra-health failing-streak alerting ( — asp-249)
# ------------------------------------------------------------------
# When infra-health.py records repeated probe failures for the same component,
# the counter increments silently. Without a surfacing signal, recurring infra
# probe goals happily report "completed" while their target service is down —
# exactly the failure mode asp-249 exists to prevent (: an infra
# probe rotted for weeks). The streak-alert subcommand reads this config and routes
# components exceeding threshold to a surfaced notification.
#
# failing_streak_threshold: min consecutive_failures before alert fires (default 3).
# window_hours: only alert if last_failure is within this recency window — keeps
#   historically-broken components from spamming after they're known-blocked.
infra_health:
  failing_streak_threshold: 3
  window_hours: 6
  # : `infra-health.sh status` annotates each component stale=true when
  # its most-recent recorded result (max of last_success/last_failure) is older
  # than this many hours, so a stored value is not misread as the CURRENT state
  # (the 2026-05-25 false roblox-down-10-days alarm; structuralizes guard-647).
  # Advisory annotation only — never changes probe/streak/blocker behavior.
  # Fail-open default 6.0 if unset.
  status_staleness_hours: 6
  # : when a component crosses failing_streak_threshold, sync a
  # known_blocker entry into per-agent WM so goal-selector's blocker gate
  # (aspirations-precheck Phase 0.5b) can suppress dependent goals. Without
  # this map, cmd_failing_streak fires alerts but only via JSON output /
  # log file — never reaching the selector. Lookup is by component name;
  # missing entries route to empty list (blocker filed without
  # affected_categories, harmless to selector). Maintain alongside
  # world/scripts/probe-*.sh additions.
  #
  # The component_categories map was deployment-specific (named the host
  # deployment's probe components inline) and moved 2026-05-18
  # (packaging plan Phase 2.7) to `world/config/infra-health-categories.yaml`.
  # infra-health.py reads from the world overlay; core ships an empty
  # component_categories dict here as schema documentation. A fresh deployment
  # without an infra-health overlay gets an empty map (alerts fire but never
  # reach the selector — same as the legacy "missing entry" path).
  component_categories: {}

# ------------------------------------------------------------------
# Experience-archival compliance gate (rb-428 — asp-248 follow-up)
# ------------------------------------------------------------------
# Phase 4.25 Experience Archival is LLM-orchestrated (payload needs
# retrieval_audit, verbatim_anchors, content_path — cognitive fields bash
# cannot compose). When staleness is detected, experience-staleness-check.sh
# writes the force_experience_archival WM sentinel; aspirations-precheck
# Phase 0-pre2 reads the sentinel and blocks goal selection until the LLM
# composes the missed experience record retroactively (pattern mirrors
# force_tree_maintain / Phase 0-pre at precheck:57-75).
experience_archival_gate:
  staleness_hours: 12              # mirrors EXPERIENCE_STALENESS_HOURS default

# ------------------------------------------------------------------
# Health-regression detection & tiered revert (health-ledger subsystem)
# ------------------------------------------------------------------
# Single source of truth for the per-agent self-health ledger. Full spec:
# core/config/conventions/health-ledger.md. Design provenance: workflow
# wf_b82a26e9-958 (2026-06-03). The subsystem ships DORMANT — see `mode` and
# `calibration` below; no revert authority activates until the calibration
# AND-gate is satisfied AND `mode` is advanced past detect-only.
health_regression:
  # Master mode switch. Advance deliberately, one phase at a time:
  #   collect-only      — append ledger records; no detection, no reverts (Phase 1)
  #   detect-and-report — + detection sweep files Investigate goals; no reverts (Phase 2)
  #   full              — + tiered revert pipeline active (Phase 3, post-calibration)
  mode: collect-only

  # --- Composite weights (health-ledger §4). Reused signals from
  # world/productivity-snapshots.jsonl — NOT recomputed. Renormalized over
  # available signals when one drops. ---
  weights:
    composite_productivity: 0.40   # productivity-snapshots `score`
    encoding_ratio: 0.25           # breakdown.encoding_ratio
    deep_ratio: 0.20               # breakdown.deep_ratio
    tree_writes: 0.15              # breakdown.counts.tree_writes (normalized by cap)
  tree_writes_cap: 8               # tree_writes normalized as min(raw/cap, 1.0)
  min_signals: 2                   # below this, composite=null (excluded from trend)
  warmup_records: 2                # first N non-null records per session are warmup-excluded

  # --- Baseline (reuses meta/audit-baselines.yaml ratchet under key health_composite) ---
  baseline_tolerance: 0.10         # below_baseline = composite < baseline * (1 - tolerance)

  # --- Detection gate (health-ledger §8; Phase 2). ALL three + the counter must hold. ---
  detection:
    interval: 10                   # sweep cadence (every N completed goals), medium-tier deferrable
    slope_threshold: -0.02         # composite_trend must be below this (negative slope)
    floor: 0.40                    # composite must be below this absolute floor
    consecutive_below_baseline: 3  # require N consecutive below_baseline records before tripping

  # --- Calibration AND-gate (health-ledger §10). BOTH must hold before `full` mode reverts. ---
  calibration:
    min_days: 30                   # ≥ N days of records, AND
    min_records: 50                # ≥ N records (AND, not OR — prevents ~1-day activation)

  # --- Revert pipeline (Phase 3) ---
  revert:
    confidence_gate: 0.70          # Ring 3 auto-revert requires attribution_score ≥ this (else demote to Ring 2)
    verification_iterations: 5     # post-revert: keep if composite improves ≥ improve_delta within N iterations
    improve_delta: 0.05            # min composite improvement to confirm a revert helped
    dead_end_expiry_days: 30       # (file,signal) revert dead-ends expire after N days
    chain_depth_cap: 1             # bidirectional dead-end cap — prevents revert↔undo oscillation

  # --- Signal→file correlation map (health-ledger §9.3; consumed by
  # health-attribution.py). When a signal degrades, files matching its globs
  # are the most plausible causes. correlation_weight: 1.0 direct (the file
  # governs the signal's machinery) / 0.5 indirect / 0.3 unknown (default for
  # any changed file matching no rule). Agent-evolvable — start lean and let
  # the map accrete from confirmed attributions (OD-4 re-seed cadence). All
  # globs are framework-internal paths (domain-free). attribution_score =
  # temporal_proximity × correlation_weight × recency_decay. ---
  signal_file_correlation:
    default_weight: 0.3            # unknown — any changed file matching no rule below
    rules:
      - signal: encoding_ratio    # how much the agent encodes per goal
        weight: 1.0
        globs:
          - "core/config/memory-pipeline.yaml"
          - ".claude/skills/aspirations-state-update/**"
          - ".claude/skills/aspirations-consolidate/**"
          - ".claude/skills/aspirations-learning-gate/**"
          - "meta/encoding-strategy.yaml"
      - signal: deep_ratio        # deep vs routine work mix
        weight: 1.0
        globs:
          - "meta/goal-selection-strategy.yaml"
          - "core/scripts/goal-selector.py"
          - ".claude/skills/aspirations-execute/**"
      - signal: tree_writes       # knowledge-tree write volume
        weight: 1.0
        globs:
          - ".claude/skills/tree/**"
          - "core/config/knowledge-conventions.md"
          - "core/config/conventions/tree-retrieval.md"
      - signal: composite_productivity  # the master score — broad, so indirect
        weight: 0.5
        globs:
          - "core/config/aspirations.yaml"
          - "core/scripts/productivity-stop-gate.sh"
          - "meta/reflection-strategy.yaml"
