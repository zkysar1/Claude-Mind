# Session File Manifest — authoritative list of every file that may live in
# <agent>/session/ with its classification and recovery action.
#
# This is the single source of truth for:
#   - /start --recover Phase 0.7 (clear entries with recovery_action: clear)
#   - session-snapshot.sh (stat every entry, emit JSON)
#   - session-desync-check.sh (warn on orphans, missing files, invariant violations)
#   - owncloud_sync.py session-file sync filter (derives the machine-local denylist
#     + continuity set from `sync_tier` — SINGLE SOURCE OF TRUTH, no second list)
#
# Do NOT duplicate this list in skill pseudocode or recovery scripts. Add new
# session files HERE, and recovery logic picks them up automatically.
#
# Fields per entry:
#   file              — basename inside <agent>/session/ (no path prefix)
#   purpose           — one-line human-readable description
#   writer            — script or skill authorized to write (see user-interaction.md)
#   recovery_action   — what /start --recover does:
#                         preserve — leave untouched (owned data, or regenerated by
#                                    owner on next write)
#                         clear    — rm -f (stale transient after a crash)
#   sync_tier         — own-cloud cross-machine disposition (see owncloud_sync.py):
#                         machine_local — NOT synced to S3. Either liveness/identity
#                                         (syncing causes phantom runners) OR a
#                                         regenerable local cache / this-machine state.
#                         continuity    — synced via sweep AND pulled at /start on a
#                                         new machine. Accumulated knowledge that must
#                                         survive an agent machine-move; loss = silent
#                                         knowledge loss.
#                         ephemeral     — synced opportunistically by the sweep
#                                         (harmless) but NOT pulled at boot; per-iteration
#                                         telemetry, machine-B starts a fresh trail.
#   required_when_idle — if true, presence when agent-state=IDLE is normal;
#                        if false, presence when IDLE is a desync warning
#   required_when_running — if true, presence when agent-state=RUNNING is normal;
#                           if false, presence when RUNNING is a desync warning

files:
  # ── Lifecycle state (written by /start and /stop only) ──────────────
  - file: agent-state
    purpose: RUNNING / IDLE state machine
    writer: session-state-set.sh (/start, /stop, productivity-stop-gate)
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: true
    required_when_running: true

  - file: agent-mode
    purpose: reader / assistant / autonomous
    writer: session-mode-set.sh (/start, /stop)
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: true
    required_when_running: true

  - file: persona-active
    purpose: persona toggle (true / false)
    writer: session-persona-set.sh (/start, /stop, /boot)
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: true
    required_when_running: true

  - file: latest-session-id
    purpose: per-agent SID persistence (bridge from SessionStart hook)
    writer: /start IDLE branch Step 0
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: running-session-id
    purpose: identifies active runner SID (stop hook Gate 0 uses this for observer detection)
    writer: /start autonomous transition (C8, IDLE branch Step 3)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: true

  - file: runner-token
    purpose: framework-owned UUID4 generated at /start IDLE→RUNNING (triple-write with running-session-id + latest-session-id). Uniqueness identity that survives Claude Code SID reuse via --continue / --resume. Logged by stop-hook + agent-watchdog so SID-collisions show up as "same SID, different token" in audit trails.
    writer: /start (IDLE Step 3 + UNINITIALIZED Phase C8)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: true

  # ── Signal files (ephemeral, crash-cleared) ─────────────────────────
  - file: loop-active
    purpose: aspirations loop is iterating
    writer: aspirations loop (session-signal-set.sh)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: stop-loop
    purpose: stop hook allowed to exit (terminal flag from /stop Phase -1.4)
    writer: /stop (session-signal-set.sh)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: stop-requested
    purpose: graceful-stop request signal
    writer: /stop, productivity-stop-gate.sh
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: stop-target-mode
    purpose: target mode after graceful stop (assistant / reader)
    writer: /stop Step 1, productivity-stop-gate.sh
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  #  (user directive 2026-08-15: "the loop goes into quiet mode and
  # stays quiet unnoticed"). Four framework paths stop the loop ON PURPOSE —
  # productivity-stop-gate, recovery-gate's zombie RUNNING->IDLE, recovery-gate's
  # recovery-failed-permanent circuit breaker, and reducer-self-fence's lease
  # stepdown. `/start` is USER-ONLY, so after any of them the box sits IDLE until
  # a human independently notices. This file is the machine-readable record of
  # WHICH path fired and why, and it is what lets the out-of-loop fleet sweeper
  # () separate EXPECTED-IDLE (a reason file exists — deliberate, and
  # already announced once) from UNEXPECTED-IDLE (no reason file — the process
  # died, nobody was told, alert).
  # Contents are KEY=VALUE lines (path, stopped_at, agent, box, reason,
  # user_initiated, notified) — same rationale as claim-heartbeat-failure below:
  # jq is absent on some fleet boxes.
  # recovery_action: clear is LOAD-BEARING, not housekeeping. A file left behind
  # after the agent restarts would make the sweeper read a LATER crash as
  # EXPECTED-IDLE — a false negative on precisely the case it exists to catch.
  # sync_tier: machine_local for the same reason as running-session-id: a stop on
  # this box says nothing about a peer, and syncing would manufacture phantom
  # stop reasons fleet-wide.
  - file: last-stop-reason
    purpose: which deliberate-stop path fired and why (absent = no deliberate stop since the last /start)
    writer: stop-reason-record.py (from productivity-stop-gate.sh, recovery-gate.sh x2, reducer-self-fence.sh)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: runner-heartbeat
    purpose: freshness probe (mtime-based) — heartbeat-stale.sh reads this
    writer: heartbeat-tick.sh (aspirations loop Phase -0.5, /start autonomous seed, interruptible-sleep.sh 60s tick)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: true

  # The DDB claim heartbeat is the OTHER leg of the same heartbeat-tick.sh call
  # that writes runner-heartbeat above, and the two legs fail INDEPENDENTLY.
  # This marker exists because that asymmetry was invisible: the DDB leg died
  # ~105 min before the agent did while the local + team-state legs kept
  # succeeding, so the claim aged out under a healthy reducer and two later
  # /starts came up as second reducers (, 2026-08-05). Present = this
  # runner's cross-machine claim is NOT being renewed; absent = healthy.
  # Contents are KEY=VALUE lines (first_failed_at, count, last_rc, last_error) —
  # deliberately not JSON, since jq is absent on some fleet boxes.
  - file: claim-heartbeat-failure
    purpose: consecutive-failure record for the DDB runner-claim heartbeat leg (absent = healthy)
    writer: heartbeat-tick.sh (own-cloud backend only; cleared on the first success)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: compact-pending
    purpose: marker that PreCompact fired but SessionStart hasn't restored yet
    writer: PreCompact hook
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  # Quiescence wake-signals — consumed by interruptible-sleep.sh via raw [ -f ]
  # and rm -f; written by future producers (board.py, email-poll, aspirations.py)
  # via session-signal-set.sh. Mirror the reader/writer list in
  # core/scripts/session.py VALID_SIGNALS.
  - file: board-activity
    purpose: wake signal — new coordination-board post arrived during sleep
    writer: board.py (session-signal-set.sh)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: email-received
    purpose: wake signal — inbox poller saw new mail during sleep
    writer: email-poll (session-signal-set.sh)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: goal-claim-released
    purpose: wake signal — a partner agent released a goal claim during sleep
    writer: aspirations.py (session-signal-set.sh)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: .wake-debounce-mtime
    purpose: wake-signal debounce timestamp (epoch seconds) — coalesces bursty partner signals into single wake (g-001-230)
    writer: interruptible-sleep.sh
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: crash-marker
    purpose: context-exhaustion breadcrumb written by StopFailure hook; consumed + deleted by /boot on next session
    writer: stop-failure-hook.sh (StopFailure hook)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  # ── Agent watchdog (per-agent observability — periodic tick) ────────
  # agent-watchdog.py runs as a periodic probe from iteration-close.sh
  # productivity-check via `agent-watchdog.py --tick`. State persists
  # across iterations in watchdog-prev-state.json. No daemon, no PID
  # file, no /start spawn — cross-platform tick model that survives the
  # Git-Bash-on-Windows daemon-detachment issue (asp-280 era). Probe
  # transitions log to core/logs/watchdog-<agent>.jsonl.
  - file: watchdog-prev-state.json
    purpose: agent-watchdog tick-mode prev-state (snapshots per probe; diffed by next tick)
    writer: agent-watchdog.py --tick (invoked from iteration-close.sh)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  # ── Transient iteration artifacts (crash-cleared) ───────────────────
  - file: iteration-checkpoint.json
    purpose: in-flight obligation tracker for graceful-stop recovery
    writer: aspirations loop
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  # machine_local is load-bearing here, not housekeeping (). This file
  # is a BOX-LOCAL bracket: written at graceful-stop entry, cleared at the final
  # housekeeping step, and it carries stop_started_at / target_mode /
  # last_updated / resume_count with NO machine or session identifier — so once
  # it crosses boxes nothing downstream can tell whose stop it describes.
  # Unregistered, the sync filter fell through to its fail-safe heuristic, which
  # mirrors any known data extension, so a .json sentinel SYNCED. The Session
  # Start Protocol probes it on every IDLE start and, on a hit with mode still
  # autonomous, routes straight into the graceful-stop resume handler — so a
  # synced-in checkpoint made a fresh session on box B resume a stop that
  # happened on box A. The probe is itself a read, so under read-through caching
  # the probe MATERIALISES the file: the defect was self-triggering.
  - file: stop-checkpoint.json
    purpose: interrupted-stop sentinel (graceful-stop in progress ON THIS BOX)
    writer: stop-checkpoint.sh (/stop GS-0 entry, cleared at final housekeeping)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: compact-checkpoint.yaml
    purpose: compact-recovery slot snapshot (written by PreCompact hook)
    writer: PreCompact / compact-restore-slots.sh
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: execute-in-flight
    purpose: Phase-4-execute liveness sentinel (timestamp; written on phase_start phase-4-execute, deleted on phase_end phase-4-execute or any other phase_start). recovery-gate.sh reads it to suppress false-positive auto-recovery during long Phase-4 work that stales other liveness signals. Per-machine — a goal mid-execution on one machine is NOT in flight on another, so it must stay machine_local (registered 2026-06-04 after a machine-move desync warning flagged it as an unregistered signal-shaped orphan).
    writer: execution-diary.py (_maintain_execute_in_flight)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: runner-write-attribution
    purpose: runner write-attribution evidence (runner SID + unix timestamp) stamped by the Phase -1.45 runner-identity gate; a fresher signal than running-session-id, used in the g-305-09/US-09 stale-pointer override (a session whose write-attribution is fresher than ~300s is treated as the confirmed runner, not ejected). Per-machine identity — syncing it cross-machine would manufacture phantom runners, so it must stay machine_local (registered 2026-07-10, g-115-1900, after a machine-move desync warning flagged it as an unregistered signal-shaped orphan)
    writer: runner-identity-check.sh (Phase -1.45 runner-identity gate)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: true

  # ── Persistent agent data (preserve across recoveries) ──────────────
  - file: handoff.yaml
    purpose: cross-session state (consolidation → next boot); consumed at boot
    writer: aspirations-consolidate (session-end)
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: pending-agents.yaml
    purpose: background subagent tracking (stop hook Gate 2.5)
    writer: aspirations-execute Phase 4
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: background-jobs.yaml
    purpose: long-running external process tracker (forged skills)
    writer: background-jobs.sh
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: aspirations-compact.json
    purpose: compressed goal index — regenerated by load-aspirations-compact.sh
    writer: load-aspirations-compact.sh, postcompact injection
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: working-memory.yaml
    purpose: short-term working memory slots
    writer: wm-*.sh scripts
    recovery_action: preserve
    # Corruption detective (): an all-0x00 file (NTFS crash signature —
    # rename journaled, data never flushed) is detected by wm.py read_yaml,
    # which WARNs on stderr and reads as empty. Recovery then rides the loop's
    # existing Phase -1 path: all-slots-null -> wm-init.sh re-seeds the
    # template. Writers fsync before rename (_fileops.durable_write_text /
    # wm.py write_yaml) so the class should no longer occur; the detective is
    # the belt to that suspender. No special /start --recover handling needed.
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: execution-diary.jsonl
    purpose: append-only reasoning breadcrumb trail (survives autocompact)
    writer: execution-diary.py append
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: gate-d-telemetry.jsonl
    purpose: Gate D commons-pattern injection telemetry (append-only; audited by gate-d-validate-telemetry.py)
    writer: iteration-close.sh (aspirations-execute Step 5e fields)
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: retrieval-session.json
    purpose: tree nodes retrieved this session (learning-gate Phase 9.5b reads)
    writer: retrieve.sh (auto-written on Phase 4 retrieval)
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: context-budget.json
    purpose: token-budget tracking (banner script reads)
    writer: context-budget-status.py
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: scorer-verdict.json
    purpose: scorer top pick + top-5 sidecar (Scorer Sovereignty Layer B, g-115-2812) — the claim gate (scorer-verdict-gate.py) reads it to refuse unsanctioned divergence from the scorer's top pick
    writer: goal-selector.py write_scorer_verdict (cmd_select, every iteration)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: pending-questions.yaml
    purpose: async user questions (read by /open-questions, /backlog-report)
    writer: /respond, /aspirations-execute, /aspirations-spark, /aspirations-evolve
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: consolidation-lean-streak
    purpose: integer counter for consecutive lean consolidations
    writer: aspirations-consolidate Step 9
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: last-report-timestamp
    purpose: ISO timestamp of last /agent-completion-report
    writer: agent-completion-report Phase 5
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  # The three Phase 5.5 digest artifacts. Registered 2026-08-17 (, echo,
  # cc-03): the SKILL.md has named all three paths since the phase shipped, and
  # none was declared here — so the Write-tool manifest gate REFUSED the one an
  # LLM writes by hand (digest-notes.md) while the two a bash script writes went
  # through unnoticed. The gate is Write-tool-only, so the gap was invisible
  # until an agent actually took the documented optional path. All three are
  # regenerable from the stores; losing them costs one rebuild.
  - file: fleet-digest.md
    purpose: plain-text user-facing fleet digest (the gates, ledger and dedup read this one)
    writer: completion-digest.sh (agent-completion-report Phase 5.5)
    recovery_action: regenerate
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: fleet-digest.html
    purpose: HTML rendering of the same digest — the body the user actually opens
    writer: completion-digest.sh (agent-completion-report Phase 5.5)
    recovery_action: regenerate
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: digest-notes.md
    purpose: optional bounded (<=12 line) LLM-authored note prepended to the digest — only what the stores cannot say
    writer: agent-completion-report Phase 5.5 (hand-written, optional)
    recovery_action: regenerate
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: reasoning-snapshot.yaml
    purpose: reasoning-trajectory snapshot for compact recovery
    writer: reasoning-snapshot.sh
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: desync-warnings.jsonl
    purpose: append-only advisory log of desync-check warnings (for trend analysis across sessions)
    writer: session_desync_check.py
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: recovery-log.jsonl
    purpose: append-only audit trail of crashed-runner auto-recoveries performed by recovery-gate.sh (for trend analysis and false-positive triage)
    writer: recovery-gate.sh
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: recovery-notice
    purpose: one-line cause string written by recovery-gate.sh during crashed-runner auto-recovery; surfaced by /prime on next session, then deleted
    writer: recovery-gate.sh
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: recovery-failure-count
    purpose: integer count of consecutive _perform_recovery failures (circuit breaker); reset to absent on next successful recovery
    writer: recovery-gate.sh
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: recovery-failed-permanent
    purpose: written when recovery-failure-count >= 3; recovery-gate refuses further automatic retry; cleared by /start --recover --force or successful recovery
    writer: recovery-gate.sh
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: compact-checkpoint.json
    purpose: alternate JSON form of compact checkpoint (legacy compat)
    writer: compact-restore-slots.sh
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  # ── Orphan registrations (added 2026-04-23 during asp-248 drift cleanup) ─
  # These were appearing in <agent>/session/ on disk but missing from this
  # manifest. Discovered during alpha /boot when session-desync-check.sh
  # reported 6 orphans. Classified per writer + lifecycle.
  - file: infra-streak-sent.jsonl
    purpose: infra-health notification throttle log (append-only; which streak alerts have been sent so they don't duplicate)
    writer: infra-streak-notify.sh
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: last-phase-cost.json
    purpose: per-session token/time accounting for the most recent aspirations-loop phase
    writer: phase-cost-report.sh (invoked from aspirations-consolidate SKILL.md:591)
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: quiescence-log.jsonl
    purpose: append-only backoff/quiescence diagnostic log written during all-blocked handling (B0-B7)
    writer: quiescence-gate.py
    recovery_action: preserve
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: self-drift-log.jsonl
    purpose: append-only log of self.md drift-gate firings (tracks guard-380 self-evolution events)
    writer: self-drift-gate.py
    recovery_action: preserve
