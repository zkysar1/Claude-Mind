    required_when_running: false

  - file: goal-reads.jsonl
    purpose: RETIRED (g-333-02). Was an append-only log of cmd_read/cmd_query goal returns for the g-115-410-b stale-read gate. Writer dead since the 2026-05-14 daemon cutover (daemon read path does not log goal reads); 3 stale files (~257k frozen lines) deleted g-333-02. No truncation ever existed (the prior "truncates to last 1000" claim was false). stale_read.py _agent_last_read early-returned on the now-absent file, so the gate O(n) receipt scan was vestigial (Block 2 retained per g-115-1572 but unreachable in production). g-115-2107 (2026-07-13) retired and removed the whole stale-read gate + stale_read.py module -- this ledger is now orphaned history (preserved, no writer).
    writer: none (retired -- aspirations.py:_log_goal_read removed at 2026-05-14 daemon cutover)
    recovery_action: clear
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  # ── Orphans registered 2026-05-07 ───────────────────────────────────
  # Five files surfaced as desync orphans on every snapshot. All have
  # known writers that idempotently regenerate them — preserve across
  # recovery. Registering silences the [info] orphan warnings and
  # turns the desync check into pure signal.
  - file: aspirations-compact-summary.json
    purpose: compact aspirations index summary (smaller companion to aspirations-compact.json)
    writer: load-aspirations-compact.sh
    recovery_action: preserve
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  - file: decision-rules-last-call
    purpose: timestamp of most recent decision-rules invocation (cadence tracker)
    writer: decision-rules-append.py
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: decision-rules-staleness-last-warned-sid
    purpose: SID of session that last surfaced the decision-rules staleness warning (dedup)
    writer: decision-rules-staleness.sh
    recovery_action: preserve
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: email-last-seen.txt
    purpose: timestamp/UID of most recent email read (poll watermark)
    writer: email-poll (access-email skill)
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  # Glob entry — the sentinel filename includes the session number, which
  # rotates each /start cycle. Snapshot + clear scripts treat `glob: true`
  # entries as fnmatch patterns: existence = ANY match present, clear =
  # delete all matches, orphan-scan = skip files matching any registered
  # glob pattern. Stale -session-(N-1).txt sentinels accumulate slowly;
  # `recovery_action: clear` reaps them on the next /start --recover.
  - file: aspirations-incremented-session-*.txt
    glob: true
    purpose: per-session sentinel proving aspirations sessions_active was incremented (one per session)
    writer: aspirations-increment-sessions-active.py
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  # Per world/conventions/self-program-evolution.md — Pre→Post sidecar bridge
  # for the 3-phase write path (D1). evolution-prepare.py writes one of these
  # per Edit/Write/MultiEdit on a tracked path (agent self.md, world/program.md,
  # .claude/skills/**/SKILL.md, .claude/rules/*.md). evolution-record.py reads
  # it back at PostToolUse and deletes it. Filename is `pending-evolution-<6hex>.json`
  # where 6hex is sha256(absolute_path)[:6] — supports concurrent edits to
  # different files in one turn without collision. recovery_action: clear so a
  # crashed session between Pre and Post doesn't leave orphans (the 24h
  # git-sweep backfills missing event-stream entries — §9.7).
  - file: pending-evolution-*.json
    glob: true
    purpose: PreToolUse→PostToolUse sidecar carrying before_hash + history_snapshot + previous_revision_id (D1, §5.4b)
    writer: evolution-prepare.py
    recovery_action: clear
    sync_tier: machine_local
    required_when_idle: false
    required_when_running: false

  # ── Cross-box Body WM transport staging (pending-body-merges/) ───────
  # Registered twice, independently and simultaneously, by -b and
  # ; merged 2026-08-02 (alpha, cc-04). Both sides agreed on all
  # three globs and every field except `writer`, and that field is the one
  # worth reading carefully — see the writer note below.
  #
  # THREE FILES PER UNIT, staged under <agent>/session/pending-body-merges/:
  # <unitKey>-wm.yaml (the forked WM), <unitKey>-wm-baseline.yaml (the
  # pre-fork baseline the reducer's 3-way merge needs, ), and
  # <unitKey>-wm.hash (the forked_wm_hash integrity sidecar). ALL THREE must
  # reach remote storage or the reducer box cannot consume the handoff.
  #
  # Written by body-manifest.py (close_body_on_genuine / _stage_and_push /
  # push_staged_files — it owns _STAGED_DIRNAME) and by
  # cleanup-stale-bindings.sh's crash-preserve path (/).
  # NOT by body-merge.py: that module only CONSUMES (_consume_staged, L302)
  # on the reducer box. The  side of this merge attributed all three
  # entries to body-merge.py, which names the consumer rather than either
  # writer; corrected here after grepping the three files that touch
  # pending-body-merges/ (verified 2026-08-02).
  #
  # sync_tier MUST be continuity: a remote worker's whole purpose is to get
  # its forked WM to a reducer on ANOTHER box. `sessions/` (plural) is
  # walk-pruned by _EXCLUDE_DIRS, which is exactly why the Body's WM is
  # COPIED here (session/, singular) to become syncable at all.
  #
  # Registering all three is load-bearing, not bookkeeping. Unregistered
  # basenames fall through _session_file_machine_local's extension
  # heuristic (`suffix in _SESSION_DATA_EXTS`), and `.hash` is NOT in that
  # set — so the hash sidecar classified machine_local and could never
  # reach S3, while its two .yaml siblings synced — a successful-looking
  # WriteResult on a file that never left the box. Measured 2026-08-02
  # (alpha, cc-04): wm.yaml False, wm-baseline.yaml False, wm.hash True.
  # That silently disabled _consume_staged's Guard-2 no-op short-circuit
  # for every cross-box orphan (a never-diverged Body would be merged as
  # if divergent). Latent since  because same-box staging reads
  # the local file and never needed the push. Pinned by
  # test_owncloud_sync.py::test_staged_body_merge_globs_sync, which
  # mutation-fails if any of these three entries is removed.
  #
  # recovery_action: preserve — these files ARE un-merged worker WM.
  # Clearing them on /start --recover would destroy the only copy of that
  # Body's divergence, which is the exact loss the transport exists to
  # prevent.
  - file: '*-wm.yaml'
    glob: true
    purpose: staged forked Body WM awaiting reducer-side merge (cross-box transport)
    writer: body-manifest.py close_body_on_genuine / cleanup-stale-bindings.sh
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: '*-wm-baseline.yaml'
    glob: true
    purpose: staged fork-time WM baseline — the 3-way-delta common ancestor the reducer merge needs (g-306-119-c consumes it)
    writer: body-manifest.py close_body_on_genuine
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: '*-wm.hash'
    glob: true
    purpose: forked_wm_hash integrity sidecar — drives _consume_staged's never-diverged no-op short-circuit
    writer: body-manifest.py close_body_on_genuine / cleanup-stale-bindings.sh
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  # ── Cross-box Body liveness carrier () ──────────────────────
  # The SYNCABLE twin of sessions/<SID>/body-heartbeat. That file is the
  # SAME-BOX signal and stays where it is; it can never serve a cross-box
  # reader because `sessions/` (plural) is walk-pruned by _EXCLUDE_DIRS —
  # the identical constraint that forced the staged-WM copy above, and the
  # reason this one lives in session/ (singular) too.
  #
  # CONSUMER: stranded-claim-sweep.py's foreign-SID branch. Before letting
  # the flat 120m grace expire on a claim held by another SID, it reads this
  # carrier for THAT sid. Fresh + sid matches -> the holder is alive on
  # another box, keep the claim. Anything else -> fall through to the exact
  # pre-existing 120m behavior, so the change can only ever be MORE
  # conservative than what it replaced.
  #
  # sync_tier MUST be continuity, and not merely because the reader is on
  # another box: guard-2418 — a condition evaluated on one box must not
  # depend on a machine_local read a different box owns, because the absent
  # file and the legitimately-false value are the SAME observable and no
  # error is raised. A machine_local carrier would silently read "dead" for
  # every live cross-box worker.
  #
  # The `.json` suffix is deliberate belt-and-braces, not decoration. This
  # registration is what sets the tier — but an UNREGISTERED basename falls
  # to _session_file_machine_local's extension heuristic
  # (owncloud_sync.py:314-316), and an extensionless name is not in
  # _SESSION_DATA_EXTS. That is exactly the measured `.hash` incident at
  # L537-543 above: a successful-looking WriteResult on a file that never
  # left the box. Registered AND synced-extension, so neither has to hold
  # alone.
  #
  # recovery_action: clear — and note this INVERTS its three neighbours
  # above, deliberately. Staged WM is preserved because it is the only copy
  # of a Body's divergence. A heartbeat is the opposite: it is regenerated
  # every tick and costs nothing to lose, while a PRESERVED STALE carrier is
  # actively harmful — it would vouch for a dead worker and hold a claim
  # that should have been released. Cheap to lose, dangerous to keep.
  - file: 'body-heartbeat-*.json'
    glob: true
    purpose: cross-box Body liveness carrier — {sid, agent, host, ts, body_state}; consulted by stranded-claim-sweep's foreign-SID grace and by worker_stall's peer-side stall probe. body_state (g-306-319) mirrors body-manifest.yaml, which a peer CANNOT read (it lives under sessions/, an owncloud_sync._EXCLUDE_DIRS walk-prune); without it a Body that closed and a Body that died between units are byte-identical to the probe. Empty string when the manifest is unreadable — the reader renders that as stale_state_unknown, which never alerts.
    writer: heartbeat-tick.sh (per-SID, above the IDLE state gate); body_state ALSO mirrored on transition by body-manifest.py set_state / park_body / resume_body, because a Body's last tick precedes its close
    recovery_action: clear
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

