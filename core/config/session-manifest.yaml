  # heals a divergence and a both-diverged fence is a PERMANENT wedge.
  # A merge handler is the WRONG lane by design — guard-907 is explicit that
  # single-writer session files are DELIBERATELY not merge-registered, because
  # a union of two sessions' private state is semantically wrong. The
  # discriminator between working-memory.yaml (heals itself, same
  # single-writer shape, also no handler) and drain-lane-state.json (wedged
  # ~36h / 212 conflict-skips on cc-02) is REGISTRATION, not the handler.
  #
  # THE POPULATION IS BOX-DEPENDENT AND THIS LIST IS A UNION, NOT A CENSUS.
  # The filing scan (zeta, cc-02, 2026-08-15) found 11; an independent re-scan
  # (bravo, cc-05, 2026-08-16) found 7 — six overlap, five of cc-02's are
  # absent here, and agent-inbox-inverse-audit.json is one cc-02 never saw. A
  # session-dir scan enumerates what THIS box happens to hold, so NO single
  # box can observe the whole population and a same-box re-scan reporting zero
  # is not evidence the class is closed. The manifest is fleet-wide and
  # committed, so registering the union is safe (an entry for a file absent
  # here is inert) and necessary. Positive controls that make any re-scan
  # valid: agent-state must classify machine_local=True and
  # working-memory.yaml machine_local=False — without both, read no buckets.
  #
  # NOT registered, deliberately: sel2.json / sel3.json (stale zeta selector
  # debug captures, ~100KB each, 2026-07-19). They are debris to be deleted,
  # not state — registering would legitimize them. They do not exist on cc-05,
  # so they could not be READ before deleting (archive-before-delete), and
  # deleting another agent's files sight-unseen is exactly what that rule
  # forbids. Left for a session on their own box.
  - file: drain-lane-state.json
    purpose: per-BOX goal-selector cadence counter (invocations_since_pick, k, eligible_count, last_pick_goal_id, ts). machine_local because merging or syncing two boxes' selector counters is meaningless — and because never being pushed means it can never diverge, which ELIMINATES the wedge class rather than healing it. This is the worked specimen for this whole block — it wedged on cc-02 for ~36h / 212 conflict-skips, and it exists on 5 of 7 agents, so the exposure was fleet-wide.
