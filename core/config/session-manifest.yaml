    required_when_running: false

  - file: escalation-scan-watermark.txt
    purpose: high-water mark for the escalation email scan, so every in-window email is read EXACTLY once across successive runs rather than re-read from a newest-N truncation. continuity (not machine_local) precisely BECAUSE the exactly-once property should survive a machine move — losing it re-reads the whole backlog (measured ~112 emails in a post-ask storm). Reset by deleting the file.
    writer: escalation-reply-scan.sh (domain)
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: pr-merge-state-cache.json
    purpose: per-agent cache of PR merge state, so the merged-PR predicate does not re-query GitHub on every evaluation. ephemeral because it is a pure CACHE — the facts it holds are global (GitHub) and re-queryable, so losing it costs one re-query and nothing else. Note both ephemeral and continuity are auto-resolve eligible, so the wedge fix does not turn on this choice; the tier only decides whether it joins the continuity pull-set, and a rebuildable cache should not. g-115-3406 read the same writer and reached the same conclusion independently.
    writer: predicate.py (_pr_cache_load / _pr_cache_save)
    recovery_action: clear
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: tree-write-conflicts.jsonl
    purpose: append-only diagnostic log of tree-write fence conflicts, paired with the per-node tree-write-baselines directory. ephemeral rather than continuity — it is per-box diagnostic history, and ephemeral makes it auto-resolve eligible (LOCAL-WINS) so a divergence costs some diagnostic history instead of permanently wedging the file. Deliberately NOT given a merge handler despite being append-only (guard-907 — the union of two sessions' fence records is not meaningful).
    writer: tree_write_fence.py
    recovery_action: preserve
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: spark-gap-telemetry.jsonl
    purpose: append-only telemetry on Phase-6 spark gaps (which closes fired a spark and which did not). Diagnostic trend data, regenerated continuously by the loop; safe to lose on divergence.
    writer: iteration-close.sh
    recovery_action: preserve
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: checkpoint-miss.jsonl
    purpose: append-only telemetry recording iteration-checkpoint write misses (claim-time anchor vs loop-state-save). Diagnostic only — the loop does not read it to make decisions, so losing it on divergence costs trend data and nothing else.
    writer: aspirations-claim.sh / loop-state-save.py
    recovery_action: preserve
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: mdl-existing-corpus.raw
    purpose: cached corpus snapshot for the MDL gate's description-length comparison at state-update time. A rebuildable cache derived from the live stores, not a record of anything — regenerating it is cheap, so ephemeral. Extension is `.raw` (JSONL content) NOT `.jsonl` — it lives in agents/<agent>/temp/, and temp-drain-purge.sh Lane 1 reaps by EXTENSION against `_EPHEMERA_GLOB` (.log .txt .py .sh .err .raw .out .bak). `.jsonl` and `.json` are both absent from that set, so under the old name this transient scratch was invisible to Lane 1 and accumulated permanently (g-115-7247).
    writer: mdl_gate.py (via aspirations-state-update)
    recovery_action: clear
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

  - file: cnc-drain-holds.jsonl
    purpose: per-agent HOLD ledger for the completed-not-closed drain (aspirations-precheck Phase 0.5g.7). One row per `completed-not-closed-slate.sh --hold <goal> --reason` -- {goal_id, held_at, reason, agent, sid}; the slate holds a row back for completed_not_closed_drain.hold_ttl_hours and then re-serves it with its hold_count. Rows older than 30d are pruned on the next append, so it is bounded by construction. Touches no goal record. continuity because the reducer moves boxes and a lost ledger re-serves yesterday's holds (harmless, but the whole point of the ledger); losing it can never hide a row -- a missing ledger reads as an empty hold set (fail-open). Registered 2026-08-16 (fresh-eyes review of the Phase-1 drain).
    writer: completed-not-closed-slate.py --hold (reducer-only lane)
    recovery_action: preserve
    sync_tier: continuity
    required_when_idle: false
    required_when_running: false

  - file: agent-inbox-inverse-audit.json
    purpose: output of the agent-inbox inverse audit (which expected inbound messages have no matching inbox record). Per-box audit artifact, regenerated by re-running the audit. Registered 2026-08-16 — this one was invisible to the cc-02 filing scan and is the direct evidence that the orphan population cannot be enumerated from a single box.
    writer: agent-inbox-inverse-audit.sh (domain)
    recovery_action: clear
    sync_tier: ephemeral
    required_when_idle: false
    required_when_running: false

# ── Desync invariants ───────────────────────────────────────────────
# Rules checked by session-desync-check.sh. Violations are logged advisory
# to <agent>/session/desync-warnings.jsonl but do NOT auto-fix.
invariants:
  - id: heartbeat_without_running
    description: runner-heartbeat is fresh but agent-state is IDLE — indicates a crash or a stale heartbeat file
    rule: runner-heartbeat exists AND heartbeat mtime < 120s old AND agent-state != RUNNING
    severity: warning

  - id: stop_requested_when_idle
    description: stop-requested present when agent-state is already IDLE — stale signal from partial /stop
    rule: stop-requested exists AND agent-state == IDLE
    severity: warning

  - id: iteration_checkpoint_when_idle
    description: iteration-checkpoint.json present when agent-state is IDLE — aborted mid-iteration
    rule: iteration-checkpoint.json exists AND agent-state == IDLE
    severity: warning

  - id: loop_active_when_idle
    description: loop-active signal present when agent-state is IDLE — stale signal from crash
    rule: loop-active exists AND agent-state == IDLE
    severity: warning

  - id: running_without_heartbeat
    description: agent-state is RUNNING but runner-heartbeat is missing — session may have crashed before first heartbeat
    rule: agent-state == RUNNING AND runner-heartbeat does NOT exist
    severity: warning
