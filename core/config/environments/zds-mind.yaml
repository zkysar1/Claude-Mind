# Environment registry entry -- zds-mind (, BRD environment-id-as-key).
#
# Promotion target (dev-tier -> Claude-Mind -> ZDS-Mind). Defaults to the
# local-files backend -- a safe, self-contained default that touches no cloud
# resources, so committing it here cannot mix state into a wrong bucket. The
# ZDS-Mind operator sets the own-cloud wiring HERE when cutting over:
#   backend: own-cloud
#   bucket: <zds bucket>
#   sessions_table: <zds sessions table>
#   lock_table: <zds lock table>
#   region: <zds region>
# Until then, legacy STORAGE_* vars in ZDS-Mind's .env.local still take effect
# (setdefault precedence + deprecation warning), so promotion does NOT change
# ZDS-Mind's running behavior.
environment_id: zds-mind
backend: local
# known_agents (OPTIONAL, ): agent names known to operate in THIS
# deployment. Feeds the cross-deployment addressing collision set
# (core/config/conventions/cross-deployment-channel.md "Addressing an agent"):
# a BARE requires_action_by:<name> where <name> is in BOTH the local roster
# and a peer's known_agents is ambiguous and FAILS LOUD in
# core/scripts/insight-trigger-sweep.py resolve_addressing(). Measured
# 2026-07-30 (, zeta, from zds-mind team-state): roster is
# omni + zeta. Update when their roster changes; absence of this field
# contributes no names (collision set shrinks, bare names keep routing local).
known_agents:
  - omni
  - zeta
