# Monitor-probes registry (FW-1b,  / asp-317).
#
# Demoted pure-monitoring probes that used to occupy a goal-selection slot every
# cycle even when they returned "ok"/"clean"/guaranteed-null. monitor-tick.py
# runs each ENABLED probe at its own interval_hours from iteration-close.sh
# productivity-check (beside agent-watchdog --tick — LOCAL tick, never cloud
# cron; guard-441). A clean probe records a last-run marker and emits nothing
# (no goal, no slot). A tripped probe is converted to ONE deduped Investigate/
# Unblock via monitor-finding-convert.py (origin_signal dedup, target_asp
# routing) — so the scan leaves the queue but the FINDING re-enters it exactly
# when there is work. Design: FW-1b monitoring-sweep demotion ( / asp-317).
#
# NATURAL-GATE (guard-348): `enabled_probes` is the allowlist. EMPTY = registry
# inert (monitor-tick scans NOTHING and exits immediately). Migrate one probe id
# at a time by adding it here AND setting the corresponding recurring goal
# status:skipped with outcome_note "demoted to monitor-tick probe <id> (FW-1b)".
# Removing an id reverts that probe to a normal queue goal. Presence in the
# allowlist IS the gate — there is intentionally NO per-probe `enabled:` boolean.
#
# Ships inert. Phase-3 (Apply-3) migrates Bucket-A pure-probes first
# (/03/106/151/831) one id at a time.
# FIRST PROBE ENABLED 2026-09-16 (echo, cc-03, ). The registry is no
# longer inert on this deployment.
#
# THE PROMOTION HAZARD IS ACCEPTED IN WRITING, not overlooked ( /
#  named it and the goal required an explicit decision). This file is
# a FRAMEWORK path carrying DEPLOYMENT-OWNED state: ZDS prod already has enabled
# probes whose values cannot back-port, so every plant flags this file prod-ahead
# and a hand-restore has stood between ZDS and losing its probes across at least
# three promotions. Adding a row here adds to that recurring cost.
#
# ACCEPTED ANYWAY, and the reasoning is specific rather than "monitoring is
# good": the thing being watched is the least-watched tick in the estate AND the
# one that mails real customers about money, and its failure mode is silent by
# construction — the once-only `runReceiptAt` claim is set BEFORE the send and
# stays set if the send throws, so a broken transport burns the receipt with
# `ok:true` and `errors:[]` on the way out. Waiting for the world-overlay fix
# () or seed-manifest preservation () means running that
# exposure unwatched for however long those take. This row does not create a new
# hazard CLASS — the file is already prod-ahead and already hand-restored; it
# adds one row to a cost that is being paid regardless. The standing 2026-08-11
# user directive ("we need to know asap if there is something wrong") is the tie
# breaker, and it points at detection.
enabled_probes:
  - vinheim-settlement-tick

# Probe definitions. A probe is a script that exits 0 when clean and NON-ZERO
# when it trips; its combined stdout+stderr is captured as the trip evidence.
# Per-probe schema:
#   id                    unique probe id (matches the migrated recurring goal where applicable)
#   script                path to the probe script. A path under `world/` or
#                         `meta/` resolves to the user-configured EXTERNAL path
#                         (WORLD_DIR / META_DIR), NOT project_root/world -- those
#                         trees are not under PROJECT_ROOT (E1). Any other
#                         relative path (e.g. core/scripts/x.sh) resolves under
#                         PROJECT_ROOT; an absolute path is used as-is.
#                         (e.g. world/scripts/probe-operator.sh, core/scripts/x.sh)
#   interval_hours        minimum hours between runs (self-gated via the state file)
#   on_trip               file_goal | post_finding
#   target_asp            aspiration the trip goal is filed into (for on_trip: file_goal)
#   origin_signal_prefix  origin_signal = "<prefix>:<probe-id>" (drives dedup)
#   title                 (optional) goal title template; default derived from id + evidence
#   priority              (optional) HIGH|MEDIUM|LOW; default MEDIUM
#   category              (optional) goal category; default framework-architecture
#   args                  (optional) list of extra args passed to the probe script
#   clean_exit_codes      (optional) list[int] of exit codes that mean "clean"
#                         (default [0]). Lets a probe with a richer exit contract
#                         (e.g. 0=clean, 2=fail, 3=fail-open) declare which codes
#                         are non-tripping. Any rc NOT in this list (and not the
#                         timeout sentinel below) trips (E2).
#   timeout_is_trip       (optional) bool (default false). When false, a probe
#                         killed at the timeout boundary (runner sentinel rc=124)
#                         is a LOGGED ERROR, never a trip -- a slow/hung probe
#                         cannot manufacture a false finding. Set true only for a
#                         probe whose whole purpose is "did X finish in time" (E2).
#   source                (optional) world | agent -- which goal queue the trip
#                         goal is filed into (default world)
#   description           (optional) human note for maintainers
#
# Example (commented — NOT enabled, since enabled_probes is empty):
# probes:
#   - id: operator-health
#     script: world/scripts/probe-operator.sh
#     interval_hours: 6
#     on_trip: file_goal
#     target_asp: asp-115
#     origin_signal_prefix: monitor-probe
#     title: "Unblock: operator API health probe tripped"
#     priority: MEDIUM
#     category: infrastructure
#     description: "Demoted from recurring  (operator health)."
probes:
  - id: vinheim-settlement-tick
    script: world/scripts/probe-vinheim-settlement-tick.sh
    interval_hours: 1
    on_trip: file_goal
    target_asp: asp-369
    origin_signal_prefix: monitor-probe
    title: "Unblock: Vinheim settlement tick — run-receipt detector tripped"
    priority: HIGH
    category: product-infrastructure
    # 0 = clean, 1 = TRIP, 3 = PROBE ERROR (fail-open). 3 is clean-listed on
    # purpose: "I could not read the log store" must never be filed as "the
    # settlement tick is broken" — a transport fault about the PROBE would
    # otherwise page about the TICK, and the resulting noise is how a real trip
    # gets ignored.
    clean_exit_codes: [0, 3]
    # false (the default, stated explicitly because it is load-bearing here): a
    # probe killed at the timeout boundary is a LOGGED ERROR, not a trip. The
    # log-store query is bounded server-side and runs in ~1s against a 60s
    # bound, so a timeout means the probe is sick, not the tick.
    timeout_is_trip: false
    description: >-
      g-369-342. Watches the main Vinheim gateway settlement tick (10-minute
      cadence), which mails run receipts to EVERY member. Trips on ok:false,
      non-empty errors[], runReceiptTransport:false, no tick within 1500s, and —
      the functional condition a liveness flag cannot provide — receipts DUE with
      none SENT, or deferral persisting across consecutive ticks. rb-7003:
      runReceiptTransport:true is never read as evidence receipts are working.
      guard-4327: reads the tick's OWN emitted fields, never a re-implementation
      of the send path. All 10 conditions (7 trips, 2 negative controls, 1
      probe-error) exercised against mutations of a real captured payload,
      2026-09-16.
