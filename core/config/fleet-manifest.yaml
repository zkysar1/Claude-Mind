# domain-leak-exempt: canonical fleet node manifest — the literal hostnames, tailnet
# addresses and env-var key NAMES below ARE this file's functional payload. Genericizing
# them would make it inert: a parity checker with placeholder nodes checks nothing.
#
# Canonical configuration manifest for the agent fleet. Consumed by
# core/scripts/fleet-config-parity.sh, which compares every live node against
# this file and emits per-node PASS / DRIFT.
#
# WHY THIS EXISTS (g-115-3071). The fleet has strong LIVENESS observability and had
# effectively zero CONFIGURATION observability. The last six fleet incidents were ALL
# config drift and NONE were liveness failures — every one was found by a human or an
# agent tripping over it, never by a probe. The watchdog reported all nodes healthy
# throughout and was correct: they were alive, they were just wrong.
#
# ── SECRETS CONTRACT (non-negotiable) ──────────────────────────────────────────
# `required_env_keys` / `optional_env_keys` are KEY NAMES. The checker reads the
# NAME SET of each node's .env.local and never its values; no value of any key
# listed here is read, compared, logged, or emitted on any output path.
# The ONLY value-bearing reads are `value_visible_env_keys` below — three
# non-secret configuration identifiers whose values ARE the thing being audited.
#
# ── guard-892: CHECK THE NAME BEFORE CHECKING THE STORE ────────────────────────
# Every name below is transcribed from a real read-site, not guessed. A manifest of
# guessed names produces false DRIFT forever: the canonical trap in this codebase is
# the header `AYOAI-API-KEY` whose value comes from env var `AYO_OPERATOR_KEY` — no
# env var named MIND_API_KEY exists anywhere in the fleet. When adding a key here,
# grep the consuming code for the name it actually reads.

schema_version: 1
last_verified: "2026-07-25"
verified_from: "cc-05 (bravo)"   # guard-1412 — a manifest baseline has a vantage point too

# ── Env-var key NAMES every node must carry ────────────────────────────────────
# Absence of any of these is DRIFT. This is the "cc-02 lost 5 storage keys on
# 2026-07-14, found by accident 11 days later" incident class.
required_env_keys:
  - STORAGE_BACKEND
  - STORAGE_S3_BUCKET
  - STORAGE_DDB_LOCK_TABLE
  - STORAGE_DDB_SESSIONS_TABLE
  - ENVIRONMENT_ID
  - MACHINE_ID
  - OWNERSHIP_MODE
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_DEFAULT_REGION
  - ANTHROPIC_API_KEY
  - USER_EMAIL

# Per-vertical / per-role extras. Absence is NOT drift — presence is informational.
# Listing them keeps an unexpected NEW key visible as `unknown_env_keys` instead of
# silently blending into the baseline.
optional_env_keys:
  - AGENTS_GROUP_EMAIL
  - ARC_API_KEY
  - AYO_OPERATOR_KEY
  - AYO_SES_EMAIL_S3_BUCKET
  - DEEPINFRA_API_KEY
  - EFS_SSH_HOST
  - EFS_SSH_KEY_PATH
  - EFS_SSH_USER
  - GROQ_API_KEY
  - MIND_AWS_ACCESS_KEY_ID
  - MIND_AWS_SECRET_ACCESS_KEY
  - OPENAI_API_KEY
  - REMOTE_DATA_PATH

# ── The ONLY keys whose VALUE is read ──────────────────────────────────────────
# Non-secret configuration identifiers. Their values are precisely what drifted in
# incident (6): "Claude-Mind pointing at the shared PRODUCTION bucket with no
# ENVIRONMENT_ID and no MACHINE_ID". Auditing them requires reading them.
# Do NOT add a credential-bearing key to this list.
value_visible_env_keys:
  - STORAGE_BACKEND
  - ENVIRONMENT_ID
  - MACHINE_ID

# Expected resolved values. `per_node` overrides the fleet default where a node
# legitimately differs; MACHINE_ID is checked against each node's `host`.
expected_resolved:
  STORAGE_BACKEND: own-cloud
  ENVIRONMENT_ID: ayoai-mind

# ── Credential VALUE SHAPE (g-115-3344) ────────────────────────────────────────
# check (a) reads env-var key NAMES ONLY, so a key that is PRESENT but holds a
# GARBAGE VALUE passes every dimension above. Live incident 2026-07-26: a ~/.bashrc
# bug exported the 158-character ERROR TEXT of a failed wslvar call as
# OPENAI_API_KEY. Key present, toolchain fine, STORAGE_BACKEND resolved correctly —
# the value was nonsense and nothing looked at it.
#
# THE SECRETS CONTRACT ABOVE IS UNCHANGED. The predicate is evaluated ON THE REMOTE
# NODE; only a VERDICT (ok|too_short|charset|absent) and a LENGTH cross the wire. No
# value, and deliberately not even a leading prefix — guard-724/1563 mask by default,
# and nothing here needs one, so none is emitted. Proven by --self-test.
#
# SHAPES ARE MEASURED, NOT GUESSED — the guard-892 discipline ("check the name before
# checking the store") applied to values instead of names. Surveyed on cc-05
# 2026-08-09 with a derived-only probe: every credential was whitespace-free and each
# fell in exactly one of the two charset classes below. A guessed shape produces false
# DRIFT forever, which is the failure this whole file is written to avoid.
#   token       = ^[A-Za-z0-9_-]+$
#   token_punct = ^[A-Za-z0-9_./+=:-]+$   (base64-ish secrets carry / + =)
#
# min_len sits WELL BELOW each measured length so a vendor lengthening its key never
# trips it. No max_len and no required prefix, both deliberately omitted: each pins a
# vendor format that can change without warning, while the charset class alone already
# catches the incident class — error text contains spaces, and no class admits one.
# The comment after each entry is the length MEASURED on cc-05, not a requirement.
value_shape_expectations:
  ANTHROPIC_API_KEY:          {min_len: 32, charset: token}        # measured 108
  AWS_ACCESS_KEY_ID:          {min_len: 16, charset: token}        # measured 20
  AWS_SECRET_ACCESS_KEY:      {min_len: 32, charset: token_punct}  # measured 40
  MIND_AWS_ACCESS_KEY_ID:     {min_len: 16, charset: token}        # measured 20
  MIND_AWS_SECRET_ACCESS_KEY: {min_len: 32, charset: token_punct}  # measured 40
  OPENAI_API_KEY:             {min_len: 32, charset: token}        # measured 51
  GROQ_API_KEY:               {min_len: 32, charset: token}        # measured 56
  DEEPINFRA_API_KEY:          {min_len: 24, charset: token}        # measured 32
  ARC_API_KEY:                {min_len: 24, charset: token}        # measured 36
  AYO_OPERATOR_KEY:           {min_len: 24, charset: token}        # measured 35

# ── Toolchain floors ───────────────────────────────────────────────────────────
# node_major 22: the claude-code package declares engines >=22. Incident (3) was the
# fleet sitting on Node 20 under that floor. claude_min tracks incident (2), the
# fleet running 13 Claude Code versions behind.
toolchain:
  node_major_min: 22
  claude_min: "2.1.0"

# ── local-paths.conf shape ─────────────────────────────────────────────────────
# Key names only. AGENT_WRITE_PATH may be multi-root; the checker reports its
# ROOT COUNT and existence, never its contents.
required_paths_keys:
  - WORLD_PATH
  - META_PATH
  - AGENT_WRITE_PATH

# ── Deploy-key policy ──────────────────────────────────────────────────────────
# The read_only flag is read from the GitHub API and matched by PUBLIC KEY BODY,
# never by key title. Incident (4) — "echo/zeta/bravo stranded on read-only deploy
# keys" — is invisible to a title heuristic: as of 2026-07-25 zeta has TWO registered
# keys, `cc-02-zeta-readonly` (read_only=true) and `zeta-cc02-deploy` (read_only=false).
# Only matching the body of the key the box actually holds says which one is live.
deploy_key:
  repo: zkysar1/Ayoai-Mind
  require_write: true          # read_only=true on the live key is DRIFT

# ── Aggregate-unreachability escalation (g-115-3162) ───────────────────────────
# UNREACHABLE nodes deliberately do NOT set exit 1 on their own: one node behind a
# dropped tunnel is a blip, and failing the 12h sweep on a blip is the noise this
# checker was built to avoid. But that tolerance has no ceiling, so a TOTAL fleet
# blackout also exits 0 — measured 0 PASS / 0 DRIFT / 5 UNREACHABLE / rc=0. The
# sweep then measures nothing, files nothing, and reports success: a failed
# measurement counted as a passing one (guard-1091).
#
# The escalation is keyed on NON-SELF nodes because the self node is collected
# locally, so in a real blackout it still reports PASS/DRIFT while every peer goes
# UNREACHABLE — "all nodes unreachable" would be false exactly when the fleet is
# down. min_non_self_nodes keeps a small fleet from tripping on one blip: with a
# single peer, "100% of peers unreachable" IS the blip case.
blackout_escalation:
  enabled: true
  unreachable_fraction: 1.0    # share of non-self nodes UNREACHABLE to call it systemic
  min_non_self_nodes: 2        # below this, fraction is meaningless — tolerate

# ── The fleet ──────────────────────────────────────────────────────────────────
# addr: tailnet address. Verified reachable by plain `ssh root@<addr>` from cc-05 on
# 2026-07-25 for ALL five nodes — including foxtrot, whose tailnet node IS its WSL2
# instance, so it needs no `-i` key file and no `wsl` wrapper from a tailnet peer
# (that incantation in world/conventions/local-compute.md is the off-tailnet path).
nodes:
  - agent: alpha
    host: cc-04
    addr: 100.87.130.61
    shape: lxc
    user: root
    root: /opt/ayoai-mind
  - agent: bravo
    host: cc-05
    addr: 100.101.128.104
    shape: lxc
    user: root
    root: /opt/ayoai-mind
  - agent: echo
    host: cc-03
    addr: 100.96.167.28
    shape: lxc
    user: root
    root: /opt/ayoai-mind
  - agent: zeta
    host: cc-02
    addr: 100.86.98.9
    shape: lxc
    user: root
    root: /opt/ayoai-mind
  - agent: foxtrot
    host: LAPTOP-3IOFCNEO
    addr: 100.73.115.66
    shape: wsl2
    user: root
    root: /home/zkysa/ayoai-mind
    # foxtrot is a Windows laptop running WSL2 + tmux, NOT an lxc container, and its
    # framework root differs from the container nodes. MACHINE_ID is not expected to
    # equal `host` here (the containers self-name cc-0N; this box does not).
    machine_id_check: skip

  # ── Body boxes (added 2026-08-11, g-115-5434) ────────────────────────────────
  # Registered because _box_parity had been reporting both as LIVE-BOX-NOT-IN-MANIFEST
  # since 2026-08-09 — live Minds whose config drift no lane could see. EVERY field
  # below is MEASURED, not guessed: `bash core/scripts/fleet-config-parity.sh` collected
  # a full field set from both over ssh from cc-05, so `addr`/`user`/`shape` are proven
  # by a successful non-self collection and `root` by its own `root_exists: yes`. That
  # is the bar _box_parity's docstring sets — it warns against APPENDING GUESSED FIELDS
  # ("trades a visible gap for invisible wrong data"), not against registering a box you
  # have actually measured. Its separate argument — that a hand-maintained list will not
  # start being hand-maintained — is about the SYSTEMIC fix and still stands; these two
  # rows resolve the two boxes in front of us and do not claim to be that fix.
  # Both self-report MACHINE_ID == host (cc-07 / cc-08), so no machine_id_check skip.
  # BOTH ROWS BELOW ARE WORKER BODIES, AND THAT WILL LOOK LIKE DRIFT IF YOU MEASURE IT
  # WRONG. Their HEADs sit far ahead of origin/main and legitimately never merge into it:
  # measured 2026-08-11, cc-07 was 259 commits ahead and cc-08 114, both clean, both
  # still growing. That is BY DESIGN — `iteration-push.sh --push-worker-ref` (g-306-264)
  # pushes a worker Body's HEAD to refs/workers/<agent>/<sid> and STOPS, because "the
  # shared branch remains the reducer's alone". Both HEADs were confirmed present on
  # origin under exactly those refs, keyed by the same SIDs their body-heartbeat carriers
  # name. So `git rev-list --count origin/main..HEAD` is the WRONG INSTRUMENT here: it
  # measures distance from a branch a worker is designed never to reach, and reports a
  # healthy Body as having hundreds of stranded commits. Ask instead whether HEAD is
  # reachable from ANY origin ref (`git ls-remote origin 'refs/workers/*'`) — and note
  # `git ls-remote --heads` CANNOT see these, since refs/workers/* are not heads.
  - agent: alpha
    host: cc-07
    addr: 100.82.30.117
    shape: lxc
    user: root
    root: /opt/ayoai-mind
    # Resident agent PROVEN, not inferred from the tailnet name (guard-1574): exactly
    # one agent dir carries a local-paths.conf here, and it is alpha's. Corroborated
    # independently — g-115-5610 was filed from this box and self-describes as
    # "alpha WORKER BODY ON hostname cc-07".
  - host: cc-08
    addr: 100.103.147.2
    shape: lxc
    user: root
    root: /opt/ayoai-mind
    # DELIBERATELY HAS NO `agent` KEY — this box is fleet-agnostic, not alpha's.
    # Measured: ALL FIVE agents carry a local-paths.conf here (alpha + foxtrot both
    # initialized), its body-heartbeat carriers name TWO different agents (alpha
    # 2026-08-11, foxtrot 2026-08-07), and its tailnet name is un-prefixed. The control
    # that makes that distinctive: cc-05 has 1 conf, cc-04 has alpha's, cc-07 has 1.
    # Writing `agent: alpha` here would be exactly the invisible wrong data the note
    # above warns about. An absent key is the honest encoding AND the supported one —
    # _roster_parity builds its node set with `if n.get("agent")`, so an agent-less row
    # is skipped there by construction, while _box_parity keys on `host` alone and so
    # measures this box fully. `agent` is bound in _check_node but never used, so it
    # affects no comparison. Do not "fix" this by inventing a placeholder agent name:
    # a value that is not a live roster agent makes _roster_parity emit a permanent
    # INFO calling it a retired node, which is false and trains readers to skim INFO.
