# Store Hygiene Registry  ( KEYSTONE)
#
# Per-store bounding policy for append-only JSONL stores. Consumed by
# `core/scripts/jsonl_hygiene.py sweep` (and its `.sh` wrapper), which the
# recurring store-hygiene goal runs on a cadence.
#
# This file is the SINGLE SOURCE OF TRUTH for which stores get bounded and how.
# The  keystone ships the MECHANISM + this SCHEMA; the Tier-B goals
# (G5/G6/G8/G9/G11) each VERIFY their store's bound against real content +
# consumers, then flip `enabled: true`. Until then every entry is DISABLED, so
# nothing rotates and the keystone carries zero risk.
#
# ── Entry schema ────────────────────────────────────────────────────────────
#   path:           store path. Virtual prefixes resolved by jsonl_hygiene.py:
#                     world/...          -> $WORLD_DIR/...
#                     meta/...           -> $META_DIR/...
#                     agents/<name>/...  -> that agent's dir
#                     agents/*/...       -> glob across all agent dirs
#                   A '*' anywhere globs (e.g. world/board/*.jsonl).
#                   GLOB ARCHIVE-EXCLUSION INVARIANT (): a '*' glob
#                   NEVER matches an archive sink (<stem>-archive*.jsonl).
#                   Rotation MOVES records INTO <stem>-archive<suffix>; if the
#                   same glob re-matched that sink, the next sweep would rotate
#                   it into <stem>-archive-archive -- an unbounded
#                   archive-of-archive chain (observed 2026-06-26:
#                   coordination-archive-archive.jsonl). Enforced in
#                   jsonl_hygiene.py _glob_or_single. To deliberately bound ONE
#                   archive, give its EXPLICIT path (no '*') -- single-path
#                   targets still pass archives through.
#   enabled:        bool. Sweep SKIPS entries that are not enabled (default false
#                   via `defaults` below). An owner goal flips this to true.
#   mode:           cap | rotate
#                     cap    -> drop oldest beyond the bound (ATOMIC, no archive).
#                              For disposable telemetry (no recoverable value).
#                     rotate -> MOVE oldest beyond the bound into a sibling
#                              <stem>-archive<suffix> file, then drop from live.
#                              For logs whose history matters.
#   by:             lines | age
#                     lines  -> keep newest `max_lines` records.
#                     age    -> keep records whose `ts_field` is within
#                              `retention_days`; older are dropped/archived.
#                     guard-362: before an owner goal enables `by: age` on a
#                     store, it MUST enumerate the store's record classes and
#                     confirm age IS staleness (evict) and not age IS signal
#                     (protect) -- cadence trackers, resource locators, and
#                     config slots are "age IS signal" and an age policy would
#                     destroy their bookkeeping. gate-firings.jsonl (G5) uses
#                     by:age -- its 4 readers all window by time (--days), so
#                     age IS staleness; see its entry for the rate/window proof.
#   max_lines:      int (by=lines).
#   retention_days: int (by=age).
#   ts_field:       record field holding the ISO timestamp (by=age).
#   archive_path:   optional override for the rotate archive file.
#   owner_goal:     the Tier-B goal responsible for verifying + enabling this.
#
# NOT handled here: status-based PHYSICAL compaction of active knowledge stores
# (reasoning-bank / guardrails / pattern-signatures). That is  (G10),
# which is NOT in this keystone's collapse-set and needs a utility-aware policy.
#
# The bounds below are CONSERVATIVE PROPOSALS pending each owner goal's
# verification. Do not assume they are final.
#
# ── Archive sinks: bounded-by-design, NOT registry-rotated ( / G8) ────
# The archive files that rotate/compact MOVE records INTO (<stem>-archive.jsonl:
# world/aspirations-archive, world/pipeline-archive, agents/*/experience-archive,
# world/board/<channel>-archive) are deliberately NOT given their own registry
# entries. Two reasons:
#   1. They are COLD. The per-write-cost problem this whole system fights is on
#      HOT append paths (every append = a full-file locked R-M-W = an S3 GET+PUT
#      on own-cloud). Archive sinks are appended to ONLY during periodic
#      archival, so they do not carry that cost.
#   2. Most are TINY (verified 2026-06-26: aspirations-archive 296 lines,
#      pipeline-archive 305, per-agent experience-archive 25-248). Rotating them
#      is speculative carrying cost (implementation-discipline) and would only
#      deepen the archive chain.
# The ONE sink that grows non-trivially is world/board/coordination-archive.jsonl
# (~117 posts/day rotate IN; ~2.3MB / 5k lines as of 2026-06-26) -- the board is
# the one HOT-sourced store. It is still COLD on read (board.py reads the LIVE
# file only), so its growth is a slow append-cost drip, not a current problem.
# WHEN its measured append cost justifies action, bound it with an EXPLICIT-PATH
# age-cap entry (mode: cap, by: age on world/board/coordination-archive.jsonl
# directly -- the glob archive-exclusion lets a single explicit path through),
# after a guard-362 retention-semantics check. NEVER add a glob that would match
# archive sinks (the archive-of-archive defect  fixed).

version: 1

defaults:
  enabled: false        # must be explicitly enabled by the owner Tier-B goal
  mode: rotate
  by: lines

stores:
  # ── G5 (): age-cap meta/gate-firings.jsonl ─────────────────────────
  # Phase 1+5 gate telemetry. by:age (NOT lines): all 4 readers window by TIME
  # (gate-stats / gate-retirement-eval / override-ledger-consume /
  # team-contribution-report, each --days default 30); firing rate ~2486/day
  # makes a 10k-line cap retain only ~4 days -- far under the 30-day reader
  # window. retention_days:40 = 30d window + 33% margin (boundary + 24h cap
  # cadence-gap + occasional larger --days); bounds growth that is otherwise
  # unbounded (~50MB and climbing ~1MB/day). age IS staleness here (guard-362
  # pass -- no reader needs full history). Verified  (delta): readers +
  # rate (~3.2k/day over the window) + keystone cap+age path.
  - path: meta/gate-firings.jsonl
    enabled: true
    mode: cap
    by: age
    retention_days: 40
    ts_field: ts
    owner_goal: g-333-05

  # ── G6 (): world/changelog.jsonl rotation ──────────────────────────
  # Auto-appended audit trail of all world writes. History matters -> rotate.
  # ENABLED  (zeta, 2026-06-26): activation step. The machine-local
  # clobber gate (prior "machine-local -> blocked" reason) is RESOLVED -- 
  # added "changelog.jsonl" to owncloud_sync._EXCLUDE_NAMES (owncloud_sync.py:142),
  # so _is_machine_local classifies it machine-local -> refresh_would_clobber True
  # -> jsonl_hygiene._snapshot SKIPS refresh (no -class clobber of the
  # local-only 57MB file). Verified end-to-end (dry-run + apply, 2026-06-26):
  # 411147 -> newest 20000 live + 391147 archived to changelog-archive.jsonl
  # (recoverable); counts sum, no loss/dup; 4 pre-existing corrupt lines dropped
  # from the live window. rotate is archive-FIRST + front-equality
  # (jsonl_hygiene.py:404-417) so concurrent all-agent appends are preserved.
  # NOTE: rotating this HOT store (every locked world write appends) PREVIOUSLY
  # surfaced a "transient Phase-2 lock error" -- that was the append_changelog
  # self-deadlock: locked_modify_jsonl holds base_dir/changelog.lock across its RMW
  # then calls append_changelog(path) post-write, which re-acquired the SAME
  # non-reentrant lock when path==changelog.jsonl (10s acquire_lock timeout, cap
  # never persisted). FIXED in  via an early-return in append_changelog
  # (core/scripts/_fileops.py) that skips logging a changelog edit into the
  # changelog itself -- single-source fix for all 7 lock-holding call sites + this
  # rotate path. Cap/rotate on a changelog store no longer deadlocks (live-verified
  # 2026-07-04: world 24189->20000, meta 11970->10000, live_lock_attempts:1).
  - path: world/changelog.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 20000
    owner_goal: g-333-06

  # ── G7 (): cap/stop read-never meta/changelog.jsonl + history-save-telemetry.jsonl ──
  # Meta-write audit trail; read-never -> cap.
  # refresh_would_clobber guard (, owncloud_sync._EXCLUDE_NAMES) protects
  # both files from backend clobber during _snapshot. Enabled 2026-06-29 after
  # confirming  +  both complete and guard in codebase.
  - path: meta/changelog.jsonl
    enabled: true
    mode: cap
    by: lines
    max_lines: 10000
    owner_goal: g-333-07

  # Meta file-history save telemetry; written by _record_history_save_telemetry
  # in _fileops.py. No reader confirmed (grepped core/scripts, mind_api, .claude).
  # Also in owncloud_sync._EXCLUDE_NAMES -> refresh_would_clobber returns True.
  - path: meta/history-save-telemetry.jsonl
    enabled: true
    mode: cap
    by: lines
    max_lines: 10000
    owner_goal: g-333-07

  # ── G9 (): cap world/presence/<agent>.jsonl ────────────────────────
  # Per-agent presence ticks (one per Bash tool call). Disposable recency
  # telemetry -> cap (atomic, no archive). by:lines (NOT age): the sole reader
  # presence-read.sh is UNWIRED ("pending user-side hook activation" per
  # scripts-referenced-gate.py) -- no consumer with a fixed time-window need.
  # When activated it queries RECENCY (--since recent / --last N), needing the
  # freshest tail, which by:lines preserves -- so the rb-2391 line-cap-starvation
  # risk (a fixed-long-window reader, like gate-firings' 30d analysis) does NOT
  # apply here. max_lines:500 confirmed safe: bounds the 6 files from ~16MB
  # (delta alone 14816 lines / 2.4MB over 25d) to ~480KB total while keeping the
  # newest 500 ticks (a generous recency window). Verified  (delta):
  # reader-unwired + disposable + recency-semantics (no speculative cap bump --
  # implementation-discipline).
  - path: world/presence/*.jsonl
    enabled: true
    mode: cap
    by: lines
    max_lines: 500
    owner_goal: g-333-09

  # ── G10 (): physical compaction of active knowledge stores ─────────
  # reasoning-bank / guardrails / pattern-signatures use LOGICAL-only retirement
  # (status flip in-place); retired/superseded records accumulate in the
  # active-scan file forever (the G1/A2 cached-scan target never shrinks).
  # mode=compact MOVES status in {retired,superseded} records OLDER than
  # grace_days into <stem>-archive.jsonl (recoverable), keeping the cached active
  # file small. AGE-GRACE (30d) preserves the recent-retire window: guardrails
  # grace on retirement_date (precise -- guardrail_retire.restore reads retired
  # records from the LIVE file); reasoning-bank / pattern-signatures fall back to
  # created. Verified DRY-RUN (2026-06-26): would archive rb 112/125, guard
  # 80/82, sig 2/2 non-active; all active records (rb 2209, guard 633, sig 21)
  # untouched. valid_to is unused across these stores so no live bitemporal
  # reader depends on retired-in-place; retrieval already excludes retired.
  # ENABLED  (2026-06-26): activation step. Two gates cleared before the
  # flip: (1) the test-safety blocker is resolved () --
  # test_sweep_shipped_registry_dry_run_is_safe runs the shipped-registry sweep
  # with apply=False (its SAFE set includes would-compact), so enabling here no
  # longer compacts real stores during test runs; (2) guard-881 -- all three
  # verified NOT machine-local per owncloud_sync._is_machine_local (basename not
  # in _EXCLUDE_NAMES, no *-log.jsonl match), so jsonl_hygiene._snapshot's
  # unconditional refresh pulls authoritative S3, no clobber (contrast G6/G7
  # changelog, machine-local -> blocked). Retired records age >=30d move to
  # <stem>-archive.jsonl (recoverable); retrieval already excludes retired so
  # partner reads are unaffected.  (mechanism),  (activation).
  - path: world/reasoning-bank.jsonl
    enabled: true
    mode: compact
    grace_days: 30
    owner_goal: g-333-10
  - path: world/guardrails.jsonl
    enabled: true
    mode: compact
    grace_days: 30
    ts_field: retirement_date
    owner_goal: g-333-10
  - path: world/pattern-signatures.jsonl
    enabled: true
    mode: compact
    grace_days: 30
    owner_goal: g-333-10

  # ── G11 (): journal / evolution-log / skill-evolution / board ──────
  # Append-only logs whose history matters -> rotate.
  # ENABLED  (delta, 2026-06-26). All 4 verified NOT machine-local per
  # owncloud_sync._is_machine_local: journal.jsonl not under session/; meta/
  # evolution-log.jsonl is meta-prefix so the world-scoped *-log.jsonl exclusion
  # (owncloud_sync.py:170) does NOT apply (its own comment confirms it syncs);
  # skill-evolution.jsonl ends -evolution.jsonl not -log.jsonl; board basenames
  # (coordination/general/findings/decisions/...) none end -log.jsonl. So the
  # jsonl_hygiene _snapshot UNCONDITIONAL refresh pulls correct S3 (no 
  # clobber) -- G11 is INDEPENDENT of the in-flight  _snapshot fix
  # (contrast G7 changelog/G6 world-changelog which ARE machine-local -> blocked).
  # Bounds verified vs real content (2026-06-26): journal max 222 lines/agent
  # (<< 5000 no-op), evolution-log 2068 (<< 10000 no-op), skill-evolution 2174
  # (<< 5000 no-op); board: only coordination.jsonl over bound (10668 -> rotate
  # to newest 5000 ~= 43d @ ~117 lines/day). Consumer board.py reads the LIVE
  # file only (no archive read) -- cooldown scans need hours not weeks so 43d
  # covers operational need; older posts archived (coordination-archive.jsonl)
  # not deleted. rotate uses locked_modify_jsonl + front-equality so concurrent
  # multi-agent board appends are preserved (guard-364/guard-832 safe).
  - path: agents/*/journal.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 5000
    owner_goal: g-333-11

  - path: meta/evolution-log.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 10000
    owner_goal: g-333-11

  - path: world/skill-evolution.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 5000
    owner_goal: g-333-11

  - path: world/board/*.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 5000
    owner_goal: g-333-11

  # ── : byte-derived caps for the DENSE board channels ──────────────
  # The glob above caps every channel at 5000 LINES, but the write cost is BYTES
  # (each post re-PUTs the whole object), and line density is a property of each
  # channel's purpose, so one line cap is unevenly loose (guard-5993).
  # MEASURED 2026-09-16 (bravo, hostname cc-05, uname -r 6.8.0-139-generic;
  # local-mirror wc for density, board-read 7d counts for rate):
  #   coordination    871 B/line  613 posts/day  5000 lines =  4.36 MB (glob)
  #   general       1,054 B/line   11 posts/day  5000 lines =  5.27 MB (glob)
  #   reasoning     1,458 B/line   11 posts/day  5000 lines =  7.29 MB (glob; ~1y to cap)
  #   decisions     2,049 B/line   17 posts/day  5000 lines = 10.2 MB -> 2700 = 5.53 MB
  #   findings      1,970 B/line  211 posts/day  5000 lines =  9.85 MB (derived 2800 = 5.52 MB, HELD)
  # decisions at 2700 keeps ~159 days live, past the 720h grant scan.
  #
  # findings is NO LONGER HELD. The hold above was ARITHMETIC -- an EMPTY SET
  # between OUT 3 (<= ~1.3x coordination at-cap) and OUT 4 (the 30d reader stays
  # covered) -- and it was empty ONLY because reachable bytes were live-at-cap
  # plus a FIXED 4 MiB archive tail.  removed that fixed term: the tail
  # now STEPS BACK with the requested window under a ceiling of
  # _ARCHIVE_TAIL_BYTES_DEFAULT * _ARCHIVE_TAIL_MAX_STEPS = 32 MiB
  # (mind_api/src/endpoints/board.py:73-74, verified present at the origin/main
  # blob; d7d3d544d0 is an ancestor of origin/main). Reader reach is therefore no
  # longer a function of the live cap until the ceiling binds, and the empty set
  # closes. NOT a hand-raised BOARD_ARCHIVE_TAIL_BYTES (guard-3560).
  #
  # RE-MEASURED 2026-09-17 (echo, hostname cc-03, uname -r 6.8.0-139-generic) on
  # the STORE OF RECORD via backend-cat.sh, with reader reach read through
  # board-read.sh itself rather than simulated, on a daemon started 03:30:16 --
  # i.e. AFTER d7d3d544d0 (02:02:32), which is the precondition for the reach
  # numbers below being about the extending tail at all (guard-6874):
  #   findings      5,434 lines / 10,766,122 B = 1,981 B/line
  #   coordination  5,082 lines /  4,422,955 B =   870 B/line   (spread 2.277x)
  #   decisions       850 lines /  1,742,970 B = 2,050 B/line
  #   reasoning     1,208 lines /  1,768,841 B = 1,464 B/line
  #   general       1,663 lines /  1,751,334 B = 1,053 B/line
  # OUT 3: coordination at 5000 = 4.35 MB, so the 1.3x bar allows findings
  #   max_lines <= 2,854. At 2,800 findings is 5.55 MB = 1.275x. PASSES.
  # OUT 4: reader reach TODAY, measured not modelled --
  #   --since 30d -> 6,867 rec / 13,686,047 B / oldest 2026-08-18 = 30.0d
  #   --since 60d -> 11,890 rec / 26,492,526 B / oldest 2026-07-19 = 60.0d
  #   --since 90d -> 13,394 rec / 28,518,691 B / oldest 2026-06-19 = 90.0d
  #   Lowering the live cap moves records from live to archive; it does not
  #   delete them, and the same window costs the same bytes either way. At
  #   cap 2,800 (live 5,546,800 B) the ARCHIVE must supply 7.8 MiB for 30d,
  #   20.0 MiB for 60d, 21.9 MiB for 90d -- all under the 32 MiB ceiling.
  #   POSITIVE CONTROL that the tail really walks that deep on this box, rather
  #   than arithmetic alone: coordination --since 60d returned 31,131,640 B
  #   against a 4,422,955 B live file, i.e. ~26.7 MB served from the archive --
  #   deeper than the 21.9 MiB findings needs at 2,800. PASSES.
  # Consumers whose windows this protects: fresh-eyes-review 2.3b (30d) and
  # fresh-eyes-program 2.6b (60d). Both covered at 2,800.
  #
  # BOX CAVEAT, do not inherit these windows (guard-6879): the reach above holds
  # on a daemon running d7d3d544d0 or later. A box that has pulled but not yet
  # restarted its daemon still holds the pre- module and sees the fixed
  # 4 MiB tail, where cap 2,800 gives a 30d reader ~21.4d until it restarts. The
  # exposure is daemon-restart lag, not an open-ended regression: this config and
  # that code travel in the SAME repo, so a box rotating findings at 2,800 is by
  # construction a box that already has the extending-tail code on disk.
  #
  # Also, rotation did not hold on board channels:  measured 858 records
  # in both the live file and the archive. The union-merge half of that is now
  # closed (): world/board/*.jsonl resolve to merge_rotated_board_jsonl,
  # which removes a rotated-out slice instead of merging it back. A rotation
  # whose live drop FAILS after its archive append still leaves the same
  # both-places signature, so a live/archive overlap is not by itself proof of
  # a merge (guard-6871: a zero live/archive intersection is ambiguous too).
  # sweep() applies EVERY matching entry in turn, so the tightest cap wins in any
  # order, and an explicit cap looser than the glob's 5000 does nothing.
  # Re-measure before retuning; rates drift (coordination was ~117 posts/day in the
  # 2026-06-26 note above).
  - path: world/board/decisions.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 2700
    owner_goal: g-358-66

  # 2,800 is BYTE-DERIVED, not a round number: 5,546,800 B at 1,981 B/line =
  # 1.275x coordination's 4.35 MB at the glob's 5000, just inside the 1.3x bar.
  # Re-derive it from a fresh density before retuning -- density is a property of
  # what the channel is FOR (long analysis writeups), so it drifts with usage,
  # and the whole point of this entry is that the cap tracks BYTES, which is what
  # own-cloud re-PUTs and egress actually charge for.
  - path: world/board/findings.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 2800
    owner_goal: g-358-66

  # ── : the six recheck / auto-close sweep metrics logs ────────────
  # guard-586 violation, all six: neither of its two named branches is present
  # (no cleanup-stale-bindings.sh entry, no inline rotation at write time), and
  # they were absent from THIS registry too -- the third mechanism the guardrail
  # text does not name. Checked all three before building anything.
  # MEASURED 2026-08-29 (alpha worker Body, hostname cc-08, uname -r
  # 6.8.0-137-generic, own-cloud): 37,637 lines / 6,508,511 B across the six,
  # oldest record 2026-04-23. At filing (bravo, cc-05, 2026-08-11) it was 28,177
  # lines / 4,804,328 B -- +33% lines in 18 days, ~525 lines/day family-wide, so
  # the growth is live and compounding. Per file 47-75 lines/day.
  #
  # rotate, NOT cap -- the filing goal's "nothing reads them" premise is STALE.
  # core/scripts/sweep-mutation-surface.py (added AFTER this goal was filed; its
  # SWEEP_LOGS map cites  and a 2026-08-16 measurement) opens with
  # "This is the missing CONSUMER. It reads the EXISTING per-sweep metrics logs"
  # and reads THREE of the six (parent-supersession, unblock-parent-status,
  # routing-audit-target). History also carries the lifetime action-rate signal
  # the goal itself names as the strongest dead-sweep detector -- one of these
  # wrote 3,346 run records and cleared ZERO items across its whole life, which
  # was discoverable only by hand. cap would destroy exactly that signal;
  # rotate keeps it recoverable in the -archive sibling (guard-3523 covers
  # computing lifetime rates across live + archive: dedup by id, live wins).
  #
  # by: lines, NOT age -- guard-362 requires enumerating record classes and
  # proving age IS staleness before an owner goal may enable by:age. lines needs
  # no such proof, and lines/bytes is the axis the violation is stated in.
  #
  # max_lines 2000 -> MEASURED live windows after the first rotation (do not
  # re-derive these from the lifetime average, which understates the recent
  # rate ~2.5x): credential-defer 27d, parent-supersession 27d,
  # unblock-parent-status 26d, routing-audit 26d, precondition-defer 12d,
  # defer-recheck 11d. The two defer-recheck lanes run ~170 lines/day now
  # against a 47-75/day lifetime mean, so they hold the shortest window --
  # and neither is read by the consumer below. The three that ARE read
  # retain 26-27 days.
  # CONSUMER SAFETY: sweep-mutation-surface._collect_new_mutations selects
  # `timestamp > watermark` with a 24h first-run lookback -- its need is HOURS,
  # the bound is WEEKS, so the live window cannot starve it. Its own comment
  # already notes "these logs grow unboundedly"; it read_text()s the whole file
  # on every precheck run, so bounding these also removes an unbounded hot-path
  # read (guard-875 class).
  #
  # THE CAP-WIRED-LATER HAZARD IS CLEARED, verified not assumed ():
  # merge_append_only_jsonl sorts by _log_ts, and "keep newest" is only correct
  # if that lookup resolves. All six carry a _LOG_TS_FIELDS member -- `timestamp`
  # (five) and `ts` (credential-defer-recheck) -- so the merged log stays
  # chronological and rotation trims the right end.
  # SYNCED + UNION-MERGED IS NOT NOVEL HERE: all six are merge_append_only_jsonl
  # and none is machine-local, which is byte-for-byte the shape of the already
  # enabled meta/gate-firings.jsonl and meta/evolution-log.jsonl entries above.
  # NOT a retirement change: guard-2092 / the goal's own constraint -- the low
  # action rates are NOT evidence any sweep is broken, and nothing here
  # deprioritizes or lengthens any of them. Scope is rotation only.
  - path: world/defer-recheck-metrics.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 2000
    owner_goal: g-115-5860

  - path: world/precondition-defer-recheck-metrics.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 2000
    owner_goal: g-115-5860

  - path: world/credential-defer-recheck-metrics.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 2000
    owner_goal: g-115-5860

  - path: world/parent-supersession-sweep-metrics.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 2000
    owner_goal: g-115-5860

  - path: world/unblock-parent-status-sweep-metrics.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 2000
    owner_goal: g-115-5860

  - path: world/routing-audit-target-status-sweep-metrics.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 2000
    owner_goal: g-115-5860

  # ── : world/script-evolution.jsonl — the unregistered sibling ──────
  # OMISSION, not policy: world/skill-evolution.jsonl (G11 above) is registered
  # rotate/lines/5000 while its structurally identical sibling was in no entry
  # at all. Same writer family (evolution-record.py --kind script_edit ->
  # _STREAM_FILENAME), and merge_handler_for resolves BOTH to
  # merge_evolution_stream (SSOT classifier, not a grep guess).
  #
  # MEASURED 2026-09-05 (alpha worker Body, hostname cc-09, uname -r
  # 6.8.0-138-generic, own-cloud). guard-5201 positive control against zeta's
  # cc-02 numbers of 2026-09-04 (13,167 lines / 13,361,870 B): this box reads
  # 13,337 / 13,536,747 -- +170 lines / +174,877 B in ~1 day, i.e. the same
  # store still growing at the rate the filing measured. Control PASSES.
  #
  # guard-5993 (cap dimension): the COST is BYTES, the CAP is LINES, so the
  # real bound is cap x density, and the conversion is done here rather than
  # assumed. Density measured on this box is 1,014 B/line (zeta's 1,015 B avg
  # record agrees to 0.1%), so max_lines 5000 bounds this store at 5,070,000 B
  # = 4.84 MiB against today's 13,536,747 B = 12.91 MiB. The filing's
  # "12.74 MiB -> ~4.8 MiB, ~62%" is therefore CONFIRMED, not corrected -- it
  # was already derived from THIS store's density. Cut = 1 - 5000/13337 =
  # 62.5% of per-PUT bytes, plus the same cut on the reconcile-pull egress
  # fan-out. State the unit: MiB and MB differ by 4.9% at this size and mixing
  # them turns 62.5% into a plausible-looking 61%.
  # WHAT guard-5993 DOES FLAG, kept because it is easy to re-derive wrongly:
  # the sibling entry carries the SAME max_lines 5000 at 1,530 B/line, so one
  # cap value yields TWO byte bounds -- 4.84 MiB here, 7.30 MiB there, 1.51x
  # looser. Not fixed here (one store per goal), and not fixable by a value
  # edit anyway: jsonl_hygiene implements only by=lines and by=age, so no
  # byte-dimension cap exists for a registry entry to name.
  #
  # ENABLED IMMEDIATELY -- the three gates the header requires all pass, and
  # each was measured this pass rather than inherited:
  #   guard-881 (machine-local): owncloud_sync._is_machine_local(
  #     "script-evolution.jsonl", "world") -> False, so jsonl_hygiene._snapshot's
  #     unconditional refresh pulls authoritative S3 and cannot clobber. Same
  #     reading as the sibling; contrast changelog.jsonl -> True.
  #   CONSUMER RETENTION: the lifecycle consumer is evolution-stub-expiry.py
  #     (iteration-close maintenance tick, --threshold-hours 24). A dry-run of
  #     the script stream reads 213 awaiting_completion of which exactly 1 is
  #     over the 24h deadline, and ALL 213 sit inside the newest 5,000. That is
  #     structural, not luck: the newest 5,000 span 2026-08-09 -> 2026-09-05
  #     (27 days) at ~170 rows/day, so the live window exceeds the sweep's need
  #     by ~27x. Zero rows carry an unparseable ts (the never-expirable case).
  #     evolution-complete.py finalizes stubs on the same live window.
  #   REVISION CHAIN (the filing's named REAL RISK -- archiving an ancestor
  #     could orphan a previous_revision_id pointer): measured, and it is
  #     bounded. NOTHING RESOLVES THOSE POINTERS -- the only readers of
  #     previous_revision_id WRITE it (evolution-git-sweep.py,
  #     evolution-record.py, via _evolution_chain.chain_index) or print one
  #     carried in a different store (meta-backpressure.py); no consumer walks
  #     an ancestor up in this stream. The live effect of the cut is that a
  #     NEW row for a file whose whole history was archived records
  #     previous_revision_id: null -- 976 of 2,058 distinct file_paths are in
  #     that state, and 404 more have a kept head whose ancestor moves to the
  #     archive. Set against the baseline: 98.1% of all rows and 95.0% of the
  #     KEPT rows ALREADY carry a null pointer (the  defect
  #     _evolution_chain.py was built to stop RE-creating, not to backfill), so
  #     rotation widens a dominant pre-existing state rather than opening a new
  #     failure class. Recoverable either way: the ancestors are in the archive.
  #
  # THE ARCHIVE SINK IS REGISTERED IN THE SAME COMMIT and that pairing is
  # load-bearing (guard-1055): this store is 2.7x over bound, so unlike the
  # sibling (3,126 lines, its entry a no-op) it rotates on the FIRST sweep and
  # CREATES world/script-evolution-archive.jsonl -- a new shared own-cloud store
  # that write-FREEZES on S3 if merge_handler_for returns None for it. It
  # resolved None before this change. Both files are git-tracked framework, so a
  # box has the entry and the handler together or neither; a box on older code
  # falls to `defaults.enabled: false` and skips.
  - path: world/script-evolution.jsonl
    enabled: true
    mode: rotate
    by: lines
    max_lines: 5000
    owner_goal: g-358-64
