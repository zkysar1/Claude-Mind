# Memory Tree Configuration — Framework Definition
# Based on Random Tree Model (Zhong et al., PRL 2025)
# Immutable tree rules. Agent state lives in world/knowledge/tree/_tree.yaml
# Boot reads initial_state to seed state file on first run.

# --- FRAMEWORK ---

config:
  K_max: 4
  D_max: 20
  D_retrieval: 4
  split_threshold: 3
  merge_threshold: 1
  min_articles_per_child: 2
  decompose_threshold: 80               # line count triggering DECOMPOSE of monolith files
  max_decompose_per_invocation: 50     # max DECOMPOSE ops per /tree maintain run (raised 30→50 at config ceiling 2026-04-18 to match framework-expansion growth rate, g-115-79)
  max_redistribute_per_invocation: 5   # max REDISTRIBUTE ops per /tree maintain run
  compression_ratio_formula: "10 * 1.5^(depth - 2)"  # target compression at each depth
  growth_approval:
    L1_new_domain: auto
    L2_and_deeper: auto

pruning:
  distill_utility_threshold: 0.3          # utility_ratio below this triggers DISTILL
  distill_min_retrievals: 5               # minimum retrievals before DISTILL eligible
  distill_line_threshold: 50              # line count threshold for large-but-mediocre nodes
  distill_line_utility_threshold: 0.5     # utility threshold for line-count-based DISTILL
  # crit3 (0): proactive trigger for append-grown recurring-sweep nodes.
  # Fires DISTILL before a node trips the Read ~25k-token cap (which forces a
  # read-before-edit re-read on every sweep), reusing the rb-2085 procedure.
  # STRUCTURAL — keyed on size + append-grown shape, NOT utility/feedback, so it
  # catches the HIGH-utility sweep nodes crit2's noisy line-count heuristic misses.
  distill_token_cap: 25000                # Read tool ~25k-token cap (token-size estimate = chars // 4)
  distill_token_ratio: 0.8                # crit3 fires at this fraction of distill_token_cap (proactive headroom)
  distill_refresh_min_sections: 3         # append-grown signature: >= N dated "Refresh"/"Verified Values" headings
  max_distill_per_invocation: 10          # max DISTILL ops per /tree maintain run (raised 5→10 at config ceiling 2026-04-18 for backlog drain, g-115-79)
  retire_sessions_unused: 5              # sessions with 0 retrievals before RETIRE eligible
  retire_noise_threshold: 0.1            # utility below this with 10+ retrievals = actively harmful
  retire_noise_min_retrievals: 10
  prune_stub_line_threshold: 10          # PRUNE/RETIRE empty-stub gate: a leaf with article_count==0 (PRUNE) or retrieval_count==0 (RETIRE) is a true empty/dead stub ONLY when its .md body has fewer than this many non-blank lines (excl. YAML front matter). article_count counts ATTACHED ARTICLES, not body content — content-bearing nodes (body >= threshold) hold real knowledge and must NOT be auto-pruned/retired (g-115-1534; zeta exp-g-115-1367 "article_count=0 is NORMAL"). g-115-398 flagged 25 content-bearing nodes (13-86 body lines); 10 cleanly separates stubs from content.

# Three-tier maintenance budget — read this section top to bottom for the full
# picture. The standard caps in `config:` above are the daily ceiling.
# `maintenance.backlog_mode_trigger` (above) raises the caps × 1.5 (ceil)
# when debt accumulates. `stop_mode_caps` (below) is the OPPOSITE: a small
# fixed budget for /stop so structural debt drains incrementally without
# making every stop slow. Tier relationship: standard 50 / backlog 75 / stop 5.
#
# Why this tier exists ( family — Magic Wand #4): pre-2026-05-08,
# stop_mode skipped /tree maintain entirely under tight context. Decompose
# candidates accumulated for weeks. The fix isn't "skip more to save time" —
# it's "do a small budget per stop so the queue drains over many stops."
# Sibling principle: pending-questions sweep (Lane B), structural-progress
# axis (Lane D #1). All three follow the meta-rule:
# `core/config/modes/autonomous.md` → "Stop-mode does work."
stop_mode_caps:
  max_decompose_per_invocation: 5       # ~20% of typical 24-candidate standing queue → drains in 5 stops
  max_redistribute_per_invocation: 1    # rare op (typically 0-2 candidates); 1 is sufficient
  max_distill_per_invocation: 2         # one or two utility-low or oversized leaves per stop
  max_split_per_invocation: 1           # straggler handler
  max_sprout_per_invocation: 0          # do NOT create new structural debt during /stop
  max_merge_per_invocation: 1           # straggler handler
  max_prune_per_invocation: 1           # straggler handler
  max_retire_per_invocation: 1          # straggler handler
  # Wall-clock budget: 5 decomposes × ~5-10s LLM each + 2 distills + a few
  # single-ops ≈ 45-90s of /tree maintain inside /stop. /stop overall stays
  # under 3 min on the FAST consolidation path.

# Pre-create duplicate gate (Phase 2 of cognitive-core curation plan).
# Every write path (/tree add, state-update Step 8 encoding, reflect-tree-update,
# research-topic sprout, /tree maintain SPROUT) calls tree-dedup-check.py before
# creating a new child. Stops "breadth without depth" accumulation.
dedup:
  sibling_overlap_threshold: 0.6          # Jaccard over distinctive tokens; overlap >= this = reject
  min_tokens_for_overlap: 3               # skip check when either summary tokenizes to fewer than N
  enforce_from_depth: 2                   # don't block L1 growth (keeps top-level flexibility)

# Utility-weighted retrieval ranking (Phase 1.5 of cognitive-core curation plan).
# Reweights base match score by each node's utility_ratio: effective = base * clamp(0.5 + utility_ratio, min, max).
# Proven-helpful nodes outrank zero-utility ones; bad nodes stop being selected →
# retrieval_count stops climbing → existing RETIRE rule (retrieval_count == 0 for N sessions) fires naturally.
retrieval:
  utility_weight_min: 0.5                       # floor on reweight (zero-utility cap)
  utility_weight_max: 1.5                       # ceiling (proven-helpful cap)
  utility_weight_neutral_below_retrievals: 5    # nodes below this retrieval_count get weight 1.0
  # Poignancy blend (, BRD Gap 1a; Generative Agents 2304.03442). A
  # third multiplicative factor on the effective score, mapping a record's
  # poignancy (1-10, LLM-rated at write) into [poignancy_weight_min,
  # poignancy_weight_max]. DEFAULT OFF — when disabled the factor is 1.0 for
  # every record, so retrieval ranking is byte-identical to pre-.
  # Boost-only by construction: poignancy_weight_min is 1.0, so the factor is
  # >= 1.0 always. The blend can only PROMOTE high-poignancy records, never
  # demote anything below its current effective score — this structurally
  # satisfies the "no known-good knowledge hidden" A/B criterion. Null/absent
  # poignancy maps to 1.0 (neutral), so legacy records are null-safe with no
  # backfill. Enable + A/B before trusting in production.
  poignancy_blend_enabled: false                # master flag — false = current behavior
  poignancy_weight_min: 1.0                      # factor at poignancy=1 (and null→neutral)
  poignancy_weight_max: 1.5                      # factor at poignancy=10

# Scheduled tree debt check (Phase 4 of cognitive-core curation plan).
# Runs every N goals in the aspirations loop; invokes /tree maintain when
# distill/retire candidate count exceeds the threshold. Lowers reliance on
# session-end consolidation being the only curation trigger.
tree_debt_check:
  interval_goals: 3          # run every N completed goals per session
  debt_threshold: 40         # distill_candidates above this triggers cleanup; ×3 (=120) is the decompose critical threshold in iteration-close.sh. Raised 20→40 (g-001-187, rb-290): at depth 5-7, many 80-113 line leaves are coherent concepts that cannot be meaningfully split. After iter 78 two consecutive backlog drains saw 0/5 decomposes actionable — the signal was noise. 40 keeps genuine monolithic nodes (e.g. 180+ lines flat at shallow depth) detectable while silencing coherent-concept false positives.
  force_maintain_cooldown_hours: 1.0   # min hours between force_tree_maintain re-emits (g-115-82, rb-280 — prevents signal starving goal progress when backlog drains slower than one-iter cadence)

# Backlog-mode trigger for /tree maintain. When EITHER threshold is met, the
# maintenance pass should escalate from standard caps to elevated caps
# (--backlog mode). Single source of truth — consumed by  (recurring
# tree maintenance sweep). Update HERE rather than editing goal-description prose.
maintenance:
  backlog_mode_trigger:
    min_decompose_candidates: 5    # decompose-candidates count >= this → use --backlog
    min_days_since_clear: 7        # days since last_backlog_clear_at >= this → use --backlog

# Capability-aware child limits (Phase 3 of cognitive-core curation plan).
# Parents at early capability levels should cap children low so depth is
# forced before breadth; mature EXPLOIT/MASTER parents get the full K_soft.
# Originally shipped in `warn` so 2-3 sessions of real data could inform the
# caps. Flipped to `block` in  after shadow data confirmed the caps
# (EXPLORE:2, CALIBRATE:4, EXPLOIT/MASTER:8) match real growth patterns.
# 2026-05-09 user-directed retune: caps bumped to the configured ceiling
# (EXPLOIT/MASTER 8→16, CALIBRATE 4→8) and mode reverted to `warn` to remove
# write-time override ceremony while preserving the structural-fix signal.
# Real distribution at retune time: 6 of 975 nodes over the 8-cap (0.6%);
# under the new caps, only domain-intelligence (CALIBRATE, 15) is over-cap and
# IS a genuine junk drawer worth flagging via warn. EXPLORE stays at 2 —
# early-stage parents should still genuinely deepen first.
# Mode values: warn | block | off. Warn mode: log [child-limit] WARN to
# stderr and allow the write (no debt entry, no exit). Block mode:
# tree-update.sh --add-child exits 6 on cap violations unless
# --accept-overflow '<justification>' is passed, which writes a tree-debt
# entry to world/tree-debt.jsonl.
child_limits:
  mode: warn
  EXPLORE: 2                 # force depth inside parent first
  CALIBRATE: 8
  EXPLOIT: 16
  MASTER: 16

domain_health:
  weights:
    capability: 0.50
    coverage: 0.25
    confidence: 0.25
  min_data_threshold: 2    # minimum leaves with data to compute health
  # Must match capability_level values used in tree nodes (from developmental-stage.yaml)
  competence_mapping:
    EXPLORE: 0.25
    CALIBRATE: 0.50
    EXPLOIT: 0.75
    MASTER: 1.00

# Bounds for self-tuning. Each 'default' MUST match the actual config value above.
modifiable:
  K_max: {min: 3, max: 6, default: 4}
  D_max: {min: 4, max: 20, default: 20}
  D_retrieval: {min: 3, max: 20, default: 4}
  split_threshold: {min: 3, max: 10, default: 3}
  merge_threshold: {min: 1, max: 3, default: 1}
  min_articles_per_child: {min: 1, max: 4, default: 2}
  decompose_threshold: {min: 50, max: 300, default: 80}
  max_decompose_per_invocation: {min: 1, max: 50, default: 30}
  max_redistribute_per_invocation: {min: 1, max: 10, default: 5}
  max_entities: {min: 50, max: 500, default: 200}
  domain_health_capability_weight: {min: 0.20, max: 0.80, default: 0.50}
  domain_health_coverage_weight: {min: 0.10, max: 0.50, default: 0.25}
  domain_health_confidence_weight: {min: 0.10, max: 0.50, default: 0.25}
  domain_health_min_data_threshold: {min: 1, max: 5, default: 2}
  distill_utility_threshold: {min: 0.1, max: 0.5, default: 0.3}
  distill_min_retrievals: {min: 3, max: 10, default: 5}
  max_distill_per_invocation: {min: 1, max: 10, default: 5}
  retire_sessions_unused: {min: 3, max: 10, default: 5}
  prune_stub_line_threshold: {min: 3, max: 12, default: 10}   # max capped at 12 (< the 13-line smallest g-115-398 content node) so self-tuning can never re-flag a known content-bearing node
  dedup_sibling_overlap_threshold: {min: 0.3, max: 0.9, default: 0.6}
  dedup_min_tokens_for_overlap: {min: 2, max: 8, default: 3}
  dedup_enforce_from_depth: {min: 1, max: 5, default: 2}
  # Phase 1.5 — utility-weighted retrieval ranking.
  # min floor: 0.1 (near-zero weight crushes all match-score signal for bad nodes;
  # leave some daylight so evolve can explore). max ceiling: 2.5 (beyond ~1.5 the
  # utility weight starts drowning the base relevance signal).
  retrieval_utility_weight_min: {min: 0.1, max: 0.9, default: 0.5}
  retrieval_utility_weight_max: {min: 1.0, max: 2.5, default: 1.5}
  retrieval_utility_weight_neutral_below_retrievals: {min: 2, max: 20, default: 5}
  # Phase 4 — scheduled tree debt check.
  tree_debt_check_interval_goals: {min: 1, max: 10, default: 3}
  tree_debt_check_debt_threshold: {min: 5, max: 100, default: 20}
  # Backlog-mode trigger — see `maintenance.backlog_mode_trigger` above.
  maintenance_backlog_min_decompose_candidates: {min: 1, max: 50, default: 5}
  maintenance_backlog_min_days_since_clear: {min: 1, max: 30, default: 7}
  # Phase 3 — capability-aware child limits. mode excluded (enum, not numeric).
  # 2026-05-09 retune: defaults raised to ceiling for EXPLOIT/MASTER/CALIBRATE
  # (see child_limits block above for rationale). Defaults must match active values.
  child_limits_explore: {min: 1, max: 4, default: 2}
  child_limits_calibrate: {min: 2, max: 8, default: 8}
  child_limits_exploit: {min: 4, max: 16, default: 16}
  child_limits_master: {min: 4, max: 16, default: 16}

# Entity cross-link index configuration (HindSight-inspired)
entity_index:
  max_entities: 200
  extract_during:
    - research-topic   # Step 3: extract from tree node findings
    - reflect          # Step 7.5b: extract from ABC chains
  entity_types: [person, organization, concept, metric, event]

# L1 domains — the fundamental branches every agent starts with.
# Phase 2 of tree-taxonomy review (S8): l1_domains is MODIFIABLE via the
# user-approval gate. See `structural_modifiable.l1_domains` below for the
# allowed-changes scope and `core/config/conventions/l1-taxonomy-changes.md`
# for the apply protocol.
l1_domains:
  - key: execution
    file: world/knowledge/tree/execution.md
    summary: "What to DO — strategies and methods for taking action"
  - key: intelligence
    file: world/knowledge/tree/intelligence.md
    summary: "What we KNOW — domain knowledge and understanding"
  - key: performance
    file: world/knowledge/tree/performance.md
    summary: "How we're DOING — outcome tracking and accuracy analysis"
  - key: system
    file: world/knowledge/tree/system.md
    summary: "HOW we work — meta-knowledge about the agent's own operation"

# --- STRUCTURAL MODIFIABLE (S8 — user-approval-gated taxonomy changes) ---
# Separate from `modifiable:` because these changes are NOT numeric param
# tuning — they alter categorical structure. Evolution engine can PROPOSE
# changes via pending-question; user approves before any apply script runs.
# See `core/config/conventions/l1-taxonomy-changes.md` for the protocol.
#
# Locked scope (2026-05-14): RENAME and ADD only. RETIRE and RESHAPE need a
# separate dedicated workflow because they require atomic reparenting of
# the L1's entire subtree — out of scope for this iteration.
structural_modifiable:
  l1_domains:
    scope: [rename, add]
    requires_user_approval: true
    apply_scripts:
      rename: core/scripts/l1-domain-rename.sh
      add: core/scripts/l1-domain-add.sh
    proposal_template_pending_id_prefix: l1-taxonomy-
    rationale: |
      The four L1s have not been re-evaluated since framework birth. S1
      surfaces distribution skew (intelligence 69x performance at first
      measurement). When skew or new-L1 emergence signals warrant it, the
      evolution engine should propose changes via pending-question, NOT
      auto-apply. User approval is the gate.

# --- NODE TEMPLATES ---
# Reference templates for tree node creation. Used by /tree, /research-topic,
# and session-end consolidation when creating new nodes or node files.
# These are patterns — adapt fields to the actual domain and content.

node_templates:
  # Generic entry in _tree.yaml — works at any depth L2-L6
  _tree_entry_node:
    key: "{node-slug}"                     # kebab-case, matches filename
    file: "world/knowledge/tree/{path}/{node-slug}.md"  # path built from ancestry
    depth: "{depth}"                       # integer 2-6
    parent: "{parent-slug}"               # parent node key
    children: []
    child_count: 0
    capability_level: "EXPLORE"            # EXPLORE (<0.30), CALIBRATE, EXPLOIT, MASTER
    confidence: null                       # set after first article
    summary: "One-line description of what this node covers"
    article_count: 0
    growth_state: stable                   # stable, growing, ready_to_split, ready_to_decompose, distilled
    retrieval_count: 0                     # incremented by retrieve.py on every retrieval
    last_retrieved: null                   # date of last retrieval
    times_helpful: 0                       # Phase 4.26 feedback: node content informed execution
    times_noise: 0                         # Phase 4.26 feedback: node content was irrelevant/misleading
    utility_ratio: 0.0                     # computed: times_helpful / max(retrieval_count, 1)


  # Generic YAML front matter for node .md files at any depth L2-L6
  # Minimal schema: content-provenance fields only. All scoring/structural
  # metadata (confidence, capability_level, depth, parent, node_type, etc.)
  # lives exclusively in _tree.yaml — never duplicated in .md front matter.
  node_file_front_matter:
    topic: "Node display name"
    entities: []
    temporal_validity:
      first_observed: null
      last_confirmed: null
      observation_count: 0
    sources: []
    last_update_trigger:
      type: null
      source: null
      session: null

  # YAML front matter for L1 domain .md files (world/knowledge/tree/{domain}.md)
  # Minimal schema: content-provenance only. domain_confidence, capability_level,
  # children, depth all live in _tree.yaml exclusively.
  l1_file_front_matter:
    domain: "{domain}"                     # L1 legacy display name
    level: L1                              # L1 marker
    topics: []                             # L1 legacy — convenience listing
    last_update_trigger:
      type: null
      source: null
      session: null

  # Markdown sections for L1 domain files
  # ## Key Insights
  # ## Capability Map
  #   | Topic | Confidence | Level | Articles |
  # ## Cross-Domain Links


