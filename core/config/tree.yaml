# Memory Tree Configuration — Framework Definition
# Based on Random Tree Model (Zhong et al., PRL 2025)
# Immutable tree rules. Agent state lives in world/knowledge/tree/_tree.yaml
# Boot reads initial_state to seed state file on first run.

# --- FRAMEWORK ---

config:
  K_max: 40   # raised 4→40 by user directive 2026-07-14 (supersedes g-306-13's K=4). Observed max fan-out was 26 (system-constraints-loop) and the fleet never enforced K=4 (all structural ops skipped); retrieve.sh flat-scores nodes so hub width does not degrade recall, and wide-shallow shapes shorten paths (Windows MAXPATH). Leaf cap K_max^(D_retrieval-1) derives to 64,000 — count-based DECOMPOSE/REGROUP pressure is effectively retired; regroup on SEMANTIC incoherence only.
  D_max: 20
  D_retrieval: 4
  split_threshold: 3
  merge_threshold: 1
  min_articles_per_child: 2
  decompose_threshold: 250              # line count triggering DECOMPOSE of monolith files (raised 80→250 — P50=213/P75=282/P90=329 leaf distribution; 80 was a default tuned for shorter-form content and was flagging 82% of leaves as candidates, fragmenting coherent theses/catalogs/source-analyses; 250 catches genuinely oversized nodes while preserving long-form document coherence)
  max_decompose_per_invocation: 50     # max DECOMPOSE ops per /tree maintain run (raised 30→50 at config ceiling 2026-04-18 to match framework-expansion growth rate, g-115-79)
  max_redistribute_per_invocation: 5   # max REDISTRIBUTE ops per /tree maintain run
  compression_ratio_formula: "10 * 1.5^(depth - 2)"  # target compression at each depth
  growth_approval:
    L1_new_domain: auto
    L2_and_deeper: auto

pruning:
  distill_utility_threshold: 0.3          # utility_ratio below this triggers DISTILL
  distill_min_retrievals: 5               # minimum retrievals before DISTILL eligible
  distill_line_threshold: 50              # line count threshold for large-but-mediocre nodes
  distill_line_utility_threshold: 0.5     # utility threshold for line-count-based DISTILL
  # : sparse-feedback + stale-signal filters for the UTILITY triggers
  # (crit1/crit2 only — crit3 is structural and unaffected). One noise vote made
  # utility_ratio=0 look meaningful, flagging 525 of 817 leaves as a STANDING
  # false-positive pool that polluted the tree-debt metric (692 vs threshold 40).
  distill_min_feedback_votes: 3           # (times_helpful + times_noise) below this = utility signal is noise, not evidence
  distill_recency_days: 45                # last_retrieved older than this = utility signal too stale to act on (missing = stale)
  # crit3 (): proactive trigger for append-grown recurring-sweep nodes.
  # Fires DISTILL before a node trips the Read ~25k-token cap (which forces a
  # read-before-edit re-read on every sweep), reusing the rb-2085 procedure.
  # STRUCTURAL — keyed on size + append-grown shape, NOT utility/feedback, so it
  # catches the HIGH-utility sweep nodes crit2's noisy line-count heuristic misses.
  distill_token_cap: 25000                # Read tool ~25k-token cap (token-size estimate = chars // 4)
  distill_token_ratio: 0.8                # crit3 fires at this fraction of distill_token_cap (proactive headroom)
  distill_refresh_min_sections: 3         # append-grown signature: >= N dated "Refresh"/"Verified Values" headings
  max_distill_per_invocation: 10          # max DISTILL ops per /tree maintain run (raised 5→10 at config ceiling 2026-04-18 for backlog drain, g-115-79)
  retire_sessions_unused: 5              # sessions with 0 retrievals before RETIRE eligible
  retire_noise_threshold: 0.1            # utility below this with 10+ retrievals = actively harmful
  retire_noise_min_retrievals: 10
  prune_stub_line_threshold: 10          # PRUNE/RETIRE empty-stub gate: a leaf with article_count==0 (PRUNE) or retrieval_count==0 (RETIRE) is a true empty/dead stub ONLY when its .md body has fewer than this many non-blank lines (excl. YAML front matter). article_count counts ATTACHED ARTICLES, not body content — content-bearing nodes (body >= threshold) hold real knowledge and must NOT be auto-pruned/retired (g-115-1534; zeta exp-g-115-1367 "article_count=0 is NORMAL"). g-115-398 flagged 25 content-bearing nodes (13-86 body lines); 10 cleanly separates stubs from content.

# Three-tier maintenance budget — read this section top to bottom for the full
# picture. The standard caps in `config:` above are the daily ceiling.
# `maintenance.backlog_mode_trigger` (above) raises the caps × 1.5 (ceil)
# when debt accumulates. `stop_mode_caps` (below) is the OPPOSITE: a small
# fixed budget for /stop so structural debt drains incrementally without
# making every stop slow. Tier relationship: standard 50 / backlog 75 / stop 5.
#
# Why this tier exists ( family — Magic Wand #4): pre-2026-05-08,
# stop_mode skipped /tree maintain entirely under tight context. Decompose
# candidates accumulated for weeks. The fix isn't "skip more to save time" —
# it's "do a small budget per stop so the queue drains over many stops."
# Sibling principle: pending-questions sweep (Lane B), structural-progress
# axis (Lane D #1). All three follow the meta-rule:
# `core/config/modes/autonomous.md` → "Stop-mode does work."
stop_mode_caps:
  max_decompose_per_invocation: 5       # ~20% of typical 24-candidate standing queue → drains in 5 stops
  max_redistribute_per_invocation: 1    # rare op (typically 0-2 candidates); 1 is sufficient
  max_distill_per_invocation: 2         # one or two utility-low or oversized leaves per stop
  max_split_per_invocation: 1           # straggler handler
  max_sprout_per_invocation: 0          # do NOT create new structural debt during /stop
  max_merge_per_invocation: 1           # straggler handler
  max_prune_per_invocation: 1           # straggler handler
  max_retire_per_invocation: 1          # straggler handler
  # Wall-clock budget: 5 decomposes × ~5-10s LLM each + 2 distills + a few
  # single-ops ≈ 45-90s of /tree maintain inside /stop. /stop overall stays
  # under 3 min on the FAST consolidation path.

# Pre-create duplicate gate (Phase 2 of cognitive-core curation plan).
# Every write path (/tree add, state-update Step 8 encoding, reflect-tree-update,
# research-topic sprout, /tree maintain SPROUT) calls tree-dedup-check.py before
# creating a new child. Stops "breadth without depth" accumulation.
dedup:
  sibling_overlap_threshold: 0.6          # Jaccard over distinctive tokens; overlap >= this = reject
  min_tokens_for_overlap: 3               # skip check when either summary tokenizes to fewer than N
  enforce_from_depth: 2                   # don't block L1 growth (keeps top-level flexibility)

# Utility-weighted retrieval ranking (Phase 1.5 of cognitive-core curation plan).
# Reweights base match score by each node's utility_ratio:
#   effective = base * clamp(1.0 + (utility_ratio - utility_weight_center), min, max)
# Proven-helpful nodes outrank zero-utility ones; bad nodes stop being selected →
# retrieval_count stops climbing → existing RETIRE rule (retrieval_count == 0 for N sessions) fires naturally.
#
# CENTERING (, 2026-07-26). The formula was `0.5 + utility_ratio`, which
# INVERTED the intent above. Measured over 1254 live nodes: utility_ratio averages
# 0.206 among the 1180 nodes that reach the ratio path, so the average PROVEN node
# scored 0.706 while every unmeasured node got the neutral 1.0 — a ~41% ranking
# edge for having no track record, and a cliff (not a gradient) at retrieval_count 5.
# Per-bucket mean weight before the fix: rc0-4 1.0000 (n=70) · rc5-9 0.6640 (n=281)
# · rc10-24 0.7063 (n=388) · rc25-49 0.7384 (n=287) · rc50+ 0.7217 (n=228).
# Centering on the corpus mean makes the term express RELATIVE merit: an average
# node lands on 1.0, better-than-average is boosted, worse is penalized, and an
# unmeasured node's 1.0 now correctly reads "assume average" instead of "best
# possible". Slope is unchanged (1:1 in utility_ratio) — this is purely a shift.
# NOT starved counters: 91% of nodes carry nonzero helpful signal and utility_ratio
# does not decline with retrieval_count, so guard-393's audit passes (it was run).
retrieval:
  utility_weight_min: 0.5                       # floor on reweight (zero-utility cap)
  utility_weight_max: 1.5                       # ceiling (proven-helpful cap)
  utility_weight_neutral_below_retrievals: 5    # nodes below this retrieval_count get weight 1.0
  # Corpus mean utility_ratio among nodes that reach the ratio path. RE-DERIVE
  # when the corpus shifts materially: mean of `utility_ratio` over nodes with
  # retrieval_count >= utility_weight_neutral_below_retrievals AND at least one
  # nonzero times_helpful / times_inferred_helpful / times_noise.
  # Measured 2026-07-26 (): n=1180, mean 0.2061, median 0.2000,
  # p10 0.0282, p90 0.3871. A stale value only shifts the neutral point; it
  # cannot invert the ordering, so drift here degrades gracefully.
  utility_weight_center: 0.2061
  # Poignancy blend (, BRD Gap 1a; Generative Agents 2304.03442). A
  # third multiplicative factor on the effective score, mapping a record's
  # poignancy (1-10, LLM-rated at write) into [poignancy_weight_min,
  # poignancy_weight_max]. DEFAULT OFF — when disabled the factor is 1.0 for
  # every record, so retrieval ranking is byte-identical to pre-.
  # Boost-only by construction: poignancy_weight_min is 1.0, so the factor is
  # >= 1.0 always. The blend can only PROMOTE high-poignancy records, never
  # demote anything below its current effective score — this structurally
  # satisfies the "no known-good knowledge hidden" A/B criterion. Null/absent
  # poignancy maps to 1.0 (neutral), so legacy records are null-safe with no
  # backfill. Enable + A/B before trusting in production.
  poignancy_blend_enabled: false                # master flag — false = current behavior
  poignancy_weight_min: 1.0                      # factor at poignancy=1 (and null→neutral)
  poignancy_weight_max: 1.5                      # factor at poignancy=10
  # Embedding-cosine hybrid for the supplementary stores ( part b2;
  # validated by the  A/B gate: offline embedding-cosine beat the
  # token-overlap text-fallback ~5x on hit@3, 67% vs 13%, MRR .512 vs .129).
  # When enabled AND the persisted index exists (embedding-index-build.py →
  # mind_api/state/retrieval-embedding-index/), reasoning-bank + guardrail
  # candidates are (1) WIDENED with entries whose query-cosine >=
  # embedding_min_cosine even when the token predicate missed them, and
  # (2) RE-RANKED by cosine desc before the depth cap — relevance decides
  # cap slots instead of utility. DEFAULT OFF — when false (or the index is
  # absent, or the model fails) ranking is byte-identical to the token path;
  # graceful degradation is structural (_embedding_retrieval.cosine_scores
  # never raises). The daemon caches this config per process — flipping the
  # flag needs a daemon restart, same as the poignancy blend above.
  # ENABLED 2026-07-25 (, zeta on cc-02) — supersedes the 
  # DORMANCY DECISION, which correctly held this false until >=1 box could measure
  # a real after-state rather than STAGE a fix (rb-5100). That precondition is met.
  # PROVISIONING (cc-02): `pip install --target ~/.ayoai-vendor/py fastembed`.
  # PEP 668 does NOT block --target (it writes to a named directory, not the system
  # environment) — verified two-way: the vendored stack imports, while a bare
  # `python3 -c "import numpy"` STILL fails, so the system Python the daemon and all
  # 5 agents share is untouched. apt was not an option: python3-numpy exists but
  # onnxruntime/fastembed/tokenizers have NO apt candidate. A venv was rejected as
  # heavier blast radius (needs python3-venv + re-pointing mind-api-start.sh on a
  # live box). core/scripts/_vendor_path.py APPENDS that dir to sys.path from the
  # embedding chokepoints, so the encoder resolves for the daemon, the CLI and hooks
  # alike regardless of how the process was launched; append (never prepend) keeps
  # it a fallback provider that can never shadow a real install.
  # KEEP IT OUT OF THE REPO. The first attempt used mind_api/state/vendor/py
  # (gitignored, beside the index cache) and broke check_version_ssot — test_release.py
  # went 9 red, because that scanner rglobs mind_api/ for stray __version__ and 28
  # third-party packages legitimately declare one. Patching that one scanner would
  # have treated the symptom: a 199MB dependency tree inside the repo sits in the
  # path of EVERY tool that walks it. ~/.ayoai-vendor/py also matches the precedent
  # this subsystem already set — load_encoder caches its ONNX model at ~/.ayoai-emb.
  # MIND_VENDOR_DIR overrides the location.
  # INDEX: fastembed backend (ONNX, no torch), all-MiniLM-L6-v2, 7271 docs, dim 384.
  # GOTCHA: the initial build needs HF_HUB_OFFLINE=0 — the builder hard-defaults to
  # offline, so `embedding-index-build.py --build` alone FAILS on an empty cache
  # (fastembed misses, then falls through to an absent sentence_transformers).
  # MEASURED before/after, 4-query set, cc-02, read_only (so utilization is not
  # perturbed): meta_lessons went from 1 unique result set across 4 queries
  # (query-INVARIANT, the defect) to 4 distinct sets; entries carrying the exact
  # queried category went 0/5 -> 1/5 on 'framework-maintenance'. Slots 1-3 stay
  # utilization-ordered, slots 4-5 are cosine-picked (universal_relevance_slots=2).
  # FLEET SAFETY: this flag is fleet-shared but the vendored stack and index are
  # PER-BOX. An un-provisioned box has no index -> cosine_scores returns {} ->
  # both consumers return the byte-identical pre-blend list, i.e. exactly today's
  # behavior (verified at runtime against an empty index dir). Provision another
  # box by repeating the two steps above; the daemon caches this config per
  # process, so a restart is required for the flip to take effect.
  embedding_blend_enabled: true                 # master flag — per-box index gates the real effect
  embedding_min_cosine: 0.35                    # widen threshold for non-token-matched entries
  # : when the blend is ON, this many of the UNIVERSAL_RB_CAP(5)
  # meta_lessons slots are picked by query-cosine (from universal entries
  # clearing embedding_min_cosine) instead of utilization order. The top
  # (5 - N) by utilization remain guaranteed (push floor); unfilled pull
  # slots backfill by utilization, so the returned count never shrinks.
  # Motivation: the b2 acceptance A/B showed the universal lane returns the
  # SAME top-5-by-utilization for ANY query — framework meta-lessons were
  # query-invisible (9/9 paraphrase targets unranked in both arms).
  # 0 = disable the split (pure utilization) even with the blend on.
  universal_relevance_slots: 2
  # : model the index BUILDER embeds with (embedding-index-build.py
  # --build; --model CLI overrides). The QUERY side ignores this — it loads
  # the model named in the built index's meta.json, so a box's query encoder
  # always matches its own index. --update pins the existing index's model
  # (mixing models in one matrix corrupts cosines); switching models requires
  # an explicit --build. Backend auto-selects per box: fastembed (ONNX, no
  # torch) when installed + model supported, else sentence-transformers.
  # DEFAULT stays all-MiniLM-L6-v2 — do NOT flip to bge-small here until
  # fastembed + model files are provisioned fleet-wide (offline posture: an
  # uncached model cannot download at build time).
  # CORRECTION (, alpha 2026-07-25): this comment previously read
  # "that is the model every fleet box has HF-cached today". MEASURED FALSE on
  # cc-04 — no HF cache in any of 6 probed locations, and no encoder at all
  # (fastembed / sentence_transformers / numpy / onnxruntime ALL absent).
  # Do not treat fleet-wide model availability as given; probe per box. Boxes with fastembed provisioned
  # can rebuild with: py -3 core/scripts/embedding-index-build.py --build
  # --model "BAAI/bge-small-en-v1.5" (the  GO model).
  embedding_model_name: all-MiniLM-L6-v2
  # : tree-lane embedding channel. When true AND the index carries
  # tree docs (embedding-index-build.py embeds humanized-key + summary +
  # first body paragraph capped 400 chars per node, as 'tree:<relpath>' ids
  # — the body paragraph was added by ), load_tree_nodes gains a
  # semantic eligibility channel ('embedding' — nodes above
  # embedding_min_cosine join the match set even when all four token
  # strategies miss) and _score_weight_limit swaps its TF-IDF cosine bonus
  # for true embedding cosine. SEPARATE flag from embedding_blend_enabled
  # (supplementary lane) so each lane enables on its own A/B evidence.
  #
  # ENABLED 2026-07-26 () on the  A/B, 12 node-paraphrase
  # queries, same set both arms:
  #   key+summary            hit@1=3 hit@3=7  hit@5=9  MRR=0.432
  #   +first body paragraph  hit@1=7 hit@3=10 hit@5=10 MRR=0.709
  # 8 improved / 2 regressed / 2 unchanged. The  measurement that
  # justified DEFAULT OFF was taken on the thin key+summary surface, which
  #  replaced — so the original reason to keep it off no longer holds.
  # Per-box: a box without an encoder/index degrades structurally to
  # token-overlap (cosine_scores returns {}), so enabling fleet-wide is safe
  # where unprovisioned, not broken. Reversible — set false to revert.
  # Replay the A/B with world/scripts/tree-embed-ab-harness.py.
  embedding_tree_channel_enabled: true
  # : reserve this many returned slots for the top nodes by SEMANTIC
  # cosine (among those clearing the eligibility floor). The cosine bonus is
  # ADDITIVE — at most COSINE_BONUS_WEIGHT(2.0) on a ~4.5-5.4 base, roughly
  # 25% — while utility_weight and the MMR path-similarity penalty act on the
  # WHOLE base. So a node could hold the highest cosine of ANY node for a query
  # and still never be returned. Live instance: `server-lifecycle` at cosine
  # 0.5653 (top for its query) was dropped while 27 SUB-FLOOR nodes were
  # returned — base 4.481, utility_weight 0.705, pre-MMR rank 21 of 61, then
  # MMR cut it as path-redundant with sibling server/session nodes above it.
  # Reserved nodes are GUARANTEED a slot but NOT promoted: the union is
  # re-sorted by effective score, so this fixes exclusion without distorting
  # returned ORDER. Capped at limit-1 so MMR always keeps authority over >=1
  # slot. MEASURED before/after on the 12-query harness (depth=medium,
  # read_only so utilization is not perturbed): queries having >=1 floor-clearing
  # node whose TOP-cosine node is returned went 8/10 -> 10/10; total
  # eligible-but-lost 19 -> 18 of 104. The 2 queries still missing their
  # top-cosine node have ZERO floor-clearing nodes (cosine 0.333/0.334 vs floor
  # 0.35) — correct eligibility behavior, not downstream loss. Set 0 to disable
  # (byte-identical to pre-). Only active on the real-embedding path;
  # the TF-IDF fallback is untouched.
  cosine_reserved_slots: 3
  # : TREE-LANE eligibility floor. Deliberately SEPARATE from the
  # shared embedding_min_cosine (0.35) above, which governs the supplementary
  # rb/guardrail lane and was tuned on THAT lane's A/B evidence — lowering the
  # shared value would silently change reasoning-bank behaviour that has its own
  # basis. Only load_tree_nodes reads this key; it falls back to
  # embedding_min_cosine when unset, so removing this line restores the prior
  # shared-floor behaviour exactly (the revert path).
  #
  # MEASURED 2026-07-26 (alpha), end-to-end on what retrieval actually RETURNS
  # (not cosine rank — see the harness note below). Canonical failing case:
  # query 'which box is foxtrot on' ranked fleet-topology-roster FIRST by
  # cosine at 0.3330 and missed the 0.35 floor by 0.017, so the query token-
  # matched 0 nodes and returned ZERO results. Floor sweep, 4 real queries:
  #   0.35  foxtrot case returns 0 nodes            (the defect)
  #   0.32  foxtrot returned at rank 0; mean match set 52 -> 68
  #   0.30  no ADDITIONAL case rescued, and measurably worse elsewhere —
  #         template-budget-profiles degrades from returned-rank 10 to 28
  # 0.32 is therefore the knee: it fixes the zero-result case at the smallest
  # dilution. Margin is thin by construction (0.3330 vs 0.32 = 0.013) — if the
  # embedding model or index is rebuilt, re-measure rather than assuming it
  # still clears.
  embedding_tree_min_cosine: 0.32
  # M-4: Rehearsal-weighted decay parameters.
  # Frequently-retrieved nodes get a longer recency TAU, so their recency bonus
  # persists longer. Uses retrieval_count (monotonic, safe) not last_retrieved
  # (incremented by scoring — runaway feedback).
  # Formula: effective_tau = clamp(base + retrieval_count / scale, base, max).
  rehearsal_tau_base: 30              # base TAU_DAYS (matches RECENCY_TAU_DAYS)
  rehearsal_tau_max: 120              # ceiling — even heavily-retrieved nodes decay eventually
  rehearsal_tau_scale: 5.0            # retrieval_count units per +1 TAU day (linear ramp)
  rehearsal_neutral_below: 5          # below this retrieval_count, TAU stays at base

# M-6: Per-module success-rate tracking.
# Tracks which retrieval modules (tree categories, supplementary stores) produce
# helpful results.  Updated by utilization-feedback.py; read by retrieve.py for
# retrieval-priority and by aspirations-evolve for reconsolidation triggers.
# Storage: world/module-health.yaml (world-scoped, survives sessions).
module_health:
  tree_reconsolidation_threshold: 0.4       # success_rate below this triggers reconsolidation
  tree_reconsolidation_min_invocations: 50   # minimum invocations before threshold applies
  supp_reconsolidation_threshold: 0.3        # supplementary store threshold
  supp_reconsolidation_min_invocations: 100  # supplementary store minimum invocations

# Scheduled tree debt check (Phase 4 of cognitive-core curation plan).
# Runs every N goals in the aspirations loop; invokes /tree maintain when
# distill/retire candidate count exceeds the threshold. Lowers reliance on
# session-end consolidation being the only curation trigger.
tree_debt_check:
  interval_goals: 3          # run every N completed goals per session
  debt_threshold: 40         # distill_candidates above this triggers cleanup; ×3 (=120) is the decompose critical threshold in iteration-close.sh. Raised 20→40 (g-001-187, rb-290): at depth 5-7, many 80-113 line leaves are coherent concepts that cannot be meaningfully split. After iter 78 two consecutive backlog drains saw 0/5 decomposes actionable — the signal was noise. 40 keeps genuine monolithic nodes (e.g. 180+ lines flat at shallow depth) detectable while silencing coherent-concept false positives.
  force_maintain_cooldown_hours: 1.0   # min hours between force_tree_maintain re-emits (g-115-82, rb-280 — prevents signal starving goal progress when backlog drains slower than one-iter cadence)

# Backlog-mode trigger for /tree maintain. When EITHER threshold is met, the
# maintenance pass should escalate from standard caps to elevated caps
# (--backlog mode). Single source of truth — consumed by  (recurring
# tree maintenance sweep). Update HERE rather than editing goal-description prose.
maintenance:
  backlog_mode_trigger:
    min_decompose_candidates: 5    # decompose-candidates count >= this → use --backlog
    min_days_since_clear: 7        # days since last_backlog_clear_at >= this → use --backlog

# Capability-aware child limits (Phase 3 of cognitive-core curation plan).
# Parents at early capability levels should cap children low so depth is
# forced before breadth; mature EXPLOIT/MASTER parents get the full K_soft.
# Originally shipped in `warn` so 2-3 sessions of real data could inform the
# caps. Flipped to `block` in  after shadow data confirmed the caps
# (EXPLORE:2, CALIBRATE:4, EXPLOIT/MASTER:8) match real growth patterns.
# 2026-05-09 user-directed retune: caps bumped to the configured ceiling
# (EXPLOIT/MASTER 8→16, CALIBRATE 4→8) and mode reverted to `warn` to remove
# write-time override ceremony while preserving the structural-fix signal.
# Real distribution at retune time: 6 of 975 nodes over the 8-cap (0.6%);
# under the new caps, only a domain-specific junk-drawer category (CALIBRATE, 15) is over-cap and
# IS a genuine junk drawer worth flagging via warn. EXPLORE stays at 2 —
# early-stage parents should still genuinely deepen first.
# Mode values: warn | block | off. Warn mode: log [child-limit] WARN to
# stderr and allow the write (no debt entry, no exit). Block mode:
# tree-update.sh --add-child exits 6 on cap violations unless
# --accept-overflow '<justification>' is passed, which writes a tree-debt
# entry to world/tree-debt.jsonl.
child_limits:
  mode: warn
  EXPLORE: 2                 # force depth inside parent first
  CALIBRATE: 8
  EXPLOIT: 16
  MASTER: 16

domain_health:
  weights:
    capability: 0.50
    coverage: 0.25
    confidence: 0.25
  min_data_threshold: 2    # minimum leaves with data to compute health
  # Must match capability_level values used in tree nodes (from developmental-stage.yaml)
  competence_mapping:
    EXPLORE: 0.25
    CALIBRATE: 0.50
    EXPLOIT: 0.75
    MASTER: 1.00

# Bounds for self-tuning. Each 'default' MUST match the actual config value above.
modifiable:
  K_max: {min: 3, max: 40, default: 40}   # bounds widened with the 2026-07-14 user directive; default matches config value above
  D_max: {min: 4, max: 20, default: 20}
  D_retrieval: {min: 3, max: 20, default: 4}
  split_threshold: {min: 3, max: 10, default: 3}
  merge_threshold: {min: 1, max: 3, default: 1}
  min_articles_per_child: {min: 1, max: 4, default: 2}
  decompose_threshold: {min: 50, max: 300, default: 250}
  max_decompose_per_invocation: {min: 1, max: 50, default: 30}
  max_redistribute_per_invocation: {min: 1, max: 10, default: 5}
  max_entities: {min: 50, max: 500, default: 200}
  domain_health_capability_weight: {min: 0.20, max: 0.80, default: 0.50}
  domain_health_coverage_weight: {min: 0.10, max: 0.50, default: 0.25}
  domain_health_confidence_weight: {min: 0.10, max: 0.50, default: 0.25}
  domain_health_min_data_threshold: {min: 1, max: 5, default: 2}
  distill_utility_threshold: {min: 0.1, max: 0.5, default: 0.3}
  distill_min_retrievals: {min: 3, max: 10, default: 5}
  max_distill_per_invocation: {min: 1, max: 10, default: 5}
  retire_sessions_unused: {min: 3, max: 10, default: 5}
  prune_stub_line_threshold: {min: 3, max: 12, default: 10}   # max capped at 12 (< the 13-line smallest g-115-398 content node) so self-tuning can never re-flag a known content-bearing node
  dedup_sibling_overlap_threshold: {min: 0.3, max: 0.9, default: 0.6}
  dedup_min_tokens_for_overlap: {min: 2, max: 8, default: 3}
  dedup_enforce_from_depth: {min: 1, max: 5, default: 2}
  # Phase 1.5 — utility-weighted retrieval ranking.
  # min floor: 0.1 (near-zero weight crushes all match-score signal for bad nodes;
  # leave some daylight so evolve can explore). max ceiling: 2.5 (beyond ~1.5 the
  # utility weight starts drowning the base relevance signal).
  retrieval_utility_weight_min: {min: 0.1, max: 0.9, default: 0.5}
  retrieval_utility_weight_max: {min: 1.0, max: 2.5, default: 1.5}
  retrieval_utility_weight_neutral_below_retrievals: {min: 2, max: 20, default: 5}
  # M-4 — rehearsal-weighted decay (adaptive TAU for recency bonus).
  rehearsal_tau_base: {min: 10, max: 60, default: 30, step: 5}
  rehearsal_tau_max: {min: 60, max: 365, default: 120, step: 30}
  rehearsal_tau_scale: {min: 1.0, max: 20.0, default: 5.0, step: 1.0}
  # Phase 4 — scheduled tree debt check.
  tree_debt_check_interval_goals: {min: 1, max: 10, default: 3}
  tree_debt_check_debt_threshold: {min: 5, max: 100, default: 20}
  # Backlog-mode trigger — see `maintenance.backlog_mode_trigger` above.
  maintenance_backlog_min_decompose_candidates: {min: 1, max: 50, default: 5}
  maintenance_backlog_min_days_since_clear: {min: 1, max: 30, default: 7}
  # Phase 3 — capability-aware child limits. mode excluded (enum, not numeric).
  # 2026-05-09 retune: defaults raised to ceiling for EXPLOIT/MASTER/CALIBRATE
  # (see child_limits block above for rationale). Defaults must match active values.
  child_limits_explore: {min: 1, max: 4, default: 2}
  child_limits_calibrate: {min: 2, max: 8, default: 8}
  child_limits_exploit: {min: 4, max: 16, default: 16}
  child_limits_master: {min: 4, max: 16, default: 16}

# Entity cross-link index configuration (HindSight-inspired)
entity_index:
  max_entities: 200
  extract_during:
    - research-topic   # Step 3: extract from tree node findings
    - reflect          # Step 7.5b: extract from ABC chains
  entity_types: [person, organization, concept, metric, event]

# L1 domains — the fundamental branches every agent starts with.
# Phase 2 of tree-taxonomy review (S8): l1_domains is MODIFIABLE via the
# user-approval gate. See `structural_modifiable.l1_domains` below for the
# allowed-changes scope and `core/config/conventions/l1-taxonomy-changes.md`
# for the apply protocol.
l1_domains:
  - key: execution
    file: world/knowledge/tree/execution.md
    summary: "What to DO — strategies and methods for taking action"
  - key: intelligence
    file: world/knowledge/tree/intelligence.md
    summary: "What we KNOW — domain knowledge and understanding"
  - key: performance
    file: world/knowledge/tree/performance.md
    summary: "How we're DOING — outcome tracking and accuracy analysis"
  - key: system
    file: world/knowledge/tree/system.md
    summary: "HOW we work — meta-knowledge about the agent's own operation"

# --- STRUCTURAL MODIFIABLE (S8 — user-approval-gated taxonomy changes) ---
# Separate from `modifiable:` because these changes are NOT numeric param
# tuning — they alter categorical structure. Evolution engine can PROPOSE
# changes via pending-question; user approves before any apply script runs.
# See `core/config/conventions/l1-taxonomy-changes.md` for the protocol.
#
# Locked scope (2026-05-14): RENAME and ADD only. RETIRE and RESHAPE need a
# separate dedicated workflow because they require atomic reparenting of
# the L1's entire subtree — out of scope for this iteration.
structural_modifiable:
  l1_domains:
    scope: [rename, add]
    requires_user_approval: true
    apply_scripts:
      rename: core/scripts/l1-domain-rename.sh
      add: core/scripts/l1-domain-add.sh
    proposal_template_pending_id_prefix: l1-taxonomy-
    rationale: |
      The four L1s have not been re-evaluated since framework birth. S1
      surfaces distribution skew (intelligence 69x performance at first
      measurement). When skew or new-L1 emergence signals warrant it, the
      evolution engine should propose changes via pending-question, NOT
      auto-apply. User approval is the gate.

# --- NODE TEMPLATES ---
# Reference templates for tree node creation. Used by /tree, /research-topic,
# and session-end consolidation when creating new nodes or node files.
# These are patterns — adapt fields to the actual domain and content.

node_templates:
  # Generic entry in _tree.yaml — works at any depth L2-L6
  _tree_entry_node:
    key: "{node-slug}"                     # kebab-case, matches filename
    file: "world/knowledge/tree/{path}/{node-slug}.md"  # path built from ancestry
    depth: "{depth}"                       # integer 2-6
    parent: "{parent-slug}"               # parent node key
    children: []
    child_count: 0
    capability_level: "EXPLORE"            # EXPLORE (<0.30), CALIBRATE, EXPLOIT, MASTER
    confidence: null                       # set after first article
    summary: "One-line description of what this node covers"
    article_count: 0
    growth_state: stable                   # stable, growing, ready_to_split, ready_to_decompose, distilled
    retrieval_count: 0                     # incremented by retrieve.py on every retrieval
    last_retrieved: null                   # date of last retrieval
    times_helpful: 0                       # Phase 4.26 feedback: node content informed execution
    times_noise: 0                         # Phase 4.26 feedback: node content was irrelevant/misleading
    utility_ratio: 0.0                     # computed: times_helpful / max(retrieval_count, 1)
    # provenance: DIRECT | INFERRED | SYNTHESIZED | HEARSAY  # M-5: evidential weight tag (optional; legacy nodes default to 0.9 weight)


  # Generic YAML front matter for node .md files at any depth L2-L6
  # Minimal schema: content-provenance fields only. All scoring/structural
  # metadata (confidence, capability_level, depth, parent, node_type, etc.)
  # lives exclusively in _tree.yaml — never duplicated in .md front matter.
  node_file_front_matter:
    topic: "Node display name"
    entities: []
    temporal_validity:
      first_observed: null
      last_confirmed: null
      observation_count: 0
    sources: []
    last_update_trigger:
      type: null
      source: null
      session: null

  # YAML front matter for L1 domain .md files (world/knowledge/tree/{domain}.md)
  # Minimal schema: content-provenance only. domain_confidence, capability_level,
  # children, depth all live in _tree.yaml exclusively.
  l1_file_front_matter:
    domain: "{domain}"                     # L1 legacy display name
    level: L1                              # L1 marker
    topics: []                             # L1 legacy — convenience listing
    last_update_trigger:
      type: null
      source: null
      session: null

  # Markdown sections for L1 domain files
  # ## Key Insights
  # ## Capability Map
  #   | Topic | Confidence | Level | Articles |
  # ## Cross-Domain Links


