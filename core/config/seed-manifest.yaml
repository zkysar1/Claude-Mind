# Mind Framework Seed Manifest
#
# domain-leak-exempt: this manifest's `global_regex`/`word_list_strip`/`from:` fields
# enumerate the exact domain strings that the seed pipeline transforms or strips
# at copy time. The terms ARE the transformation specification — they must
# appear literally so the regex engine can match them. Genericizing them
# would defeat the manifest's purpose. Functional, not pedagogical.
#
# Defines what files are copied (planted) from source repo into a destination "seed" repo,
# what to exclude, and what transformations to apply at copy time.
#
# Consumed by: /seed plant skill (.claude/skills/seed/SKILL.md)
# Implementation: core/scripts/seed-transplant.sh + _seed_engine.py + _seed_transforms.py
#
# Schema version: 1
# Update protocol: when adding new transformations, bump `version` only on schema changes.
# Adding/removing rules within an existing schema version does NOT bump version.

version: 1
description: "Framework seed manifest: copy core/ + .claude/ + mind_api/ + selected root files to a destination repo, excluding domain-specific state and applying generic-name transformations at copy time."
created: "2026-05-19"
updated: "2026-05-19"

# Range of manifest versions this skill supports. Skill refuses manifests outside range.
min_skill_version: 1
max_skill_version: 1

# =============================================================================
# INCLUDE — what gets copied
# =============================================================================
include:
  # Directories (recursive copy unless excluded by patterns/children)
  - path: ".claude/rules/"
    type: directory
    required: true

  - path: ".claude/skills/"
    type: directory
    required: true
    # Forged skills excluded — domain-specific, generated by /forge-skill at runtime.
    # As of g-306-88 the seed engine (_seed_engine.walk_include_entry) AUTO-DERIVES
    # forged exclusions from world/forged-skills.yaml at seed-create and UNIONs them
    # onto this list, so a newly-forged skill can NO LONGER leak even when missing
    # here. This static list is now the FAIL-SAFE FLOOR (applied when the registry
    # is unlocatable) + documentation — it need NOT be hand-synced with the registry.
    # (Prior hand-sync recurrently drifted and leaked: v2.2.0 audit-roblox-deliverable,
    # v2.4.0 build-operator-job, both when this enumeration lagged the registry.)
    exclude_children:
      - "access-aws-services"
      - "access-efs-data"
      - "access-email"
      - "access-operator-api"
      - "access-roblox-studio"
      - "add-npc-task"
      - "analyze-npc-behavior"
      - "audit-roblox-deliverable"
      - "manage-roblox-scripts"
      - "notify-user"
      - "operator-health-trend"
      - "run-game-session"
      - "run-processor"
      - "run-test-circuit"
      - "scan-stale-jobs"
      - "state-replay"
      # REGISTRY-ABSENT forges (g-115-2373): these two have no
      # world/forged-skills.yaml row (registry-row loss, g-115-2359), so the
      # auto-derive CANNOT cover them. Since forged bodies are git-tracked as
      # of 2026-07-16 (no gitignore layer), this floor entry is their ONLY
      # seed-purity defense until their registry rows are restored.
      - "probe-governed-store"
      - "reconcile-fleet-fork"
      # Plus ephemeral/per-deployment dirs
      - "worktrees"
      - ".history"

  - path: "core/"
    type: directory
    required: true
    exclude_patterns:
      - "logs/"
      - ".pycache/"
      - ".pytest_cache/"
      - "__pycache__/"
      - "scripts/.python-shim/"
      - "scripts/tests/_tmp_*/"
      - "scripts/migrate-to-phase-2-6.sh"
      - "scripts/migrate-to-phase-2-6.py"
      - "scripts/migrate-argv-to-stdin.py"

  - path: "mind_api/src/"
    type: directory
    required: true

  - path: "mind_api/tests/"
    type: directory
    required: true

  # mind_api/bench/ EXCLUDED from initial seed (Q27 lean):
  # Real AyoAI goal IDs in fixtures + hardcoded "zeta" in bench.py.
  # When ready to ship benchmark capability, uncomment + add seed-templates/bench-fixtures/.
  # - path: "mind_api/bench/"
  #   type: directory
  #   exclude_patterns: ["results/"]

  # Top-level files
  - path: ".claude/settings.json"
    type: file
    required: true

  - path: ".env.example"
    type: file
    required: true
    transformed: true  # Replaced via F1

  - path: ".gitignore"
    type: file
    required: true

  - path: ".gitattributes"
    type: file
    required: false

  - path: "CLAUDE.md"
    type: file
    required: true

  - path: "LICENSE"
    type: file
    required: true  # "Copyright (c) 2026 Zachary Kysar" per Q21 — leave as-is

  - path: "README.md"
    type: file
    required: true
    transformed: true  # Replaced via F2

  - path: "RELEASES.json"
    type: file
    required: false  # bootstraps the target's release feed so release.sh's CW2 frontier-invariant can fetch it (raw.githubusercontent) instead of 404-ing; domain-clean (0 domain strings), verbatim copy, no transform (g-115-2731)

  - path: "SETUP.md"
    type: file
    required: true

  - path: "requirements.txt"
    type: file
    required: true

  - path: "pytest.ini"
    type: file
    required: false


# =============================================================================
# EXCLUDE_ALWAYS — never copied, regardless of include rules
# =============================================================================
# Pattern semantics (see _seed_engine.py::is_excluded_always docstring):
#   `/foo/`  — ANCHORED to top-level only (gitignore-style). Use for dirs
#              whose basename can legitimately appear nested as a code path.
#   `foo/`   — basename matches ANYWHERE in tree (legacy). Use for cache /
#              transient dirs that must vanish at every depth.
#   `a/b/`   — path prefix `a/b/` (no anchoring needed; already path-specific).
#
# Why this matters: `mind_api/src/world/` and `mind_api/src/meta/` are real
# Python packages that the daemon imports. A bare `world/` exclusion
# over-matches those packages and breaks the daemon at the destination
# (testy-incident 2026-05-20). Anchored `/world/` excludes the top-level
# domain dir while leaving the nested Python package intact.
exclude_always:
  # Domain state (whole dirs — anchored: top-level only)
  - "/agents/"
  - "/world/"
  - "/meta/"

  # Per-deployment / runtime
  - "/.git/"        # anchored — destination owns its own .git/
  - "/.history/"    # anchored — destination's own version history
  - "mind_api/state/"
  - "mind_api/bench/"  # excluded from initial seed (Q27)
  - "mind_api/docs/development-history/"

  # Secrets and per-machine config
  - ".env.local"
  - ".claude/settings.local.json"

  # (Internal planning docs removed 2026-05-20 — content encoded into
  # the knowledge tree at world/knowledge/tree/system/publication-pipeline.md
  # plus RB entries rb-1108/rb-1109/rb-1110. The files PACKAGING-PLAN.md and
  # publication-cleanup-plan.md no longer exist at source. If a future plan
  # document is needed, prefer encoding it directly into the tree rather
  # than adding a new exclude_always entry here.)

  # Session/runtime artifacts
  - ".active-agent-*"
  - "*.stackdump"
  - ".latest-session-id"
  - ".stop-hook-log"
  - ".stop-hook-timing.jsonl"
  - ".hook-fires/"
  - ".bash-inject-misses.jsonl"
  - ".bash-inject-no-binding-*"
  - ".sid-collisions.jsonl"
  - ".autocompact-serialize-lock/"
  - ".iteration-commit-lock/"

  # Build / runtime caches (catch anywhere in tree)
  - "__pycache__/"
  - ".pytest_cache/"
  - ".pycache/"
  - "*.pyc"
  - "*.pyo"
  - ".python-shim/"
  - "core/logs/"


# =============================================================================
# TRANSFORMATIONS — applied to file contents at copy time
# =============================================================================
# Priority order (highest first):
#   1. file_replace      — full content swap from seed-templates/
#   2. inline_edit       — per-file pattern/replacement
#   3. global_regex      — repo-wide regex
#   4. word_list_strip   — strip specific words when in comments
#
# A file matched by file_replace is NOT further processed by other transformations.
# A file matched by inline_edit IS further processed by global_regex + word_list_strip.
# Pattern values are Python regex strings (single-quoted to avoid YAML escape issues).
#
# TEMPLATE STATUS:
#   - F1 (env.example), F2 (README.md): templates land in this same PR
#   - I6/I11/I12/I13/I16 (file_replace on SKILL.md / convention files): templates TODO
#     until skill body is implemented and dry-run reveals the exact clean version needed.
#     Marked with `pending_template: true` — skill skips with WARN until template lands.

transformations:
  # ---------------------------------------------------------------------------
  # File replacements (priority 1) — full content swap from seed-templates/
  # ---------------------------------------------------------------------------
  - id: F1
    type: file_replace
    target: ".env.example"
    source: "core/config/seed-templates/.env.example"
    reason: "Source .env.example has domain-leaking key names (EFS_SSH_HOST, AYO_OPERATOR_KEY, AWS_*)"

  - id: F2
    type: file_replace
    target: "README.md"
    source: "core/config/seed-templates/README.md"
    reason: "Source README is mostly generic but has agents/<agent>/ path layout drift and a few AyoAI specifics; seed gets a clean re-statement."

  - id: F3
    type: file_replace
    target: ".claude/skills/aspirations-spark/SKILL.md"
    source: "core/config/seed-templates/skills/aspirations-spark-SKILL.md"
    reason: "Source has npc-domain BIAS as active code path in program-alignment handler (lines 232,243,262-263,272). Full replacement easier than multiline inline_edit. Q26."
    pending_template: true

  - id: F4
    type: file_replace
    target: "core/config/conventions/learning-routing.md"
    source: "core/config/seed-templates/conventions/learning-routing.md"
    reason: "Multiple AyoAI references throughout the file + port leaks (28080-28083); cleanest is full file_replace"
    pending_template: true

  - id: F5
    type: file_replace
    target: "core/config/conventions/domain-overlay-pattern.md"
    source: "core/config/seed-templates/conventions/domain-overlay-pattern.md"
    reason: "Multiple AyoAI references"
    pending_template: true

  - id: F6
    type: file_replace
    target: ".claude/rules/run-full-suite-after-deep-code.md"
    source: "core/config/seed-templates/rules/run-full-suite-after-deep-code.md"
    reason: "Concrete repo refs (C:/ZakNoCloud/GitHub/Ayoai/*, Ayoai-Environment-Server, etc.) at lines 30,56,57"
    pending_template: true

  - id: F7
    type: file_replace
    target: ".claude/skills/verify-learning/SKILL.md"
    source: "core/config/seed-templates/skills/verify-learning-SKILL.md"
    reason: "~30+ domain refs across the file; too many for inline_edit; cleanest full replacement"
    pending_template: true

  # ---------------------------------------------------------------------------
  # Inline edits (priority 2) — per-file targeted patterns
  # ---------------------------------------------------------------------------
  - id: I1
    type: inline_edit
    target: "core/scripts/learning-ratio.py"
    pattern: 'PREFIX_FALLBACK = \{[^}]*\}'
    replacement: 'PREFIX_FALLBACK = {}  # populated by domain overlay (seed-clean)'
    multiline: true
    reason: "Source hardcodes AyoAI taxonomy with 'ayoai-product', 'npc-domain' labels"

  - id: I2
    type: inline_edit
    target: "core/scripts/self-drift-gate.py"
    pattern: 'os\.environ\.get\("AYOAI_AGENT", "alpha"\)'
    replacement: 'os.environ.get("MIND_AGENT", "")'
    line_hint: 256
    reason: "Hardcoded 'alpha' agent name fallback. Pattern matches full expression so G2 doesn't double-rename and nested-self-reference bug (fresh-eyes review 2026-05-19) is avoided."

  - id: I3a
    type: inline_edit
    target: "core/scripts/schema-drift-sweep.py"
    pattern: 'handoff_target = "alpha"'
    replacement: 'handoff_target = ""'
    line_hint: 336
    reason: "Hardcoded 'alpha' handoff target default. Pattern is unique in file (other 'alpha' occurrences are in comments)."

  # I3b removed 2026-05-19 fresh-eyes review — target string '"zeta"' does not exist
  # in schema-drift-sweep.py (grep confirms). The Phase 1 catalog entry was based
  # on a stale snapshot.

  - id: I4a
    type: inline_edit
    target: "core/scripts/skill-evolution-bootstrap-frontmatter.py"
    pattern: 'author="zeta"'
    replacement: 'author=""'
    line_hint: 105
    reason: "Hardcoded 'zeta' kwarg default in function signature. Use empty string default; function-arg defaults evaluate at definition time so os.environ.get() in default position is wrong (returns a runtime call result captured at import time)."

  - id: I4b
    type: inline_edit
    target: "core/scripts/skill-evolution-bootstrap-frontmatter.py"
    pattern: 'default="zeta"'
    replacement: 'default=""'
    line_hint: 186
    reason: "Hardcoded 'zeta' argparse default. Same rationale as I4a — empty string default; user can pass --author at runtime."

  - id: I4c
    type: inline_edit
    target: "core/scripts/skill-evolution-bootstrap-frontmatter.py"
    pattern: '\(default: zeta\)'
    replacement: '(default: empty)'
    line_hint: 186
    reason: "Help-text leak — '(default: zeta)' inside the argparse help string at line 186."

  # I5: previously rewrote `"asp-001"` → `config.get("default_aspiration_id", "asp-001")`.
  # That replacement injected a `config` reference that is not in scope at the
  # call site (line 464 of aspirations_write.py), producing a NameError at
  # runtime. asp-001 is a framework-default ID (init-mind.sh auto-seeds it
  # as the bootstrap aspiration in every deployment), not a domain leak,
  # so the literal is correct to ship as-is. Rule removed 2026-05-20 after
  # fresh-eyes review surfaced the scope bug.

  - id: I7
    type: inline_edit
    target: "core/config/aspirations.yaml"
    pattern: 'AyoAI'
    replacement: 'the framework'
    line_hint: 1174

  - id: I8
    type: inline_edit
    target: "core/config/tree.yaml"
    pattern: 'npc-intelligence'
    replacement: 'domain-intelligence'
    line_hint: 106

  - id: I9
    type: inline_edit
    target: "core/config/conventions/coordination.md"
    pattern: 'Town Square'
    replacement: 'shared channel'
    line_hint: 519

  - id: I14
    type: inline_edit
    target: ".claude/skills/aspirations-precheck/SKILL.md"
    pattern: '(AyoSeed|jose|AjaxKey|RichmondKey)'
    replacement: '<DOMAIN_IDENTIFIER>'
    line_hint: [275, 276, 277]

  - id: I15
    type: inline_edit
    target: ".claude/skills/aspirations-precheck/SKILL.md"
    pattern: '(AspirationalModule|TestAspirationalModuleInvariants|IntentEngineVerticle)'
    replacement: '<JAVA_CLASS_NAME>'
    line_hint: [881, 882, 883]

  - id: I18a
    type: inline_edit
    target: "core/config/aspirations.yaml"
    pattern: '\b(alpha|bravo|charlie|delta|echo|foxtrot|zeta)\b'
    replacement: 'agent-name'
    when_in_context: "example_value"
    reason: "Hardcoded agent names in pedagogical examples (Q4/Q9). charlie+delta retained for historical content (merged into foxtrot 2026-07-07)."
    note: "Word-boundary regex; only fires inside YAML 'example:' or 'e.g.' contexts. Q28 design."

  # ---------------------------------------------------------------------------
  # Global regex (priority 3) — repo-wide patterns
  # ---------------------------------------------------------------------------
  - id: G1
    type: global_regex
    pattern: 'X-Ayoai-'
    replacement: 'X-Mind-'
    applies_to: ["**/*.py", "**/*.sh", "**/*.md", "**/*.yaml", "**/*.json"]
    reason: "HTTP header convention — ~113 hits across core/scripts/ + mind_api/"

  - id: G1b
    type: global_regex
    pattern: 'x-ayoai-'
    replacement: 'x-mind-'
    applies_to: ["**/*.py", "**/*.sh", "**/*.md", "**/*.yaml", "**/*.json"]
    reason: "HTTP header READS (lowercase) — the daemon does ctx.headers.get('x-ayoai-agent'/'x-ayoai-sid') in ~38 sites across mind_api/src/endpoints + meta. G1's case-sensitive 'X-Ayoai-' missed these, so MIND_-converged wrappers (which send X-Mind-Agent/Sid) mismatched the daemon's still-x-ayoai- reads, breaking EVERY agent-scoped endpoint (retrieve, agent writes, wm, history) at the destination. Surfaced 2026-06-27 prod cutover: /v1/retrieve returned agent_unset despite a correct X-Mind-Agent header. G1+G1b together converge both the uppercase send-side and lowercase read-side."

  - id: G2
    type: global_regex
    pattern: 'AYOAI_'
    replacement: 'MIND_'
    applies_to: ["**/*"]
    apply_even_if_exempt: true
    excludes_paths:
      - "core/config/seed-manifest.yaml"
      - "core/scripts/seed-path-self-reference-scan.sh"
      - ".claude/skills/seed/SKILL.md"
      - "core/config/domain-term-blocklist.txt"
      - ".claude/rules/domain-free-examples.md"
    reason: "Env var convention — ~80 hits across .claude/, core/, mind_api/. apply_even_if_exempt: G2 renames FUNCTIONAL env-var identifiers (AYOAI_AGENT/SID/WORLD/META), not domain strings, so it must fire even in domain-leak-exempt files (the marker protects domain comment-strings via G3/G4, not env vars). Without this, the 11 exempt files that read AYOAI_AGENT kept the legacy brand at the destination, forcing the prod dual-export bridge. excludes_paths holds out seed machinery where AYOAI_ is protected DATA (this manifest's own rule patterns, the self-ref-scan detection literal, seed sentinels) — converting those would corrupt the transform's definitions."

  - id: G3
    type: global_regex
    pattern: '\bAyoai-(Mind|Environment-Server|Environment-Processor|Public-Web-App)\b'
    replacement: 'Mind-\1'
    applies_to: ["**/*.md"]
    reason: "Repo name references in markdown"

  - id: G4
    type: global_regex
    pattern: '\bAyoAI\b'
    replacement: 'the framework'
    applies_to: ["**/*.md", "**/*.py", "**/*.sh", "**/*.yaml"]
    reason: "Brand name in prose and code comments. Extended from .md-only after fresh-eyes review 2026-05-19 found 3 .py files (audit-applies-to.py, gates/capability_route.py, gates/scaffolded_exploration.py) leaking 'AyoAI' in docstrings."

  - id: G5
    type: global_regex
    pattern: 'C:[/\\]+ZakNoCloud[/\\]+GitHub[/\\]+Ayoai-Mind'
    replacement: '<PROJECT_ROOT>'
    applies_to: ["**/*"]
    reason: "Hardcoded source repo path"

  - id: G5b
    type: global_regex
    pattern: 'C:[/\\]+ZakNoCloud[/\\]+GitHub[/\\]+Claude-Mind'
    replacement: '<DESTINATION_REPO>'
    applies_to: ["**/*"]
    reason: "Claude-Mind path used in /seed skill's user-facing example commands (e.g., `/seed plant C:\\ZakNoCloud\\GitHub\\Claude-Mind`)."

  - id: G5c
    type: global_regex
    pattern: 'C:[/\\]+ZakNoCloud[/\\]+GitHub[/\\]+[A-Za-z0-9_-]+'
    replacement: '<REPO_ROOT>'
    applies_to: ["**/*"]
    reason: "Catch-all for other repos under the same parent dir (Ayoai-Environment-Server, Ayoai-Public-Web-App, etc. — referenced in pedagogical examples in run-full-suite-after-deep-code.md and elsewhere)."

  - id: G6
    type: global_regex
    pattern: 'C:[/\\]+Users[/\\]+Zachary'
    replacement: '<USER_HOME>'
    applies_to: ["**/*"]
    reason: "Hardcoded user home path"

  - id: G6b
    type: global_regex
    pattern: 'ZakNoCloud'
    replacement: '<WORKSPACE>'
    applies_to: ["**/*"]
    reason: "Bare 'ZakNoCloud' token — user-specific workspace dir name appears in many MSYS/Windows path examples in docstrings/comments. No word-boundary — also catches malformed bug forms like 'C:ZakNoCloudGitHub' (test_journal_tree_cite_scan.py:170 documents this failure mode where backslash-escape consumes the separator)."

  - id: G6c
    type: global_regex
    pattern: '\bZachary\b'
    replacement: 'user'
    applies_to: ["**/*"]
    reason: "Bare 'Zachary' token — catches remaining references after G6 (e.g., 'Zachary's home dir' in prose, or path forms without C:/Users prefix)."

  - id: G7
    type: global_regex
    pattern: 'zachary\.kysar@gmail\.com'
    replacement: ''
    applies_to: ["**/*"]
    reason: "Email leak (defense in depth — main location in excluded dir)"

  - id: G8
    type: global_regex
    pattern: 'alert@ayoai\.com'
    replacement: 'alert@example.com'
    applies_to: ["**/*"]
    reason: "Coordination alert email — coordination.md:383,389"

  - id: G8b
    type: global_regex
    pattern: '\bayoai\.com\b'
    replacement: 'example.com'
    applies_to: ["**/*"]
    reason: "Lowercase ayoai.com domain mentions — catches operator.ayoai.com, agents@ayoai.com, and other survivors of G4/G8 (fresh-eyes review 2026-05-19 surfaced gap). G8 runs first to handle alert@ specifically; this is the generic catch-all."

  - id: G9
    type: global_regex
    pattern: 'OneDrive on this machine'
    replacement: 'cloud-synced filesystem'
    applies_to: ["mind_api/**/*.py"]
    reason: "Path environment leak in comments (6 locations)"

  - id: G10
    type: global_regex
    pattern: 'AYOBRIDGE_BASE'
    replacement: 'BRIDGE_BASE'
    applies_to: ["core/scripts/**/*.py"]
    reason: "Domain-specific env var name"

  - id: G11
    type: global_regex
    pattern: 'ROBLOX_REPO'
    replacement: 'DOMAIN_REPO'
    applies_to: ["core/scripts/**/*.py"]
    reason: "Domain-specific env var name"

  - id: G12
    type: global_regex
    pattern: 'roblox_studio_session_required'
    replacement: 'domain_session_required'
    applies_to: ["core/scripts/**/*"]
    reason: "Domain-specific status string"

  - id: G13
    type: global_regex
    pattern: 'g-\d{3}-\d{2,4}'
    replacement: ''
    applies_to: ["core/**/*.py", "core/**/*.sh", "core/**/*.md", "core/**/*.yaml", "mind_api/**/*.py"]
    when_in_context: "comment"
    reason: "Production goal IDs in comments (~30 hits). Pattern MUST match the canonical goal-id regex g-\\d{3}-\\d{2,4} (aspirations.py:1301). Do NOT narrow the second group back to \\d{1,3}: goal sequences expanded to 4 digits 2026-05-19 (g-115-999+), and \\d{1,3} greedily matched only the first 3 digits of a 4-digit seq — stripping g-115-2397 to a bare '7' fragment in every downstream seed (g-115-2919)."

  - id: G14
    type: global_regex
    pattern: 'asp-\d{3}'
    replacement: ''
    applies_to: ["core/**/*.py", "core/**/*.sh", "core/**/*.md"]
    excludes_paths: ["core/tests/**", "core/scripts/tests/**"]
    when_in_context: "comment"
    reason: "Production aspiration IDs in comments (~20 hits)"

  # ---------------------------------------------------------------------------
  # Word-list strip (priority 4) — strip identifiers in comments
  # ---------------------------------------------------------------------------
  - id: W1
    type: word_list_strip
    words:
      - "AyoBridge"
      - "EFS"
      - "Lambda"
      - "DynamoDB"
      - "CloudWatch"
      - "boto3"
      - "API Gateway"
      - "Security group"
      - "Studio Bridge"
      - "Town Square"
      - "BitNet"
      - "IAUS"
      - "AjaxKey"
      - "RichmondKey"
      - "BTEvents"
      - "Roblox-Integration"
      - "Environment-Processor"
      - "Operator-API"
    applies_to: ["core/**/*.py", "core/**/*.sh", "mind_api/**/*.py"]
    when_in_context: "comment"
    reason: "Scattered domain identifiers in comments/docstrings"

  - id: W2
    type: word_list_strip
    words: ["alpha", "bravo", "charlie", "delta", "echo", "foxtrot", "zeta"]
    applies_to: ["core/config/*.yaml", "core/config/*.md", ".claude/rules/*.md"]
    when_in_context: "example_marker"
    replacement: "agent-name"
    reason: "Hardcoded agent names in pedagogical examples (Q4/Q9). charlie+delta retained for historical content (merged into foxtrot 2026-07-07)."
    note: "Strict word-boundary + context marker required (e.g.:, for example, example:); avoids false-positives on 'alphabet', 'betacarotene' etc. Q28 design."


# =============================================================================
# CRUFT_PATTERNS — removed at destination POST-COPY
# =============================================================================
# Cleaned at destination after plant, even if they exist from prior /start
# attempts or other runtime activity at destination.
cruft_patterns:
  - ".latest-session-id"
  - ".stop-hook-log"
  - ".stop-hook-timing.jsonl"
  - "bash.exe.stackdump"
  - ".active-agent-*"
  - ".hook-fires/"
  - ".bash-inject-misses.jsonl"
  - ".bash-inject-no-binding-*"
  - ".sid-collisions.jsonl"
  - "core/logs/"
  - "mind_api/state/"
  - ".autocompact-serialize-lock/"
  - ".iteration-commit-lock/"
  - "core/.pycache/"
  - "core/.pytest_cache/"
  - ".pytest_cache/"
  - "core/scripts/__pycache__/"
  - "core/scripts/.python-shim/"

  # Known orphan from old seed (Apr 2026 version) — removed from source but
  # still survives at any destination that received the old seed. Adding here
  # so cruft cleanup catches it. Proper orphan-detection mechanism (compare
  # dest tree against manifest's include set, remove unmanifested files) is
  # future work — destructive, needs careful design.
  - "core/scripts/set-active-agent-env.sh"

  # Forged/domain skill dirs are DELIBERATELY NOT cruft_patterns (g-115-2739).
  # Skill-dir lifecycle at a destination is do_remove_orphans' SOLE jurisdiction:
  # it fails SAFE when the registry is unlocatable, protects registry-forged AND
  # SKILL.md-present skills (root cause A, g-115-2738 — a promoted-but-unregistered
  # skill is still a real skill), and gates on `rel in expected`. Listing a skill
  # dir here let the cruft lane delete a live skill whose registration (external,
  # gitignored world/forged-skills.yaml) never traveled with the git promotion —
  # the notify-user deletion, twice (v2.4.0 SES transport; v2.5.0 g-115-2736).
  # Stale forged skills from an earlier seed are removed by orphan-removal only
  # when genuinely absent from the source include set AND carrying no SKILL.md.


# =============================================================================
# POST_COPY_ACTIONS — executed (or reported) after plant
# =============================================================================
post_copy_actions:
  - id: A1
    description: "Regenerate _tree.yaml at destination to remove forged-skill references (Q22)"
    type: command
    command: "py -3 core/scripts/skill-tree-restructure.py --apply"
    run_at: destination
    required: true
    on_failure: warn

  - id: A2
    description: "Verify destination prerequisites (Python 3.8+, PyYAML, bash 4+)"
    type: command
    command: "bash core/scripts/check-prerequisites.sh"
    run_at: destination
    required: false
    on_failure: warn

  - id: A3
    description: "Inform user of next steps at destination"
    type: message
    text: |
      Next steps at destination:
        1. Copy .env.example to .env.local and fill in any secrets your domain needs
        2. Type /start <agent-name> to initialize world/agent/meta

  - id: A4
    description: "Scan destination for source-repo path self-references"
    type: command
    command: "bash core/scripts/seed-path-self-reference-scan.sh ."
    run_at: destination
    required: false
    on_failure: warn
